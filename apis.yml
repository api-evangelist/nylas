- aid: nylas:nylas-policies-api
  name: Nylas Policies API
  description: >-
    The Policies endpoints let you define the operational configuration for Nylas Agent Accounts, including
    message limits, attachment constraints, spam detection settings, and linked rules for inbound message
    filtering. Each policy is scoped to your application and can be assigned to one or more Agent Accounts,
    or attached to a [workspace](/docs/reference/api/workspaces/) to apply its limits and spam settings
    to the Agent Accounts it contains.


    Policies let you control:


    - **Limits** — Attachment sizes, counts, allowed types, total storage, daily message quotas, and retention
    periods for the inbox and spam folders.

    - **Spam detection** — DNS-based block list (DNSBL) checking, header anomaly detection, and sensitivity
    tuning.

    - **Rules** — Link filtering rules (created via the Rules API) to automatically process inbound messages
    based on sender criteria.


    Policy limits are validated against your plan's maximum values. If a limit field is omitted, it defaults
    to the plan maximum. If a requested value exceeds the plan limit, the API returns an error.
