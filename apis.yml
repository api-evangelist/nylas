aid: nylas
name: Nylas
description: >-
  Nylas connects your application to every email inbox and calendar in the world.
  The Nylas v3 platform provides REST APIs for email, calendar, contacts,
  scheduling, meeting notetaking, authentication, and administration across
  Google, Microsoft, Exchange, iCloud, Yahoo and any IMAP provider. Official SDKs
  cover Node.js, Python, Ruby and Kotlin/Java, alongside a CLI, a hosted MCP
  server, and Agent Accounts that provision a Nylas-hosted mailbox and calendar
  for autonomous agents without requiring an OAuth flow.
