- aid: nylas:nylas-signatures-api
  name: Nylas Signatures API
  description: >-
    The Nylas Signatures API lets you create and store HTML email signatures on Nylas, and reference them
    by ID when sending messages or creating drafts. Nylas appends the signature to the end of the email
    body at send time.


    Nylas signatures are managed entirely through this API and are separate from any signatures configured
    in the user's email provider (Gmail, Outlook, etc.). Provider signatures are not synced to Nylas,
    and are not applied to emails sent through the Nylas API.


    Each grant supports up to 10 signatures, so users can maintain variants for different contexts (for
    example, "Work", "Personal", or "Mobile"). Signatures are automatically deleted when the parent grant
    is deleted.


    For more information, see the [Using email signatures](/docs/v3/email/signatures/) documentation.
