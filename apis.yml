- aid: nylas:nylas-lists-api
  name: Nylas Lists API
  description: >-
    The Lists endpoints let you manage typed collections of values (email addresses, domains, or top-level
    domains) that can be referenced by Rules using the `in_list` condition operator. Lists provide a way
    to maintain dynamic allow lists and block lists that are evaluated during inbound rule processing
    and outbound send evaluation without needing to update individual rules.


    Each list has a `type` that determines what kind of values it accepts and which rule condition fields
    it can be matched against:


    - **`domain`** — Domain names (for example, `example.com`). Matched against the `from.domain` or `recipient.domain`
    rule condition.

    - **`tld`** — Top-level domains (for example, `com`, `xyz`). Matched against the `from.tld` or `recipient.tld`
    rule condition.

    - **`address`** — Full email addresses (for example, `user@example.com`). Matched against the `from.address`
    or `recipient.address` rule condition.


    List `type` is set at creation time and cannot be changed. Items within a list are managed via the
    `/v3/lists/{list_id}/items` sub-resource endpoints. Values are automatically normalized (lowercased
    and trimmed) and validated against the list's `type`. Duplicate additions are silently ignored. You
    can submit up to 1000 items per add or remove request, and each item value can be at most 500 characters.
