- aid: nylas:nylas-availability-api
  name: Nylas Availability API
  description: >-
    Nylas Scheduler uses the `/v3/scheduling/availability` endpoint to retrieve availability information.
    When you make a request, Nylas validates the provided session ID and uses it to retrieve the related
    Configuration object.


    When a Configuration participant is an [Agent Account](/docs/v3/scheduler/agent-accounts/), Scheduler
    reads busy time from that account's primary calendar only. Set the participant's `availability.calendar_ids`
    to `["primary"]`; additional calendars on the Agent Account don't affect the returned slots.


    ## Availability scopes


    The table below lists the Availability endpoints and which scopes they require. The table shortens
    the full scope URI for space reasons, so add the prefix for the provider when requesting scopes.


    The ☑️ in each column indicates the most restrictive scope you can request for each provider and still
    use that API. More permissive scopes appear under the minimum option. If you're already using one
    of the permissive scopes, you don't need to add the more restrictive scope.


    | Endpoint                           | Google Scopes</br>`https://www.googleapis.com/auth/...` | Microsoft
    Scopes</br>`https://graph.microsoft.com/...` |

    | :--------------------------------- | :------------------------------------------------------ | :-----------------------------------------------------
    |

    | **GET** `/scheduling/availability` | `/calendar.readonly` ☑️</br>`/calendar`                 | `Calendars.Read`
    ☑️</br>`Calendars.ReadWrite`          |


    For more information about scopes, see [Using scopes to request user data](/docs/dev-guide/scopes/).
