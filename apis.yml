- aid: nylas:nylas-application-level-templates-api
  name: Nylas Application-level templates API
  description: >-
    Application-level templates let you create reusable messages with dynamic content. Each template is
    linked to the Nylas application associated with the API key specified in a [Create Template request](/docs/reference/api/application-level-templates/create-app-level-template/).


    <div id="admonition-info">💡 <b>If you want to create templates for specific grants, use the <a href="/docs/reference/api/grant-level-templates/">grant-level
    templates endpoints</a></b>.</div>


    Nylas supports the following templating engines:


    - [Handlebars](https://handlebarsjs.com/)

    - [mustache }}](https://mustache.github.io/)

    - [Nunjucks](https://mozilla.github.io/nunjucks/)

    - [Twig](https://twig.symfony.com/)


    We recommend you use [mustache }}](https://mustache.github.io/) or [Handlebars](https://handlebarsjs.com/)
    if you need a simple implementation. If you need more advanced formatting, conditions, or layouts,
    we recommend [Nunjucks](https://mozilla.github.io/nunjucks/) or [Twig](https://twig.symfony.com/).
