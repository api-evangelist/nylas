- aid: nylas:nylas-manage-domains-api
  name: Nylas Manage Domains API
  description: >-
    The Manage Domains endpoints let you register, verify, update, and delete email domains for use with
    [Transactional Send](/docs/v3/getting-started/transactional-send/) and [Nylas Agent Accounts](/docs/v3/agent-accounts/).


    Before you can use these endpoints, you need a [Nylas Service Account](/docs/v3/auth/nylas-service-account/)
    to authenticate your requests. Nylas Service Account authentication uses cryptographic request signing
    with four custom headers (`X-Nylas-Kid`, `X-Nylas-Timestamp`, `X-Nylas-Nonce`, `X-Nylas-Signature`).


    ## Domain verification


    After you register a domain, you must verify DNS records before you can use it. Call the **Get domain
    info** endpoint to retrieve the DNS records you need to configure, then call the **Verify domain**
    endpoint after you've added them to your DNS provider.


    The verification types are:


    | Type        | Required for                       | Description                              |

    | ----------- | ---------------------------------- | ---------------------------------------- |

    | `ownership` | All domains                        | Proves you control the domain.           |

    | `dkim`      | Transactional Send, Agent Accounts | Authenticates outgoing mail.             |

    | `spf`       | Transactional Send, Agent Accounts | Authorizes Nylas to send on your behalf. |

    | `feedback`  | Transactional Send, Agent Accounts | Enables bounce reporting.                |

    | `mx`        | Agent Accounts                     | Routes incoming mail to Nylas.           |


    Nylas tracks `dmarc` and `arc` records but does not currently enforce or verify them. Setting up DMARC
    is highly recommended to prevent emails going to spam.


    For more information, see [Managing domains](/docs/v3/email/domains/).
