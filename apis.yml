- aid: nylas:nylas-connector-credentials-api
  name: Nylas Connector credentials API
  description: >-
    A Nylas connector credential is a special type of record that securely stores information (such as
    provider settings) that allows you to connect using an administrator account. Nylas securely stores,
    hashes, and encrypts the connector credential's sensitive data, and the contents vary depending on
    the authentication provider.


    Bulk authentication grants use connector credentials to connect or reconnect user accounts to your
    Nylas application. You can also use them to override a connector's settings to perform administrative
    tasks. For more information, see the [Bulk authentication grant documentation](/docs/v3/auth/bulk-auth-grants/).


    Both Google and Microsoft bulk authentication grants can use connector credentials.


    To override the default values in a provider's connector settings (for example, the `client_secret`
    and `client_id`), [create a grant using Bring Your Own Authentication](/docs/v3/auth/bring-your-own-authentication/)
    and provide the connector credential in your request payload, along with the values to override.


    ## Connector credential limitations


    Keep the following limitations in mind as you work with connector credentials:


    - A connector credential _must_ be connected to an existing Nylas connector.

    - Each connector credential must have a unique name.

    - When you make a [Create Credential request](/docs/reference/api/connector-credentials/create_credential/),
    Nylas checks if a connector credential with the same parameters exists. If one _does_ exist, Nylas
    uses that connector credential instead of creating one.
