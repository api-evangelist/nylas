- aid: nylas:nylas-amazon-sns-notifications-api
  name: Nylas Amazon SNS Notifications API
  description: >-
    Amazon SNS notification channels allow you to receive Nylas event notifications through Amazon Simple
    Notification Service (SNS) instead of webhooks.


    To use Amazon SNS notifications, you need to set up an SNS topic and an IAM role in your AWS account.
    The topic ARN must start with `arn:aws:sns:`. The IAM role must allow Nylas to assume it via STS `AssumeRoleWithWebIdentity`
    and must have `sns:Publish` permission on the topic. For detailed set up instructions, see the [Amazon
    SNS notification channel documentation](/docs/v3/notifications/sns-channel/).


    The Amazon SNS notification channels use the same notification [trigger types and schemas](/docs/reference/notifications/)
    as webhook notifications, and require the same [provider scopes](/docs/dev-guide/scopes/).


    Nylas strongly recommends setting `compressed_delivery` to `true` when you create an SNS channel.
    SNS enforces a 256 KB message size limit, and gzip compression is the simplest way to keep large `message.*`
    notifications inside it. Nylas adds a `content_encoding: gzip+base64` message attribute so your subscriber
    knows which messages to decompress. For setup and the decode pattern, see [Reducing payload size with
    compression](/docs/dev-guide/best-practices/compression/).
  humanURL: https://developer.nylas.com/docs/reference/api/applications/
