- aid: nylas:nylas-smart-compose-api
  name: Nylas Smart compose API
  description: >-
    The Smart Compose endpoints extend the Nylas Messages API. Currently, Smart Compose supports only
    two methods of getting AI responses: you can either receive them as a REST response in a single JSON
    blob, or use server-sent events (SSE) to stream the response tokens as Nylas receives them.


    If you want to receive responses using the REST method, add the `Accept: application/json` header.
    Nylas will return a single JSON blob. If you use this method, you might want to add a "working" indicator
    to your UI, as response times may vary.


    To enable SSE for a request, add the `Accept: text/event-stream` header.


    For more information, see the [Smart Compose documentation](/docs/v3/email/smart-compose/).


