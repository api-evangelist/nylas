x-provenance:
  provider_published: true
  summary: >-
    The artifacts in this repository were authored by Nylas and submitted as
    api-evangelist/nylas#1, then verified by API Evangelist against live URLs
    before merge. The contract registered below is Nylas' own published
    document, harvested verbatim.
  submitted_by:
    name: Nick Barraclough
    role: Developer documentation, Nylas
    pull_request: https://github.com/api-evangelist/nylas/pull/1
  api_evangelist_changes:
    - >-
      Harvested the published contract from
      https://developer.nylas.com/_spec-files/nylas-api.yaml to
      openapi/_original/nylas-api-openapi.yml (sha256
      7ff001d571e163b1ffe22178741b59f813d8208ec878157a839a33dc2c13fd35) and split
      it into the 13 domain specs the provider's own entries name. The PR pointed
      all fourteen entries at the remote URL, which would have left every local
      spec unregistered and deleted on the next rebuild, and left a 1.67 MB
      contract to be read through a 32 KB embedded-source cap.
    - >-
      Quarantined eleven API Evangelist scaffolds to openapi/_scaffold/ and
      stamped each one. They were derived from reading developer.nylas.com/docs/
      and said so in their own info.description, but carried no provenance
      marker, so the rubric had been crediting 22 modelled operations at full
      first-party weight while the provider's real 208-operation contract went
      uncounted. The provider identified this from the outside.
    - >-
      Hoisted `servers:` above `info:` in every emitted document. Semantically
      inert -- a YAML mapping is unordered -- but Nylas' info.description is a
      single ~20 KB line carrying an embedded Postman payload, which pushed the
      servers block past the 24 KB head window the provenance indexer reads. All
      thirteen splits registered as no_servers until this.
  verified:
    date: '2026-08-21'
    contract: >-
      OpenAPI 3.1.0, 118 paths, 208 operations, 174 component schemas, 100% of
      operations carrying summary, description, tag and a unique operationId,
      x-code-samples on 208 of 208. Counted from the harvested document, not
      from the submission.
    also_confirmed: >-
      All five .well-known paths, both MCP endpoints (401, live and auth-gated),
      all published rate limits, and the trust-center compliance list. The
      provider's disclosed negatives were confirmed as negatives: no A2A
      protocolVersion on the agent card, no webhooks object, and Idempotency-Key
      on exactly 2 of 95 mutating operations.
