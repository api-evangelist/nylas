- aid: nylas:nylas-notifications-api
  name: Nylas Notifications API
  description: >-
    Change notifications. Nylas pushes events for messages, threads, calendars, events, grants and
    Notetaker over three interchangeable transports carrying the same payloads: HTTPS webhooks,
    Google Cloud Pub/Sub, and Amazon SNS. Covers subscription CRUD, delivery testing, mock payloads
    and the source IP ranges to allowlist. There is no polling requirement, and no WebSocket or SSE
    surface.
  humanURL: https://developer.nylas.com/docs/reference/notifications/
  baseURL: https://api.us.nylas.com
  tags:
  - Webhooks
  - Notifications
  - Event
