# Nylas Notifications — AsyncAPI 3.1. Authored by Nylas; see info.x-provenance.
asyncapi: 3.1.0
id: urn:com:nylas:v3:notifications
info:
  title: Nylas Notifications
  version: v3
  description: 'Change notifications Nylas pushes for grants, messages, message tracking, folders, calendars, events,
    contacts, Scheduler bookings, Notetaker, ExtractAI, Transactional Email and Agent Accounts. Every notification
    is a CloudEvents 1.0 envelope whose `data.object` carries the affected resource. The same payloads are delivered
    over three interchangeable transports: an HTTPS webhook to an endpoint you register, a Google Cloud Pub/Sub
    topic in your project, or an Amazon SNS topic in your AWS account. Nylas guarantees at-least-once delivery,
    so deduplicate on the envelope `id`. Payloads over 1 MB are truncated for `message.*` triggers and carry a `.truncated`
    suffix on `type`; `.cleaned` and `.transformed` suffixes can also combine. Subscribe to triggers with POST /v3/webhooks,
    POST /v3/channels/pubsub or POST /v3/channels/sns.'
  contact:
    name: Nylas Support
    url: https://developer.nylas.com/docs/support/
  license:
    name: Nylas Terms of Service
    url: https://www.nylas.com/legal/terms/
  externalDocs:
    description: Using webhooks with Nylas
    url: https://developer.nylas.com/docs/v3/notifications/
  tags:
  - name: Grants
    description: Notifications about grant lifecycle events including creation, updates, expiration, and deletion.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/grants/
  - name: Messages
    description: Notifications about email message events — new messages, updates, send results, bounces, and tracking.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/messages/
  - name: Message Tracking
    description: Notifications for tracked message opens, link clicks, and replies.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/message-tracking/
  - name: Message Metadata
    description: Limited notifications for Google accounts using the gmail.metadata scope.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/message-metadata/
  - name: Folders and Labels
    description: Notifications about email folder and label events.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/folders/
  - name: Calendar
    description: Notifications about calendar creation, modification, and deletion.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/calendar/
  - name: Events
    description: Notifications about calendar event creation, modification, and deletion.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/events/
  - name: Contacts
    description: Notifications about contact creation, modification, and deletion.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/contacts/
  - name: Scheduler
    description: Notifications about booking events from Nylas Scheduler.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/scheduler/
  - name: Notetaker
    description: Notifications about Notetaker bot lifecycle, meeting states, and media processing.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/notetaker/
  - name: ExtractAI
    description: Notifications when ExtractAI detects e-commerce orders, tracking, or returns in email messages.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/extractai/
  - name: Transactional Email
    description: Delivery status notifications for transactional emails.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/transactional-email/
  - name: Agent Accounts
    description: Delivery status notifications for email sent from Agent Accounts.
    externalDocs:
      url: https://developer.nylas.com/docs/reference/notifications/agent-accounts/
  x-provenance:
    method: authored
    publisher: Nylas
    source: https://developer.nylas.com/docs/reference/notifications/
    derived_from: nylas/developer.nylas.com@a7995fb6:src/_component-data/notification-schemas.json
    generated: '2026-09-28'
    note: Authored by Nylas from the notification schemas that render developer.nylas.com/docs/reference/notifications/.
      Delivery semantics are transcribed from docs/v3/notifications/, pubsub-channel and sns-channel.
defaultContentType: application/json
servers:
  webhook:
    host: '{webhookHost}'
    pathname: '{webhookPath}'
    protocol: https
    title: Your webhook endpoint
    description: 'The HTTPS endpoint you register with POST /v3/webhooks. Nylas verifies it once with a GET carrying
      a `challenge` query parameter that must be echoed in a 200 response within 10 seconds, then POSTs each notification.
      Respond 200; Nylas retries 408, 429 (honouring Retry-After), 502 and 503, marks the endpoint `failing` at
      95% non-200 over 15 minutes, keeps delivering with exponential backoff for 72 hours, then marks it `failed`.
      With `compressed_delivery: true` the body is gzip-compressed and sent with `Content-Encoding: gzip`.'
    variables:
      webhookHost:
        description: Public host of the webhook endpoint you registered.
      webhookPath:
        default: /
        description: Path of the webhook endpoint you registered.
    security:
    - $ref: '#/components/securitySchemes/nylasWebhookSignature'
    bindings:
      http: {}
    externalDocs:
      url: https://developer.nylas.com/docs/v3/notifications/
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    title: Google Cloud Pub/Sub topic (your project)
    description: 'A Pub/Sub topic in your Google Cloud project, registered with POST /v3/channels/pubsub. Grant
      roles/pubsub.publisher on the topic to nylas-datapublisher@nylas-gma-mt.iam.gserviceaccount.com. Each message
      carries a `trigger_type` attribute, plus `content_encoding: gzip` when compressed delivery is enabled. Up
      to five Pub/Sub channels per application.'
    bindings:
      googlepubsub: {}
    externalDocs:
      url: https://developer.nylas.com/docs/v3/notifications/pubsub-channel/
  sns:
    host: sns.{region}.amazonaws.com
    protocol: sns
    title: Amazon SNS topic (your AWS account)
    description: 'A Standard (not FIFO) SNS topic in your AWS account, registered with POST /v3/channels/sns. Nylas
      assumes your IAM role with AWS STS AssumeRoleWithWebIdentity using a Google-issued OIDC token and publishes
      with sns:Publish. Messages carry a `trigger_type` message attribute, plus `content_encoding: gzip+base64`
      when compressed delivery is enabled. A `connector.verification` test event is published when the channel is
      created. Up to five SNS channels per application.'
    variables:
      region:
        description: AWS region of your SNS topic.
    bindings:
      sns: {}
    externalDocs:
      url: https://developer.nylas.com/docs/v3/notifications/sns-channel/
