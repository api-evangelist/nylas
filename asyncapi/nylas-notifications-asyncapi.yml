components:
  schemas:
    NotificationEnvelope:
      $ref: ../json-schema/nylas-notification-envelope.schema.json
  messages:
    grant_created:
      name: grant.created
      title: grant.created
      summary: Sent when a user successfully authenticates with your Nylas application for the first time.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: grant.created
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-grant-created.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/grants/grant-created/
      tags:
      - name: Grants
      examples:
      - name: grant_created
        payload:
          specversion: '1.0'
          type: grant.created
          source: /nylas/system
          id: <WEBHOOK_ID>
          time: 1723821985
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              code: 25012
              grant_id: <NYLAS_GRANT_ID>
              integration_id: <NYLAS_INTEGRATION_ID>
              login_id: <LOGIN_ID>
              provider: google
              email: user@example.com
              name: John Doe
              scope:
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/calendar
          webhook_delivery_attempt: 1
    grant_updated:
      name: grant.updated
      title: grant.updated
      summary: Sent when a grant is modified, updated, or re-authenticated.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: grant.updated
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-grant-updated.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/grants/grant-updated/
      tags:
      - name: Grants
      examples:
      - name: grant_updated
        payload:
          specversion: '1.0'
          type: grant.updated
          source: /nylas/system
          id: <WEBHOOK_ID>
          time: 1723821985
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              code: 25014
              grant_id: <NYLAS_GRANT_ID>
              integration_id: <NYLAS_INTEGRATION_ID>
              provider: microsoft
              reauthentication_flag: false
              email: user@example.com
          webhook_delivery_attempt: 1
    grant_deleted:
      name: grant.deleted
      title: grant.deleted
      summary: Sent when a grant is deleted because of a Delete Grant request.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: grant.deleted
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-grant-deleted.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/grants/grant-deleted/
      tags:
      - name: Grants
      examples:
      - name: grant_deleted
        payload:
          specversion: '1.0'
          type: grant.deleted
          source: /nylas/system
          id: <WEBHOOK_ID>
          time: 1723821985
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              code: 25013
              grant_id: <NYLAS_GRANT_ID>
              integration_id: <NYLAS_INTEGRATION_ID>
              provider: google
              email: user@example.com
          webhook_delivery_attempt: 1
    grant_expired:
      name: grant.expired
      title: grant.expired
      summary: Sent when a grant's credentials expire, typically due to a change in the user's password on the provider,
        OAuth token expiration without successful refresh, the provider revoking access, or an admin revoking app
        permissions.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: grant.expired
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-grant-expired.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/grants/grant-expired/
      tags:
      - name: Grants
      description: The grant_updated_at timestamp indicates the last time the grant was successfully refreshed before
        expiration.
      examples:
      - name: grant_expired
        payload:
          specversion: '1.0'
          type: grant.expired
          source: /nylas/system
          id: <WEBHOOK_ID>
          time: 1739223251
          webhook_delivery_attempt: 1
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              code: 25009
              grant_id: <NYLAS_GRANT_ID>
              integration_id: <NYLAS_INTEGRATION_ID>
              provider: google
              email: user@example.com
              grant_updated_at: 1734200000
    grant_imap_sync_completed:
      name: grant.imap_sync_completed
      title: grant.imap_sync_completed
      summary: Sent when a grant is created for an IMAP account and the initial historic sync completes.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: grant.imap_sync_completed
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-grant-imap-sync-completed.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/grants/grant-imap_sync_completed/
      tags:
      - name: Grants
      description: The notification code `25012` is shared with `grant.created`. Use the `type` field, not `code`,
        for routing webhook payloads.
      examples:
      - name: grant_imap_sync_completed
        payload:
          specversion: '1.0'
          type: grant.imap_sync_completed
          source: /imap/emails/historic
          id: <WEBHOOK_ID>
          time: 1705315800
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              grant_id: <NYLAS_GRANT_ID>
              code: 25012
              integration_id: <INTEGRATION_ID>
              provider: imap
              type: grant.imap_sync_completed
          webhook_delivery_attempt: 1
    message_created:
      name: message.created
      title: message.created
      summary: Sent when a new message arrives or is synced for a user.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.created
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-created.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-created/
      tags:
      - name: Messages
      description: 'Payloads exceeding 1 MB are truncated: the type becomes `message.created.truncated` and the
        `body` field is removed. Re-query the [Messages API](/docs/reference/api/messages/get-messages-id/) to get
        the full message. If you have [field customization](/docs/v3/notifications/#specify-fields-for-webhook-notifications)
        enabled, the type will be `message.created.transformed`.'
      examples:
      - name: message_created
        payload:
          specversion: '1.0'
          type: message.created
          source: /google/emails/realtime
          id: <WEBHOOK_ID>
          time: 1723821985
          webhook_delivery_attempt: 1
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              id: <MESSAGE_ID>
              grant_id: <NYLAS_GRANT_ID>
              object: message
              thread_id: <THREAD_ID>
              subject: Let's send an attachment
              from:
              - email: swag@example.com
                name: Nylas Swag
              to:
              - email: nyla@example.com
              cc:
              - email: kaveh@example.com
              bcc:
              - email: leyah@example.com
              reply_to: []
              date: 1723821981
              body: "<div dir=\"ltr\">Test with attachments</div>\r\n"
              snippet: This message has an attachment.
              starred: false
              unread: false
              folders:
              - SENT
              attachments:
              - id: <ATTACHMENT_ID>
                filename: image.jpg
                content_type: image/jpeg; name="image.jpg"
                size: 4860136
                is_inline: false
                content_id: <CID>
                content_disposition: attachment; filename="image.jpg"
                grant_id: <NYLAS_GRANT_ID>
              metadata:
                key1: all-meetings
                key2: on-site
    message_created_cleaned:
      name: message.created.cleaned
      title: message.created.cleaned
      summary: Sent when a new message is synced and the [Clean Conversations](/docs/v3/email/parse-messages/) feature
        is enabled for the application. The message `body` contains cleaned markdown content instead of the original
        HTML.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.created.cleaned
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-created-cleaned.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-created-cleaned/
      tags:
      - name: Messages
      description: Cleaned notifications can also have `.transformed` and `.truncated` suffixes (for example, `message.created.cleaned.transformed`
        or `message.created.cleaned.truncated`). When `cleaning_status` is `failed`, the `body` contains the original
        uncleaned HTML.
      examples:
      - name: message_created_cleaned
        payload:
          specversion: '1.0'
          type: message.created.cleaned
          source: /google/emails/realtime
          id: <WEBHOOK_ID>
          time: 1723821985
          webhook_delivery_attempt: 1
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              attachments:
              - content_disposition: attachment; filename="image.jpg"
                content_id: <CID>
                content_type: image/jpeg; name="image.jpg"
                filename: image.jpg
                grant_id: <NYLAS_GRANT_ID>
                id: <ATTACHMENT_ID>
                is_inline: false
                size: 4860136
              bcc:
              - email: leyah@example.com
              body: '# Team Update


                Hi everyone,


                Here are the key updates from this week:


                * Project Alpha launched successfully

                * New API endpoints are live in staging

                * Next sprint planning is on Monday


                Let me know if you have questions.'
              cc:
              - email: kaveh@example.com
              cleaning_status: success
              date: 1723821981
              folders:
              - INBOX
              from:
              - email: swag@example.com
                name: Nylas Swag
              grant_id: <NYLAS_GRANT_ID>
              id: <MESSAGE_ID>
              metadata:
                key1: all-meetings
                key2: on-site
              object: message
              reply_to: []
              snippet: Hi everyone, Here are the key updates from this week.
              starred: false
              subject: Team Update - Week of Aug 12
              thread_id: <THREAD_ID>
              to:
              - email: nyla@example.com
              unread: true
    message_updated:
      name: message.updated
      title: message.updated
      summary: Sent when a user modifies or updates a message.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.updated
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-updated.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-updated/
      tags:
      - name: Messages
      description: 'Payloads exceeding 1 MB are truncated: the type becomes `message.updated.truncated` and the
        `body` field is removed. Re-query the [Messages API](/docs/reference/api/messages/get-messages-id/) to get
        the full message. If you have [field customization](/docs/v3/notifications/#specify-fields-for-webhook-notifications)
        enabled, the type will be `message.updated.transformed`.'
      examples:
      - name: message_updated
        payload:
          specversion: '1.0'
          type: message.updated
          source: /google/emails/realtime
          id: <WEBHOOK_ID>
          time: 1723821985
          webhook_delivery_attempt: 1
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              body: "<div dir=\"ltr\">Test with attachments</div>\r\n"
              cc:
              - email: nyla@example.com
                name: Nyla
              date: 1234567890
              folders:
              - INBOX
              from:
              - email: leyah@example.com
                name: Leyah Miller
              grant_id: <NYLAS_GRANT_ID>
              id: <MESSAGE_ID>
              metadata:
                key1: all-meetings
                key2: on-site
              object: message
              snippet: This message has an attachment.
              starred: false
              subject: Let's send an attachment
              thread_id: <THREAD_ID>
              to:
              - email: kaveh@example.com
              unread: true
    message_deleted:
      name: message.deleted
      title: message.deleted
      summary: Sent when a message is deleted.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.deleted
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-deleted.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-deleted/
      tags:
      - name: Messages
      examples:
      - name: message_deleted
        payload:
          specversion: '1.0'
          type: message.deleted
          source: /google/emails/realtime
          id: <WEBHOOK_ID>
          time: 1723821985
          data:
            application_id: <NYLAS_APPLICATION_ID>
            object:
              grant_id: <NYLAS_GRANT_ID>
              id: <WEBHOOK_ID>
              object: message
          webhook_delivery_attempt: 1
    message_send_success:
      name: message.send_success
      title: message.send_success
      summary: Sent when a message is sent and delivered successfully. Fires for scheduled sends (using `send_at`),
        and for synchronous sends when you enable synchronous send webhooks in the Nylas Dashboard.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.send_success
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-send-success.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-send_success/
      tags:
      - name: Messages
      description: The `body` field is typically omitted or empty in the delivered payload. Use the `snippet` field
        for a preview, or re-query the Messages API for the full body.
    message_send_failed:
      name: message.send_failed
      title: message.send_failed
      summary: Sent when a message fails to send or deliver. Fires for scheduled sends (using `send_at`), and for
        synchronous sends when you enable synchronous send webhooks in the Nylas Dashboard.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.send_failed
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-send-failed.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-send_failed/
      tags:
      - name: Messages
      description: The `error` object contains detailed failure information including provider-specific error codes.
    message_bounce_detected:
      name: message.bounce_detected
      title: message.bounce_detected
      summary: Sent when Nylas detects a Non-Delivery Report (NDR) in the sender's inbox for a message sent via
        Nylas. Requires the provider to generate an NDR. Available for Google, Microsoft Graph, iCloud, and Yahoo.
      contentType: application/json
      payload:
        allOf:
        - $ref: '#/components/schemas/NotificationEnvelope'
        - type: object
          properties:
            type:
              const: message.bounce_detected
            data:
              type: object
              properties:
                object:
                  $ref: ../json-schema/nylas-message-bounce-detected.schema.json
      externalDocs:
        url: https://developer.nylas.com/docs/reference/notifications/messages/message-bounce_detected/
      tags:
      - name: Messages
      examples:
      - name: message_bounce_detected
        payload:
          specversion: '1.0'
          type: message.bounce_detected
          source: /nylas/send
          id: <WEBHOOK_ID>
          time: 1723821985
          webhook_delivery_attempt: 1
          data:
            application_id: <NYLAS_APPLICATION_ID>
            grant_id: <NYLAS_GRANT_ID>
            object:
              bounce_reason: An example message describing the reason for the bounce.
              bounce_date: Wed, 25 Jan 2023 10:18:39 -0800
              bounced_addresses: this.address.bounced@example.com
              type: mailbox_unavailable
              code: '550'
              grant_id: <NYLAS_GRANT_ID>
              origin:
                to:
                - jdoe@example.com
                from: sender@example.com
                cc:
                - sam.lee@example.com
                bcc:
