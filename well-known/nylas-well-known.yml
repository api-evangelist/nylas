  - host: https://mcp.us.nylas.com
    documents:
      - path: /.well-known/oauth-protected-resource
        status: 401
        type: application/json
        note: >-
          Every path on the MCP host answers 401 without a Bearer token,
          including /.well-known/*. Auth is a Nylas API key, not OAuth, so there
          is no RFC 9728 protected-resource document to serve.
      - path: /.well-known/mcp/server-card.json
        status: 401
        type: application/json
        note: >-
          The server card is served from the developer host, not the MCP host.
