      - path: /openapi.yaml
        status: 200
        type: application/yaml; charset=utf-8
        note: OpenAPI 3.1 contract as YAML. Same document as /_spec-files/nylas-api.yaml.
      - path: /llms.txt
        status: 200
        type: text/plain; charset=utf-8
      - path: /llms-full.txt
        status: 200
        type: text/plain; charset=utf-8
        note: >-
          Served as text/plain although the Link header advertises it as
