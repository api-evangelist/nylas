robots:
  host: https://developer.nylas.com
  content_signal: search=yes, ai-input=yes, ai-train=yes
  note: >-
    robots.txt carries a Content-Signal declaration under User-agent: * and
    explicit Allow rules for GPTBot, ChatGPT-User, OAI-SearchBot, ClaudeBot,
    Claude-Web, anthropic-ai, Google-Extended, PerplexityBot, Perplexity-User,
    Applebot-Extended, CCBot, Amazonbot and meta-externalagent. It disallows
    /cdn-cgi/, declares the sitemap at
    https://developer.nylas.com/sitemap-index.xml, and points in comments at
    /llms.txt, /llms-full.txt and /openapi.json.
