description: >-
  Published Nylas plans and pricing, transcribed from the plan cards and the
  plan comparison table at https://www.nylas.com/pricing/ on 2026-08-20. This
  replaces a generated scaffold that described a three-tier Free / Professional /
  Enterprise structure metered by monthly API request quotas. None of that
  existed. Nylas sells five plans and does not meter by API request. The billing
  unit is the connected account, alongside separate allowances for Agent
  Accounts, storage, bandwidth, outgoing email and Notetaker minutes. Rate limits
  are not tied to a plan; see rate-limits/nylas-rate-limits.yml. Where the
  comparison table publishes no allowance for a plan on a given dimension it is
  omitted here rather than inferred: the Activity Drivers table carries columns
  only for Free, Full Platform and Enterprise.
billing_units:
  - connected account
  - Agent Account
  - GB storage
  - GB bandwidth
  - outgoing email message
  - Notetaker minute
notes: >-
  There is no per-API-request quota on any plan. The Free plan is sandbox only
  and is not licensed for production use.
plans:
