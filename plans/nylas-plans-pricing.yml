description: >-
  Published Nylas plans and pricing, transcribed from the plan cards and the
  "What's included every month" comparison table at https://www.nylas.com/pricing/
  and verified against the live page on 2026-09-28. Nylas changed its pricing on
  2026-09-09: every plan now includes every product (email, calendar, Notetaker
  and Agent Accounts) with usage included, and usage beyond the allowance is
  billed at per-plan rates that fall on higher plans. This replaces the earlier
  five-plan structure (Free, Notetaker, Calendar, Full Platform, Enterprise).
  Nylas sells four plans: Free, Essentials, Pro and Enterprise. Pro is offered
  monthly or annually (a toggle on a single plan card), so Pro Annual is modelled
  as a billing variant of Pro rather than a separate plan. Nylas does not meter
  by API request. Rate limits are not tied to a plan; see
  rate-limits/nylas-rate-limits.yml. All prices are in USD.
billing_units:
  - connected account (email and calendar)
  - connected account (calendar-only)
  - Notetaker bot hour
  - Agent Account
  - GB storage
  - GB bandwidth
  - agent email message
currency: USD
notes: >-
  There is no per-API-request quota on any plan. A bot hour is one hour the
  Notetaker bot spends in a Google Meet, Teams or Zoom meeting. Per the page,
  most usage keeps running past the included allowance and is billed at the
  plan's overage rate; a few limits are fixed, such as on the Free plan, and
  upgrading raises them immediately. Every plan includes access to the
  developer forums; Pro Annual and Enterprise include Basic Support. The
  per-feature check marks in the comparison table are rendered as icons and are
  not transcribed here; only the numeric allowances, rates and labelled
  add-ons are.
