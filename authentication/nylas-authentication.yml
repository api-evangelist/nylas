service_account:
  name: Nylas Service Account
  status: beta
  docs: https://developer.nylas.com/docs/v3/auth/nylas-service-account/
  scope: organization
  description: >-
    Organization-level authentication for Nylas admin APIs, currently the
    Manage Domains API and the Manage API Keys API. Requests are signed with an
    RSA private key from a credentials JSON file issued by Nylas Support,
    rather than carrying an API key or access token. The signature is a
    Base64-encoded RSA-SHA256 signature (RSA PKCS#1 v1.5, 2048-bit minimum) of
    a SHA-256 digest of canonical JSON containing path, lowercase method,
    timestamp, nonce and, for POST/PUT/PATCH, the request payload.
  headers:
  - X-Nylas-Kid
  - X-Nylas-Timestamp
  - X-Nylas-Nonce
  - X-Nylas-Signature
  replay_protection: >-
    X-Nylas-Timestamp must be within 5 minutes of server time, and duplicate
    X-Nylas-Nonce values (minimum 16 characters) are rejected.
  declared_in_contract: false
  contract_note: >-
    Not declared as a securityScheme in the published OpenAPI contract. The
    /v3/admin/domains and /v3/admin/applications/{application_id}/api-keys
    operations declare NYLAS_API_KEY and ACCESS_TOKEN instead.
notes: >-
  All three declared schemes are HTTP Bearer. Security is declared globally in
  the contract and overridden per operation on 210 of 213 operations. Nylas does
  not accept credentials in query strings. The Nylas Service Account's
  request-signing mechanism is documented but not declared in the contract. The
  previous version of this artifact described a single generic "BearerAuth"
  scheme derived from a summary scaffold; the three schemes above are the ones
  actually declared in the published OpenAPI contract.
