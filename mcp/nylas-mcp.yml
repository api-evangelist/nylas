generated: '2026-08-20'
method: provider-published
authored_by: Nylas
status: published
source: https://developer.nylas.com/docs/dev-guide/mcp/
server_card: https://developer.nylas.com/.well-known/mcp/server-card.json
description: >-
  Nylas operates an official remote MCP server fronting the Nylas v3 email,
  calendar and contacts APIs, deployed per region at https://mcp.us.nylas.com
  and https://mcp.eu.nylas.com. Transport is streamable HTTP. Authentication is
  a Nylas API key presented as a Bearer token, the same key used for direct REST
  calls, so no separate OAuth client registration is required. Nylas publishes a
  server card at /.well-known/mcp/server-card.json on its developer host and
  advertises it from a Link header on every page. Tool list captured verbatim
  from that server card.
server:
  name: nylas
  transport: streamable-http
  url: https://mcp.us.nylas.com
  auth: bearer
  auth_header: Authorization
  auth_scheme: Bearer
  credential_source: https://dashboard-v3.nylas.com/
  regions:
    - region: us
      url: https://mcp.us.nylas.com
    - region: eu
      url: https://mcp.eu.nylas.com
clients:
  - Claude Code
  - Claude Desktop
  - Cursor
  - Windsurf
  - VS Code
  - Codex CLI
tools:
  - name: list_messages
    description: List and search email messages.
  - name: list_threads
    description: List and search email threads.
  - name: create_draft
    description: Create a draft email.
  - name: update_draft
    description: Edit an existing draft.
  - name: confirm_send_draft
    description: Required before sending a draft (safety confirmation).
  - name: send_draft
    description: Send a previously created draft.
  - name: confirm_send_message
    description: Required before sending a message (safety confirmation).
  - name: send_message
    description: Send an email directly.
  - name: get_folder_by_id
    description: Get folder details.
  - name: list_calendars
    description: List all calendars.
  - name: list_events
    description: List events in a calendar.
  - name: create_event
    description: Create a calendar event.
  - name: update_event
    description: Update an existing event.
  - name: availability
    description: Check availability across users.
  - name: get_grant
    description: Look up a grant by email address.
  - name: current_time
    description: Get current Unix timestamp.
  - name: epoch_to_datetime
    description: Convert Unix timestamp to human-readable date.
safety:
  requires_confirmation:
    - send_message
    - send_draft
  notes: >-
    send_message and send_draft each require a preceding call to
    confirm_send_message or confirm_send_draft. The two-step flow prevents an
    agent from sending email without an explicit confirmation step.
deployment:
  mode: remote
  endpoint: https://mcp.us.nylas.com
  verified: probed
  probe: gated
  probe_detail: >-
    All paths answer HTTP 401 application/json without a Bearer token, including
    /.well-known/*. The endpoint is live and auth-gated; it does not serve an
    anonymous discovery document.
  checked: '2026-08-20'
  source: provider submission
