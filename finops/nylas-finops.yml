notes: >-
  There is no per-API-request charge and no compute-time charge on any plan. Rate limits exist but
  are not a billing dimension and do not vary by plan; see rate-limits/nylas-rate-limits.yml. This
  artifact describes how Nylas bills, for cost-allocation purposes. It is not an API description,
  and Nylas publishes no programmatic surface for reading usage or cost. See programmaticAccess above.
programmaticAccess:
  usageApi: false
  billingApi: false
  invoiceApi: false
  evidence: >-
    The Nylas v3 contract (https://developer.nylas.com/_spec-files/nylas-api.yaml, checked
    2026-09-28) exposes no usage, billing, invoice, cost, subscription, meter or quota operation: 0 of
    213. The meters below describe what Nylas bills on, not endpoints that return meter data. Cost
    and usage figures are read from the Nylas Dashboard and from invoices, not through the API.
  docs: https://developer.nylas.com/docs/support/billing/
