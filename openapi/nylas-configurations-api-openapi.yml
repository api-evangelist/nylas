      properties:
        availability:
          $ref: '#/components/schemas/configuration_participants_availability'
        booking:
          $ref: '#/components/schemas/configuration_participants_booking'
        email:
          type: string
          description: 'The participant''s email address.


            If the participant provides an `availability` or `booking` block, this email address must be

            associated with a valid Nylas grant, or the request fails. Participants supplied by email only

            (no `availability` or `booking` block) don''t require a grant. They''re treated as notification-only

            invitees: they still receive scheduling emails, but they don''t affect availability or free-busy

            calculation and can''t be selected as a round-robin host.'
          example: nyla@example.com
        grant_id:
          type: string
          description: The participant's grant ID.
        is_organizer:
          type: boolean
          description: 'When `true`, indicates that the participant is the organizer of the event.


            For non-round-robin meetings, one of the participants must be specified as the organizer. For

            round-robin meetings, remove the `is_organizer` key/value pair or set `is_organizer` to `false`

            for all participants.'
          default: false
          example: false
        name:
          type: string
          description: The participant's name.
          example: Nyla
        specific_time_availability:
          $ref: '#/components/schemas/configuration_participants_specific_time_availability'
        only_specific_time_availability:
          type: boolean
          description: 'When `true`, this participant will ONLY be available at times defined in their

            `specific_time_availability` entries. Their regular `open_hours` are ignored.


            If the config-level `availability_rules.only_specific_time_availability` is `true`,

            this participant-level setting cannot override it to `false`.


            Setting to `true` with an empty `specific_time_availability` array results in

            zero availability for this participant (useful for temporarily disabling someone).'
          default: false
          example: true
        timezone:
          type: string
          description: 'The timezone in which the participant is located, as an

            [IANA-formatted](https://en.wikipedia.org/wiki/Tz_database) string. Nylas uses this when

            calculating the participant''s open hours, and in email notifications.


            If a participant `open_hours` block includes its own `timezone`, the open-hours timezone

            overrides this participant timezone for that block. If participant `open_hours` doesn''t include

            a `timezone`, Scheduler uses this participant timezone, then `event_booking.timezone`.'
          example: America/Toronto
    configuration_participants_specific_time_availability:
      description: 'A specific date and time range when the participant is available.

        Use "00:00" for both start and end to explicitly mark a date as unavailable.'
      type: array
      items:
        type: object
        required:
        - date
        - start
        - end
        properties:
          date:
            type: string
            description: The date in YYYY-MM-DD format.
            example: '2025-08-21'
          start:
            type: string
            description: 'The start time in HH:MM format (24-hour clock).

              Use "00:00" with end "00:00" to explicitly mark this date as unavailable.'
            example: 09:00
          end:
            type: string
            description: The end time in HH:MM format (24-hour clock).
            example: '17:00'
          timezone:
            type: string
            description: 'The timezone for this specific date (e.g., "America/New_York").

              Optional for participant-level entries. Uses the participant''s timezone if not specified.'
            example: America/Toronto
    configuration:
      type: object
      required:
      - participants
      - availability
      - event_booking
      properties:
        appearance:
          description: 'An object that defines the appearance settings for the Scheduling Page. This field

            may be `null` if no appearance customization has been set.'
          anyOf:
          - $ref: '#/components/schemas/configuration_appearance'
          - type: 'null'
        availability:
          $ref: '#/components/schemas/configuration_availability'
        event_booking:
          $ref: '#/components/schemas/configuration_event_booking'
        name:
          type: string
          description: The name of the Scheduling Page. If not defined, Nylas defaults to the organizer's name.
        participants:
          type: array
          description: 'A list of participants to be included in the scheduled event.


            Participants that provide availability (through an `availability` or `booking` block) must be

            associated with a valid Nylas grant, or the request fails. Participants supplied by email only

            don''t require a grant. They''re notification-only invitees who receive scheduling emails but don''t

            affect availability calculation and can''t be selected as a round-robin host.


            This field isn''t accepted for group or round-robin configurations, which are anchored to the

            organizer''s own grant and calendar instead.'
          items:
            $ref: '#/components/schemas/configuration_participants'
        requires_session_auth:
          type:
          - boolean
          - 'null'
          description: 'When `true`, the scheduling [Availability](/docs/reference/api/availability/) and

            [Bookings](/docs/reference/api/bookings/) endpoints require a valid session ID to

            authenticate requests using the specified Configuration. This field may be `null`

            if not explicitly set on the configuration; treat `null` the same as `false`

            (the default behavior).'
          default: false
        scheduler:
          $ref: '#/components/schemas/configuration_scheduler'
        slug:
          type:
          - string
          - 'null'
          description: 'The slug for the Configuration object. This is an optional, unique identifier. You can use the

            slug instead of the `configuration_id` when making requests to the Nylas Scheduling endpoints.

            Slugs are unique to each Nylas application. This field may be `null` if no slug has been set.'
    configuration_availability_rules:
      description: Availability rules for the scheduling configuration. These rules define how Nylas calculates availability for all participants.
      type: object
      properties:
        availability_method:
          description: 'The method that Nylas uses to calculate availability for all participants. For one-on-one

            meetings, the `availability_method` is always `collective`.


            The round-robin methods, `max-fairness` and `max-availability`, don''t support

            [Agent Account](/docs/v3/scheduler/agent-accounts/) participants. Use connected grants for

            round-robin pools.'
          type: string
          default: collective
          enum:
          - collective
          - max-fairness
          - max-availability
        buffer:
          type: object
          description: The amount of buffer time to add around existing meetings, in minutes. For example, if an account has a meeting scheduled from 10–11a.m., and you set a buffer of 30 minutes, Nylas treats 9:30–11:30a.m. as busy.
          $ref: '#/components/schemas/availability_buffer'
        default_open_hours:
          type: array
          description: A default set of open hours to apply to participants that don't define participant-level `open_hours`. You can overwrite these open hours for individual participants by specifying `open_hours` on the participant object. In Scheduler configurations, set `event_booking.timezone` to control the timezone used when Scheduler evaluates default open hours.
          items:
            $ref: '#/components/schemas/configuration_availability_open_hours'
        default_specific_time_availability:
          type: array
          description: 'Default specific date and time availability that applies to ALL participants in this configuration.

            These are merged with participant-specific entries, with participant entries taking precedence

            for the same date. Use this to define organization-wide special hours (e.g., holidays, events).'
          items:
            type: object
            required:
            - date
            - start
            - end
            properties:
              date:
                type: string
                description: The date in YYYY-MM-DD format.
                example: '2025-12-25'
              start:
                type: string
                description: 'The start time in HH:MM format (24-hour clock).

                  Use "00:00" with end "00:00" to mark the date as closed/unavailable.'
                example: 09:00
              end:
                type: string
                description: The end time in HH:MM format (24-hour clock).
                example: '13:00'
              timezone:
                type: string
                description: 'The timezone for this specific date entry (e.g., "America/New_York").

                  Required when using default_specific_time_availability to ensure proper timezone conversion

                  across participants. When specified, `event_booking.timezone` must also be set.'
                example: America/Toronto
        only_specific_time_availability:
          type: boolean
          description: 'When `true`, ALL participants will ONLY be available at times defined in `default_specific_time_availability`

            and their individual `specific_time_availability` entries. Regular `open_hours` and `default_open_hours`

            are completely ignored.


            This is useful for:

            - Temporary availability windows (e.g., hiring events, special booking periods)

            - Disabling all availability by setting to `true` with no specific dates defined


            **Note**: When set at the config level, individual participants cannot override this to `false`.'
          default: false
          example: true
    configuration_availability_open_hours:
      description: Open hours settings for a participant.
      type: object
      title: Open Hours
      examples: []
      properties:
        days:
          type: array
          description: The days of the week that the open hour settings are applied to. Sunday corresponds to `0`, and Saturday corresponds to `6`.
          items:
            type: integer
          example:
          - 0
          - 1
          - 2
        start:
          type: string
          minLength: 1
          description: The start time in 24-hour time format. Single-digit hours doesn't have a leading zero. The earliest start time is `0:00`, and the latest start time is `23:49`.
          example: '10:00'
        end:
          type: string
          minLength: 1
          description: The end time in a 24-hour time format. Single-digit hours doesn't have a leading zero.
          example: '14:00'
        timezone:
          type: string
          minLength: 1
          description: 'The timezone for this open-hours block, as an [IANA-formatted](https://en.wikipedia.org/wiki/Tz_database) string.


            For participant `open_hours`, this value applies only to the open-hours block where you define it and overrides the participant''s `timezone`. If you omit it, Scheduler uses the participant''s `timezone`, then `event_booking.timezone`.


            For `default_open_hours` in Scheduler configurations, set `event_booking.timezone` to control the timezone that Scheduler uses when evaluating default open hours.'
          example: America/Chicago
        exdates:
          type: array
          description: A list of dates that are excluded from the open hours. Dates should be formatted as `YYYY-MM-DD`.
          items:
            type: string
          example:
          - '2006-01-18'
    meeting_settings:
      allOf:
      - $ref: '#/components/schemas/meeting_settings_common'
      - type: object
        properties:
          transcription_settings:
            type: object
            nullable: true
            description: "Optional settings that tune how Notetaker transcribes audio. `transcription` must be\n`true` for these settings to take effect. Provide any combination of the fields below.\n\nThe fields fall into two independent groups:\n\n- **Language hints** (`expected_languages`, `fallback_language`) constrain automatic\n  language detection. This declares the languages you expect; it does not translate\n  transcripts or force the recording into a specific language.\n- **Keyword hints** (`keywords`, `use_speaker_names_as_keywords`) bias recognition toward\n  domain-specific terms such as names, acronyms, and product names.\n\nSet on individual Notetakers, on calendar sync, or on event sync. When set on a calendar,\nevents inherit the value unless the event's own request overrides it. Send `null` or `{}`\nto clear inherited settings and return to default transcription behavior.\n\nSee [Set transcription languages](/docs/v3/notetaker/#set-transcription-languages) for\nsupported language codes and validation rules."
            properties:
              expected_languages:
                type: array
                description: 'Language codes the audio is expected to contain. Optional. When provided, it must

                  contain at least one supported code and cannot be `null` or empty. When omitted,

                  transcription considers all supported languages.'
                minItems: 1
                items:
                  type: string
                example:
                - en
                - es
              fallback_language:
                type: string
                description: 'Language to use if Notetaker does not detect one of the `expected_languages`. Optional.

                  When `expected_languages` is set, the fallback must be one of those codes. When

                  `expected_languages` is omitted, transcription considers all supported languages and

                  the fallback may be any supported code. When `fallback_language` is omitted, the

                  transcriber auto-detects the language. The field is not stored, so responses do not

                  return it.'
                example: en
              keywords:
                type: array
                description: 'Domain-specific terms that bias transcription toward recognizing them correctly, such

                  as names, acronyms, and product names. Optional. Up to 200 terms; each term must be

                  1 to 200 characters and cannot contain control characters. Cannot be `null`.'
                maxItems: 200
                items:
                  type: string
                  maxLength: 200
                example:
                - Nylas
                - AssemblyAI
              use_speaker_names_as_keywords:
                type: boolean
                description: 'When `true`, Notetaker adds known speaker names to the keyword set so they are

                  transcribed accurately. Optional. Cannot be `null`.'
                example: true
    configuration_availability:
      type: object
      description: The rules that determine the available time slots for the event.
      required:
      - duration_minutes
      properties:
        duration_minutes:
          type: integer
          description: The total number of minutes the event should last.
        interval_minutes:
          type: integer
          description: The interval between meetings. Nylas checks from the nearest interval of the passed `start_time`. For example, you schedule 30-minute meetings (`duration_minutes`) with 15 minutes between them (`interval_minutes`). If you have a meeting starting at 9:59, the API returns times starting at 10:00 (10:00-10:30, 10:15-10:45).
        round_to:
          type: integer
          default: 15
          description: Nylas rounds each time slot to the nearest `round_to` value. For example, if a time slot starts at 9:05a.m. and `round_to` is set to `15`, Nylas rounds it to 9:15a.m. Must be a multiple of 5 minutes.
        availability_rules:
          $ref: '#/components/schemas/configuration_availability_rules'
    configuration_scheduler_email_template:
      type: object
      description: Configurable settings for booking emails.
      properties:
        booking_confirmed:
          $ref: '#/components/schemas/configuration_scheduler_email_template_booking_confirmed'
        logo:
          type: string
          description: 'The URL of a custom logo that is displayed at the top of the booking email. Replaces the default

            Nylas logo. The URL needs to be publicly accessible.'
        show_nylas_branding:
          type: boolean
          default: true
          description: When `true`, displays Nylas branding in the booking email.
    configuration_scheduler_additional_fields:
      description: The definitions for additional fields to be displayed in the Scheduler UI. Guest will see the additional fields on the Scheduling Page when they book an event.
      type: object
      required:
      - label
      - type
      - required
      properties:
        label:
          type: string
          description: The text label to be displayed in the Scheduler UI.
        type:
          type: string
          description: The field type. If set to `metadata`, the field does not appear on email notifications and booking forms.
          enum:
          - text
          - multi_line_text
          - email
          - phone_number
          - dropdown
          - date
          - checkbox
          - radio_button
          - metadata
        required:
          type: boolean
          description: Whether the field is required to be filled out by the guest when booking an event.
        default:
          type: string
          description: "The default value for the field. \n\n- For the `metadata` type, this field stores the default metadata value.\n- For other types, this field sets the default value in the form, which is pre-filled when a guest books an event."
        pattern:
          type: string
          description: A regular expression pattern that the value of the field must match.
        order:
          type: integer
          description: The order in which the field will be displayed in the Scheduler UI. Fields with lower order values will be displayed first.
        options:
          type: array
          description: A list of options for the `dropdown` or `radio_button` types. This field is required for the `dropdown` and `radio_button` types.
          items:
            type: string
    configuration_scheduler_email_template_booking_confirmed:
      description: Configurable settings specifically for booking confirmed emails.
      type: object
      properties:
        title:
          type: string
          description: The title to replace the default 'Booking Confirmed' title. This doesn't change the email subject line. Only visible in emails sent to guests.
        body:
          type: string
          description: The additional body to be appended after the default body. Only visible in emails sent to guests.
    configuration_participants_booking:
      description: The booking data for the participant. If omitted, the participant is not included in the booked event. At least one participant must have booking data.
      type: object
      required:
      - calendar_id
      properties:
        calendar_id:
          type: string
          description: 'The calendar ID that the event is created in.


            For an [Agent Account](/docs/v3/scheduler/agent-accounts/) participant, set this to

            `primary`. Scheduler creates booking events on an Agent Account''s primary calendar only.'
    common_response_with_cursor:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
        next_cursor:
          type:
          - string
          - 'null'
          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    configuration_event_booking:
      type: object
      required:
      - title
      properties:
        booking_type:
          type: string
          description: 'The booking type. If set to `booking`, Scheduler follows the

            [standard booking flow](/docs/v3/scheduler/customize-booking-flows/).


            If set to `organizer-confirmation`, Scheduler creates an event marked "Pending" in the organizer''s

            calendar and sends a confirmation request email to the organizer. The confirmation request email

            includes a link to a page where the organizer can confirm or cancel the booking.'
          enum:
          - booking
          - organizer-confirmation
          default: booking
          example: booking
        conferencing:
          $ref: '#/components/schemas/event_conferencing_request'
        description:
          type: string
          description: The description of the event.
          example: Come ready to talk philosophy!
        disable_emails:
          type:
          - boolean
          - 'null'
          description: 'When `true`, Nylas doesn''t send email notifications when an event is booked, cancelled, or

            rescheduled. When `null`, the default behavior applies (emails are sent).'
          default: false
          example: false
        hide_participants:
          type:
          - boolean
          - 'null'
          description: When `true`, Nylas creates the event with `hide_participants=true`, so the host can see who's on the event but the guests cannot. When `null`, the default behavior applies (participants are visible).
          default: false
          example: false
        location:
          type: string
          description: The location of the event.
          example: Central Library, room 203
        notify_participants:
          type:
          - boolean
          - 'null'
          description: 'When `true`, the calendar provider sends notifications to participants when the

            event is created, updated, or deleted. Microsoft grants ignore this flag and

            always notify participants. This field may be `null` if not explicitly set on

            the configuration; treat `null` the same as `false` (the default behavior).'
          default: false
          example: true
        reminders:
          type: array
          required:
          - minutes_before_event
          - type
          items:
            type: object
            properties:
              email_subject:
                type: string
                description: (Email reminders only) The subject line of the email reminder.
                example: 'Reminder: Annual Philosophy Club Meeting'
              minutes_before_event:
                type: integer
                description: The number of minutes before the event to send the reminder.
                minimum: 1
                example: 30
              recipient:
                type: string
                description: (Email reminders only) Who should receive the reminder.
                enum:
                - all
                - host
                - guest
                default: all
                example: host
              type:
                type: string
                description: The reminder type.
                enum:
                - email
                - webhook
                example: email
        timezone:
          type: string
          description: 'The timezone Nylas uses to display times in confirmation messages and reminders. This must be

            an [IANA-formatted string](https://en.wikipedia.org/wiki/Tz_database).'
          minLength: 1
          example: America/Chicago
        title:
          type: string
          description: The title of the event.
          example: Annual Philosophy Club Meeting
  parameters:
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
  securitySchemes:
    ACCESS_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_ACCESS_TOKEN
      description: 'The Nylas **access token** for a specific grant. Issued as part of OAuth 2.1 flow token

        exchange.'
    NYLAS_API_KEY:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_API_KEY
      description: 'The Nylas **API key** provides application-level access to APIs and all grants. You can

        generate these from the Dashboard. Learn more about [authorizing requests](/docs/v3/auth/).'
    SCHEDULER_SESSION_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: Session ID
      description: The Nylas Scheduler **session ID** that Scheduler UI Components use to authorize API requests.
