    post:
      summary: Create a calendar
      tags:
      - Calendars
      operationId: create-calendar
      description: Creates a calendar.
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/calendar
          others: ''
        microsoft:
          min: https://graph.microsoft.com/Calendars.ReadWrite
          others: ''
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
