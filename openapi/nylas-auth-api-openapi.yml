security:
- ACCESS_TOKEN: []
- NYLAS_API_KEY: []
tags:
- name: Auth
paths:
  /v3/connect/auth:
    get:
      operationId: get_oauth2_flow
      tags:
      - Auth
      summary: Hosted OAuth - Authorization Request
      description: 'The initial OAuth 2.0 authorization request. Use this endpoint with the required query parameters to start the OAuth 2.0 process. The query parameters pass details to the Nylas API about how the user should authenticate, and where they should go after authenticating.

        This endpoint supports the authorization code flow and optional PKCE settings for client-side only applications. For more information, see the  [Hosted OAuth with access token](/docs/v3/auth/hosted-oauth-accesstoken/) and [Hosted OAuth with access token and PKCE](/docs/v3/auth/hosted-oauth-accesstoken/#create-grants-with-oauth-2.0-and-pkce) documentation.'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url 'https://api.us.nylas.com/v3/connect/auth?client_id=<NYLAS_CLIENT_ID>&redirect_uri=https%3A%2F%2Fyourapp.com%2Fcallback&response_type=code&provider=google&login_hint=user@example.com'\n"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\n// Build a hosted-authentication URL. Redirect the user to this URL to start\n// the OAuth flow; Nylas calls back to your `redirectUri` with an authorization\n// code that you exchange for a grant via `nylas.auth.exchangeCodeForToken()`.\nconst authUrl = nylas.auth.urlForOAuth2({\n  clientId: \"<NYLAS_CLIENT_ID>\",\n  provider: \"google\",\n  redirectUri: \"http://localhost:3000/oauth/exchange\",\n  loginHint: \"email_to_connect@example.com\",\n  accessType: \"offline\",\n});\n\nconsole.log(authUrl);\n"
      - lang: python
        label: Python SDK
        source: "@app.route(\"/nylas/auth\", methods=[\"GET\"])\ndef login():\n  if session.get(\"grant_id\") is None:\n    config = URLForAuthenticationConfig({\"client_id\": \"<NYLAS_CLIENT_ID>\", \n        \"redirect_uri\" : \"http://localhost:5000/oauth/exchange\"})\n\n    url = nylas.auth.url_for_oauth2(config)\n    return redirect(url)\n  else:\n    return f'{session[\"grant_id\"]}'\n\n@app.route(\"/oauth/exchange\", methods=[\"GET\"])\ndef authorized():\n  if session.get(\"grant_id\") is None:\n    code = request.args.get(\"code\")\n\n    exchangeRequest = CodeExchangeRequest({\"redirect_uri\": \"http://localhost:5000/oauth/exchange\",\n        \"code\": code, \"client_id\": \"<NYLAS_CLIENT_ID>\"})\n\n    exchange = nylas.auth.exchange_code_for_token(exchangeRequest)\n    session[\"grant_id\"] = exchange.grant_id\n\n    return redirect(url_for(\"login\"))\n"
      - lang: ruby
        label: Ruby SDK
        source: "# frozen_string_literal: true\n\nrequire 'nylas'\nrequire 'sinatra'\n\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nset :show_exceptions, :after_handler\n\nerror 404 do\n  'No authorization code returned from Nylas'\nend\n\nerror 500 do\n  'Failed to exchange authorization code for token'\nend\n\n# Build the hosted-authentication URL and redirect the user there.\nget '/nylas/auth' do\n  config = {\n    client_id: \"<NYLAS_CLIENT_ID>\",\n    provider: 'google',\n    redirect_uri: 'http://localhost:4567/oauth/exchange',\n    login_hint: '<email_to_connect>',\n    access_type: 'offline'\n  }\n\n  url = nylas.auth.url_for_oauth2(config)\n  redirect url\nend\n\n# Receive the authorization code and exchange it for a grant.\nget '/oauth/exchange' do\n  code = params[:code]\n  status 404 if code.nil?\n\n  begin\n    response = nylas.auth.exchange_code_for_token({\n      client_id: \"<NYLAS_CLIENT_ID>\",\n      redirect_uri: 'http://localhost:4567/oauth/exchange',\n      code: code\n    })\n  rescue StandardError\n    status 500\n  else\n    \"Grant_Id: #{response[:grant_id]} \\n Email: #{response[:email]}\"\n  end\nend\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.AccessType;\nimport com.nylas.models.AuthProvider;\nimport com.nylas.models.UrlForAuthenticationConfig;\n\npublic class HostedAuthUrl {\n  public static void main(String[] args) {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    // Build a hosted-authentication URL. Redirect the user to this URL to start\n    // the OAuth flow; Nylas calls back to your `redirectUri` with an authorization\n    // code that you exchange for a grant via `nylas.auth().exchangeCodeForToken()`.\n    UrlForAuthenticationConfig config = new UrlForAuthenticationConfig.Builder(\n        \"<NYLAS_CLIENT_ID>\",\n        \"http://localhost:3000/oauth/exchange\")\n        .provider(AuthProvider.GOOGLE)\n        .accessType(AccessType.OFFLINE)\n        .loginHint(\"email_to_connect@example.com\")\n        .build();\n\n    String url = nylas.auth().urlForOAuth2(config);\n\n    System.out.println(url);\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.AccessType\nimport com.nylas.models.AuthProvider\nimport com.nylas.models.UrlForAuthenticationConfig\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  // Build a hosted-authentication URL. Redirect the user to this URL to start\n  // the OAuth flow; Nylas calls back to your `redirectUri` with an authorization\n  // code that you exchange for a grant via `nylas.auth().exchangeCodeForToken()`.\n  val config = UrlForAuthenticationConfig.Builder(\n      \"<NYLAS_CLIENT_ID>\",\n      \"http://localhost:3000/oauth/exchange\")\n      .provider(AuthProvider.GOOGLE)\n      .accessType(AccessType.OFFLINE)\n      .loginHint(\"email_to_connect@example.com\")\n      .build()\n\n  val url = nylas.auth().urlForOAuth2(config)\n\n  println(url)\n}\n"
      parameters:
      - in: query
        name: client_id
        required: true
        description: Your Nylas application's client ID (or application ID).
        schema:
          type: string
      - in: query
        name: provider
        required: false
        description: 'The connector provider type that you set up with Nylas for this application. If the provider

          isn''t set, the user is directed to the Nylas Hosted login page and prompted to select their

          provider. Multiple providers can be set as a comma-separated list.'
        schema:
          type: string
          enum:
          - google
          - microsoft
          - imap
          - icloud
          - yahoo
          - ews
          - zoom
      - in: query
        name: redirect_uri
        required: true
        description: Your project's callback URI (used as the OAuth `redirect_uri`). This is where the OAuth provider sends a user after they authenticate using Hosted OAuth. This must be URL-encoded.
        schema:
          type: string
        example: redirect_uri=https%3A%2F%2Fapp.example.com&
      - in: query
        name: response_type
        required: true
        description: Specifies the type of response Nylas returns for the authorization flow. Should be set to `code` for the OAuth 2.0 flow, and `adminconsent` for the Microsoft admin consent service flow.
        schema:
          type: string
          enum:
          - code
          - adminconsent
      - in: query
        name: scope
        description: 'A space-delimited list of scopes that identify the resources that your application may access

          on the user''s behalf. If no scopes are set, Nylas uses the default connector scopes.'
        schema:
          type: string
      - in: query
        name: prompt
        required: false
        description: '(Optional) The prompt for the Hosted login page. This parameter can accept multiple values

          separated by a comma, without spaces in between. The order of the prompts affects the UI of

          the Hosted login page.


          If `provider` is not set, the user is redirected to the provider page directly, and the prompt

          is ignored.'
        schema:
          type: string
          default: select_provider
          enum:
          - select_provider
          - detect
          - select_provider,detect
          - detect,select_provider
      - in: query
        name: state
        description: (Optional) The state of the grant, returned after authentication. The maximum length is 256 characters.
        schema:
          type: string
      - in: query
        name: login_hint
        description: Prefill the login name (usually the email address) during the authentication flow. If a grant already exists for the provided email address, Nylas automatically re-authenticates the grant.
        schema:
          type: string
      - in: query
        name: access_type
        description: Specifies whether Nylas should return a refresh token along with the exchange token. This isn't suitable for client-side or JavaScript applications.
        schema:
          type: string
          enum:
          - offline
          - online
      - in: query
        name: code_challenge
        description: Specifies a Base64-encoded `code_verifier` without padding. The verifier is used as a server-side challenge during the authorization code exchange.
        schema:
          example: e96bf6686a3c3510e9e927db7069cb1cba9b99b022f49483a6ce3270809e68a2
          type: string
      - in: query
        name: code_challenge_method
        description: Specifies the method used to encode the `code_verifier`. The verifier is used as a server-side challenge during the authorization code exchange.
        schema:
          example: S256
          type: string
          enum:
          - plain
          - S256
          default: plain
      - in: query
        name: credential_id
        description: 'The ID of an existing Nylas connector''s credential record.

          If you set the `response_type` value to `code` then you can use the credential to override an OAuth connector''s default settings and create a grant. You need to [create a credential record](/docs/reference/api/connector-credentials/create_credential/) before you can make a credential override request. If not provided, connector''s default "active_credential_id" is used.

          If you set the `response_type` value to `adminconsent`, with provider Microsoft, then this will be the OAuth of Microsoft''s Service Account Admin Consent flow. You need to [set up the Microsoft connector with an Admin Consent credential before you can make this request](/docs/v3/auth/bulk-auth-grants/#set-up-microsoft-admin-consent-flow).'
        schema:
          type: string
          example: e19f8e1a-eb1c-41c0-b6a6-d2e59daf7f47
      - in: query
        name: options
        description: '(Google only) Set to `exclude_google_granted_scopes` to exclude Google-granted scopes from the

          authorization request.'
        schema:
          type: string
          example: options=exclude_google_granted_scopes
      responses:
        '302':
          description: Redirects user to provider's authorization page
          headers:
            Location:
              description: Location header.
              schema:
                type: string
                format: url
                example: 'https://accounts.google.com/o/oauth2/auth/oauthchooseaccount?prompt=consent&login_hint=email@google.com&access_type=offline&state=<BA630DED06...> &redirect_uri=https://api.us.nylas.com/v3/connect/callback&response_type=code&client_id=<NYLAS_CLIENT_ID>

                  '
        '400':
          $ref: '#/components/responses/400'
  /v3/connect/token:
    post:
      operationId: exchange_oauth2_token
      tags:
      - Auth
      summary: Hosted OAuth - Token exchange
      description: "The standard OAuth token endpoint for Hosted Authentication. This endpoint doesn't require authentication, as it is part of the auth process.\nYou can pass one of the following `grant_type` values:\n- `authorization_code`: Exchange the `code` Nylas returns from the OAuth 2.0 authorization flow for tokens (`access_token` and `refresh_token`). - `refresh_token`: Use the existing `refresh_token` for an existing grant to issue a new `access_token`. You _must_ pass your API key in the `client_secret` field.\n - `client_credentials`: Issue a new short-lived (1 hour) `access_token` using an existing `grant_id`. You _must_ pass your API key in the `client_secret` field. This is mainly used in Scheduler implementations.\n\nThis endpoint accepts both `application/json` and `application/x-www-form-urlencoded` request body types. The body parameters are the same for both, with the same naming conventions.\nFor more information, see the [Hosted authentication with access token documentation](/docs/v3/auth/hosted-oauth-accesstoken/).\n### Failed token exchange requests\nEach OAuth `code` is a unique, one-time-use credential. If your token exchange fails, you must restart the OAuth process. If you try to pass the original `code` in another token exchange request, the provider rejects the `code` and Nylas returns an error."
      security: []
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Exchange code
                description: Exchange an authorization code for access and refresh tokens.
                required:
                - code
                - client_id
                - client_secret
                - redirect_uri
                - grant_type
                properties:
                  client_id:
                    example: <NYLAS_CLIENT_ID>
                    type: string
                    description: Your Nylas application's client ID.
                  client_secret:
                    example: <NYLAS_API_KEY>
                    type: string
                    description: Your Nylas application's API key.
                  grant_type:
                    example: authorization_code
                    type: string
                    description: Supports exchanging a `code` for a token, or refreshing an access token using a `refresh_token` and `client_credentials` for issuing short-lived access based on the grant id provided.
                    enum:
                    - authorization_code
                  code:
                    type: string
                    description: The `code` from the OAuth 2.0 authorization flow.
                  redirect_uri:
                    example: https://example.com/callback-handler
                    format: url
                    type: string
                    description: 'The URL that Nylas uses to redirect the user to your project after they complete

                      the authorization flow. This should match the `callback_uri` or `redirect_uri` that

                      you used to get the `code` during your initial

                      [authorization request](/docs/reference/api/authentication-apis/get_oauth2_flow/).'
                  code_verifier:
                    example: nylas
                    type: string
                    description: 'The plaintext `code` verifier (`code_challenge`) that you created in your

                      [authorization request](/docs/reference/api/authentication-apis/get_oauth2_flow/).'
              - type: object
                title: Refresh access token
                description: Use a refresh token to issue a new access token.
                required:
                - refresh_token
                - client_id
                - client_secret
                - grant_type
                properties:
                  client_id:
                    example: <NYLAS_CLIENT_ID>
                    type: string
                    description: Your Nylas application's client ID.
                  client_secret:
                    example: <NYLAS_API_KEY>
                    type: string
                    description: Your Nylas application's API key.
                  grant_type:
                    example: refresh_token
                    type: string
                    description: Supports exchanging a `code` for a token, or refreshing an access token using a `refresh_token` and `client_credentials` for issuing short-lived access based on the grant id provided.
                    enum:
                    - refresh_token
                  refresh_token:
                    example: <REFRESH_TOKEN>
                    type: string
                    description: Required to refresh or request a short-lived access token.
              - type: object
                title: Client credentials
                description: Issue a short-lived access token for an existing grant.
                required:
                - grant_id
                - client_id
                - client_secret
                - grant_type
                properties:
                  client_id:
                    example: <NYLAS_CLIENT_ID>
                    type: string
                    description: Your Nylas application's client ID.
                  client_secret:
                    example: <NYLAS_API_KEY>
                    type: string
                    description: Your Nylas application's API key.
                  grant_type:
                    example: refresh_token
                    type: string
                    description: Supports exchanging a `code` for a token, or refreshing an access token using a `refresh_token` and `client_credentials` for issuing short-lived access based on the grant id provided.
                    enum:
                    - client_credentials
                  grant_id:
                    example: <GRANT_ID>
                    type: string
                    description: Required to request a short-lived access token for a specific grant.
      responses:
        '200':
          description: The token exchange was successful.
          content:
            application/json:
              schema:
                type: object
                title: data
                properties:
                  access_token:
                    example: <NYLAS_ACCESS_TOKEN>
                    type: string
                    description: Supports exchanging a `code` for a token, or refreshing an access token using a `refresh_token`.
                  expires_in:
                    example: 3600
                    type: integer
                    default: 3600
                    description: The remaining lifetime of the access token, in seconds.
                  id_token:
                    example: <JWT_TOKEN>
                    type: string
                    description: 'A JSON web token (JWT) that contains identity information about a user. It''s digitally

                      signed by Nylas.'
                  email:
                    example: example@gmail.com
                    type: string
                    description: The email address associated with the provider token exchange.
                  refresh_token:
                    example: <REFRESH_TOKEN>
                    type: string
                    description: Returned only if the `code` was requested using `access_type=offline`.
                  scope:
                    example: https://www.googleapis.com/auth/gmail.readonly profile
                    type: string
                    description: List of scopes associated with this token.
                  token_type:
                    example: Bearer
                    type: string
                    description: Currently always `Bearer`.
                  grant_id:
                    example: <NYLAS_GRANT_ID>
                    type: string
                    description: The ID for the new grant.
                  provider:
                    example: google
                    enum:
                    - google
                    - microsoft
                    - imap
                    - icloud
                    - yahoo
                    - ews
                    - zoom
                    type: string
                    description: The provider name associated with the authorized grant. Only returned during the code exchange process.
        '400':
          description: The token exchange was unsuccessful. Nylas returns a message with a description, and a link to troubleshooting documentation.
          content:
            application/json:
              schema:
                type: object
                title: data
                properties:
                  error:
                    example: invalid_request
                    type: string
                    description: Error type constant.
                  error_description:
                    example: 'Missing required parameter: code'
                    type: string
                    description: A human-readable error description.
                  error_uri:
                    example: developer.nylas.com/docs/api/errors/400-response/
                    type: string
                    description: A URL to the related documentation and troubleshooting regarding this error.
                  error_code:
                    example: 400
                    type: string
                    description: Error code used for referencing the documentation, logs, and data stream.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/token\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"client_id\": \"<NYLAS_CLIENT_ID>\",\n    \"client_secret\": \"<NYLAS_API_KEY>\",\n    \"grant_type\": \"authorization_code\",\n    \"code\": \"<AUTHORIZATION_CODE>\",\n    \"redirect_uri\": \"https://example.com/callback-handler\",\n    \"code_verifier\": \"<CODE_VERIFIER>\"\n  }'\n"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\n// Exchange the authorization code returned by Nylas for an access token and\n// grant ID. Call this from your OAuth callback handler with the `code` query\n// parameter that Nylas appends to your `redirectUri`.\nconst code = \"<AUTHORIZATION_CODE>\";\n\ntry {\n  const response = await nylas.auth.exchangeCodeForToken({\n    clientId: \"<NYLAS_CLIENT_ID>\",\n    redirectUri: \"http://localhost:3000/oauth/exchange\",\n    code,\n    // Only set `codeVerifier` if you used PKCE in the initial authorization request.\n    // codeVerifier: \"<PKCE_CODE_VERIFIER>\",\n  });\n\n  console.log(\"Grant ID:\", response.grantId);\n  console.log(\"Access token:\", response.accessToken);\n} catch (error) {\n  console.error(\"Error exchanging code for token:\", error);\n}\n"
      - lang: python
        label: Python SDK
        source: "from flask import Flask, request\nfrom nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\napp = Flask(__name__)\nREDIRECT_URI = \"http://localhost:9000/oauth/exchange\"\n\n@app.route(\"/oauth/exchange\", methods=[\"GET\"])\ndef exchange_code_for_token():\n    code_exchange_response = nylas.auth.exchange_code_for_token(\n        request={\n            \"code\": request.args.get(\"code\"),\n            \"client_id\": \"<NYLAS_CLIENT_ID>\",\n            \"redirect_uri\": REDIRECT_URI,\n        }\n    )\n\n    return {\n        \"email_address\": code_exchange_response.email,\n        \"grant_id\": code_exchange_response.grant_id,\n    }\n"
      - lang: ruby
        label: Ruby SDK
        source: "# frozen_string_literal: true\n\nrequire 'nylas'\nrequire 'sinatra'\n\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nset :show_exceptions, :after_handler\n\n# Receive the authorization code from Nylas and exchange it for a grant.\nget '/oauth/exchange' do\n  code = params[:code]\n  status 404 if code.nil?\n\n  begin\n    response = nylas.auth.exchange_code_for_token({\n      client_id: \"<NYLAS_CLIENT_ID>\",\n      redirect_uri: 'http://localhost:4567/oauth/exchange',\n      code: code\n    })\n  rescue StandardError\n    status 500\n  else\n    grant_id = response[:grant_id]\n    email = response[:email]\n\n    \"Grant_Id: #{grant_id} \\n Email: #{email}\"\n  end\nend\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.CodeExchangeRequest;\nimport com.nylas.models.CodeExchangeResponse;\n\npublic class ExchangeCodeForToken {\n  public static void main(String[] args) {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    // Exchange the authorization code returned by Nylas for an access token and\n    // grant ID. Call this from your OAuth callback handler with the `code` query\n    // parameter that Nylas appends to your `redirectUri`.\n    CodeExchangeRequest codeRequest = new CodeExchangeRequest.Builder(\n        \"http://localhost:3000/oauth/exchange\",\n        \"<AUTHORIZATION_CODE>\",\n        \"<NYLAS_CLIENT_ID>\")\n        // Only set codeVerifier if you used PKCE in the initial authorization request.\n        // .codeVerifier(\"<PKCE_CODE_VERIFIER>\")\n        .build();\n\n    try {\n      CodeExchangeResponse codeResponse = nylas.auth().exchangeCodeForToken(codeRequest);\n\n      System.out.println(\"Grant ID: \" + codeResponse.getGrantId());\n      System.out.println(\"Access token: \" + codeResponse.getAccessToken());\n    } catch (Exception e) {\n      System.err.println(\"Error exchanging code for token: \" + e);\n    }\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.CodeExchangeRequest\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  // Exchange the authorization code returned by Nylas for an access token and\n  // grant ID. Call this from your OAuth callback handler with the `code` query\n  // parameter that Nylas appends to your `redirectUri`.\n  val codeRequest = CodeExchangeRequest.Builder(\n      \"http://localhost:3000/oauth/exchange\",\n      \"<AUTHORIZATION_CODE>\",\n      \"<NYLAS_CLIENT_ID>\")\n      // Only set codeVerifier if you used PKCE in the initial authorization request.\n      // .codeVerifier(\"<PKCE_CODE_VERIFIER>\")\n      .build()\n\n  try {\n    val codeResponse = nylas.auth().exchangeCodeForToken(codeRequest)\n\n    println(\"Grant ID: ${codeResponse.grantId}\")\n    println(\"Access token: ${codeResponse.accessToken}\")\n  } catch (e: Exception) {\n    System.err.println(\"Error exchanging code for token: $e\")\n  }\n}\n"
  /v3/connect/revoke:
    post:
      operationId: revoke_oauth2_token_and_grant
      tags:
      - Auth
      summary: Hosted OAuth - Revoke OAuth token
      description: 'Revokes the specified OAuth access token. When you revoke the token, Nylas _doesn''t_ revoke the

        grant or the associated provider token. This means that a user can re-authenticate to get a new

        access token for the existing grant, so their `grant_id` doesn''t change.


        If you revoke a Nylas access token, Nylas also revokes all child tokens and the parent

        `refresh_token` attached to the access token.'
      parameters:
      - in: query
        name: token
        schema:
          type: string
        required: true
        description: The token to revoke
      responses:
        '200':
          description: The token was revoked successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: The token could not be revoked, possibly because it was invalid or already expired.
          content:
            application/json:
              schema:
                type: object
                title: data
                properties:
                  error:
                    example: invalid_token
                    type: string
                    description: Error type constant.
                  error_description:
                    example: Token expired or revoked
                    type: string
                    description: Human readable error description.
                  error_uri:
                    example: developer.nylas.com/docs/api/errors/400-response/
                    type: string
                    description: A url to the related documentation and troubleshooting regarding this error.
                  error_code:
                    example: 400
                    type: string
                    description: Error code used for referencing the docs, logs and data stream.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request POST \\\n  --url 'https://api.us.nylas.com/v3/connect/revoke?token=<TOKEN>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\n// Configure the Nylas SDK with your API key and server URL\nconst NylasConfig = {\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n};\n\nconst nylas = new Nylas(NylasConfig);\n\nconst revokeToken = async () => {\n  try {\n    const token = \"<TOKEN>\";\n    const response = await nylas.auth.revoke(token);\n\n    console.log(\"Token Revoked:\", response);\n  } catch (error) {\n    console.error(\"Error removing connector:\", error);\n  }\n};\n\nrevokeToken();\n"
      - lang: python
        label: Python SDK
        source: "import sys\nfrom nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\nrequest = nylas.auth.revoke(\n  \"<TOKEN>\",\n)\n\nprint(request)"
      - lang: ruby
        label: Ruby SDK
        source: "# frozen_string_literal: true\n\nrequire 'nylas'\n\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nbegin\n  nylas.auth.revoke(\"<NYLAS_AUTH_TOKEN>\")\n  puts \"The token was successfully revoked\"\nrescue Nylas::NylasApiError => e\n  puts \"The token could not be revoked: #{e.message}\"\nend\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.TokenParams;\n\npublic class Main {\n    public static void main(String[] args) {\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n        TokenParams token = new TokenParams(\"<NYLAS_ACCESS_TOKEN>\");\n\n        try {\n            boolean tokenStatus = nylas.auth().revoke(token);\n            if (tokenStatus) {\n                System.out.println(\"The token was successfully removed\");\n            } else {\n                System.out.println(\"The token cannot be removed\");\n            }\n        } catch (Exception e) {\n            System.out.println(\"Invalid token cannot be removed\");\n        }\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.*\n\nfun main() {\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n    val token = TokenParams(\"<NYLAS_ACCESS_TOKEN>\")\n\n    try {\n        val tokenStatus = nylas.auth().revoke(token)\n        if (tokenStatus) {\n            println(\"The token was successfully removed\")\n        } else {\n            println(\"The token cannot be removed\")\n        }\n    } catch (e: Exception) {\n        print(\"Invalid token cannot be removed\")\n    }\n}\n"
  /v3/connect/tokeninfo:
