security:
- ACCESS_TOKEN: []
- NYLAS_API_KEY: []
tags:
- name: Threads
paths:
  /v3/grants/{grant_id}/threads:
    parameters:
    - schema:
        type: string
      name: grant_id
      in: path
      required: true
      description: 'ID of the grant to access. You can also use the email address associated with the grant, or use

        `/me/` to refer to the grant associated with an access token.'
      example: nyla@example.com
    get:
      summary: Return all threads
      tags:
      - Threads
      operationId: get-threads
      description: 'Returns all threads.


        For Microsoft, IMAP, iCloud, Yahoo, and EWS, threads are ordered reverse chronologically by the latest message received.


        For Google, thread ordering is not guaranteed to be reverse chronological due to a Gmail API limitation.

        However, setting the `in` query parameter improves the likelihood of reverse chronological ordering significantly (approximately 40%).

        While reverse chronological ordering remains unguaranteed even with the `in` parameter, we recommend using it to increase the chance of this ordering pattern.


        <div id="admonition-warning">

        ⚠️ <b>Your users might receive a large number of threaded messages</b>. If you encounter

        <a href="/docs/api/errors/400-response/"><code>429</code> errors</a> or provider

        <a href="/docs/dev-guide/platform/rate-limits/">rate limits</a> when listing all threads, Nylas

        recommends you set the <code>limit</code> parameter to 20 and add

        <a href="#query-parameters">query parameters</a> to your request to

        limit the results.</div>'
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.readonly
          others: https://www.googleapis.com/auth/gmail.modify
        microsoft:
          min: https://graph.microsoft.com/Mail.Read
          others:
          - https://graph.microsoft.com/Mail.ReadWrite
          - https://graph.microsoft.com/Mail.Read.Shared
          - https://graph.microsoft.com/Mail.ReadWrite.Shared
        yahoo:
          min: email, mail-r
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - name: any_email
        schema:
          type: string
        in: query
        description: 'Filter for threads that contain messages sent to or received from the email addresses in the

          comma-separated list. You may specify a maximum of 25 email addresses per query.'
        example: mail1@example.com,mail2@example.com
      - name: bcc
        schema:
          type: string
        in: query
        description: 'Filter for threads that contain messages BCC''d to the specified email address. Because most

          SMTP gateways remove BCC information from sent messages, any messages that Nylas returns are

          likely sent from the parent account.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: cc
        schema:
          type: string
        in: query
        description: 'Filter for threads that contain messages CC''d to the specified email address.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: from
        schema:
          type: string
        in: query
        description: 'Filter for threads that include messages sent from the specified email address. If you want

          to filter for threads that include messages sent from the current grant, use the `in` query

          parameter and specify the Sent folder instead.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: has_attachment
        schema:
          type: boolean
          default: false
        in: query
        description: When `true`, filters for threads that include attachments.
      - name: in
        schema:
          type: string
        in: query
        description: 'Return messages in the specified folder or label, by folder ID.

          Required when using `shared_from`.'
      - name: earliest_message_date
        schema:
          type: integer
        in: query
        description: "Returns the date when the earliest or first message in the thread was sent or received, in Unix \ntimestamp format."
      - name: latest_message_after
        schema:
          type: integer
        in: query
        description: 'Filter for threads whose most recent message was received after the specified time, in Unix

          timestamp format.'
      - name: latest_message_before
        schema:
          type: integer
        in: query
        description: 'Filter for threads whose most recent message was received before the specified time, in Unix

          timestamp format.'
      - name: limit
        schema:
          type: integer
          default: 20
          maximum: 50
        in: query
        description: 'The maximum number of objects to return. See [pagination](/docs/reference/api/#pagination)

          for more information.'
        required: false
      - $ref: '#/components/parameters/page_token'
      - name: search_query_native
        schema:
          type: string
        in: query
        description: 'Specify a URL-encoded search query. Connected providers use their provider-specific syntax,

          while Nylas Agent Accounts use Nylas full-text search syntax. The query parameters that you can

          use alongside `search_query_native` depend on the provider:


          - **Google**: `in`, `limit`, and `page_token`

          - **Microsoft**: `in`, `limit`, and `page_token`

          - **IMAP/Yahoo/iCloud**: Any parameter

          - **EWS**: Any parameter _except_ `thread_id`

          - **Nylas Agent Accounts**: Any other parameter supported for Agent Accounts by this endpoint


          For an overview of searching messages and threads with `search_query_native` across providers,

          see [Searching with Nylas](/docs/dev-guide/best-practices/search/#search-messages-and-threads-using-search_query_native).

          If you''re using a Nylas Agent Account, see

          [Email search for Agent Accounts](/docs/v3/agent-accounts/email-search/) for the complete Nylas

          search syntax, examples, and limits.'
        examples:
          Agent Account:
            description: Nylas full-text query for threads that contain "charger" or "station".
            value: charger%20OR%20station
          Google:
            description: Google query string for threads with subject "foo" or "bar".
            value: subject%3Afoo%20OR%20subject%3Abar
          Microsoft:
            description: Microsoft Graph query for threads using the `$filter` syntax.
            value: '%24filter%3Dfrom%2FemailAddress%2Faddress%20eq%20%27someuser%40example.com%27'
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/shared_folder_id'
      - $ref: '#/components/parameters/shared_from'
      - name: starred
        schema:
          type: boolean
        in: query
        description: Filter for threads that contain one or more starred messages.
      - name: subject
        schema:
          type: string
        in: query
        description: 'Return threads that contain messages with a matching subject. This filter is case-sensitive

          and returns partial matches.'
      - name: to
        schema:
          type: string
        in: query
        description: 'Filter for threads that contain messages sent to the specified email address.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: unread
        schema:
          type: boolean
        in: query
        description: Filter for threads that contain one or more unread messages.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request GET \\\n  --url \"https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/threads?limit=5\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchRecentThreads() {\n  try {\n    const identifier = \"<NYLAS_GRANT_ID>\";\n    const threads = await nylas.threads.list({\n      identifier: identifier,\n      queryParams: {\n        limit: 5,\n      },\n    });\n\n    console.log(\"Recent Threads:\", threads);\n  } catch (error) {\n    console.error(\"Error fetching threads:\", error);\n  }\n}\n\nfetchRecentThreads();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\n\nthreads = nylas.threads.list(\n  grant_id,\n  query_params={\n    \"limit\": 5\n  }\n)\n\nprint(threads)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\n\nnylas = Nylas::Client.new(api_key: \"<NYLAS_API_KEY>\")\nquery_params = { limit: 5 }\nthreads, _ = nylas.threads.list(identifier: \"<NYLAS_GRANT_ID>\", query_params: query_params)\n\nthreads.map.with_index { |thread, i|\n  puts(\"Thread #{i}\")\n  participants = thread[:participants]\n\n  participants.each{ |participant|\n    puts(\n      \"Subject: #{thread[:subject]} | \"\\\n      \"Participant: #{participant[:name]} | \"\\\n      \"Email: #{participant[:email]}\"\n    )\n  }\n}"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport com.nylas.models.Thread;\nimport java.util.List;\n\npublic class ReadThreadParameters {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    ListThreadsQueryParams queryParams = new ListThreadsQueryParams.Builder().limit(5).build();\n    ListResponse<Thread> threads = nylas.threads().list(\"<NYLAS_GRANT_ID>\", queryParams);\n    int index = 0;\n\n    for(Thread thread : threads.getData()){\n      System.out.printf(\"%s \", index);\n\n      List<EmailName> participants = thread.getParticipants();\n      assert participants != null;\n\n      for(EmailName participant : participants){\n        System.out.printf(\"  Subject: %s | Participant: %s | Email: %s%n\",\n            thread.getSubject(),\n            participant.getName(),\n            participant.getEmail());\n      }\n      \n      index++;\n    }\n  }\n}"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.*\nimport java.util.*\n\nfun main(args: Array<String>) {\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val queryParams = ListThreadsQueryParams(limit = 5)\n  val threads : List<Thread> = nylas.threads().list(\"<CALENDAR_ID>\", queryParams).data\n\n  for(i in threads.indices){\n    print(\"$i \")\n\n    val participants = threads[i].participants\n\n    if (participants != null) {\n      for(participant in participants){\n        println(\" Subject: ${threads[i].subject} + \" +\n            \"Name: ${participant.name} + \" +\n            \"Email: ${participant.email}\")\n      }\n    }\n  }\n}"
      responses:
        '200':
          $ref: '#/components/responses/threads'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
  /v3/grants/{grant_id}/threads/{thread_id}:
    parameters:
    - schema:
        type: string
      name: grant_id
      in: path
      required: true
      description: ID of the grant to access. Use `/me/` to refer to the grant associated with an access token.
    - schema:
        type: string
      name: thread_id
      in: path
      required: true
      description: 'ID of the thread to access. Nylas recommends you URL-encode this field, or you might receive a

        [`404` error](/docs/api/errors/400-response/) if the ID contains special characters (for

        example, `#`).'
    get:
      summary: Return a thread
      tags:
      - Threads
      responses:
        '200':
          $ref: '#/components/responses/thread'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: get-threads-id
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/shared_folder_id'
      - $ref: '#/components/parameters/shared_from'
      description: Returns the specified thread.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request GET \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/threads/<THREAD_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchThreadById() {\n  try {\n    const thread = await nylas.threads.find({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      threadId: \"<THREAD_ID>\",\n    });\n\n    console.log(\"Thread:\", thread);\n  } catch (error) {\n    console.error(\"Error fetching thread:\", error);\n  }\n}\n\nfetchThreadById();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nthread_id = \"<THREAD_ID>\"\n\nthread = nylas.threads.find(\n  grant_id,\n  thread_id,\n)\n\nprint(thread)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\t\n\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nthread, _ = nylas.threads.find(identifier: \"<NYLAS_GRANT_ID>\", \n                               thread_id: \"<THREAD_ID>\")\n\nparticipants = thread[:participants]\n\nparticipants.each{ |participant|\n    puts(\"Id: #{thread[:id]} | \"\\\n            \"Subject: #{thread[:subject]} | \"\\\n            \"Participant: #{participant[:name]} | \"\\\n            \"Email: #{participant[:email]}\"\n    )\n}\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport com.nylas.models.Thread;\n\npublic class ReturnThread {\n    public static void main(String[] args) throws\n            NylasSdkTimeoutError, NylasApiError {\n\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        Response<Thread> thread = nylas.threads().find(\"<NYLAS_GRANT_ID>\",\n        \"<THREAD_ID>\");\n        System.out.println(thread);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\n\nfun main(args: Array<String>) {\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val thread = nylas.threads().find(\"<NYLAS_GRANT_ID>\", \"<THREAD_ID>\").data\n  \n  print(thread)\n}\n"
    put:
      summary: Update a thread
      tags:
      - Threads
      responses:
        '200':
          $ref: '#/components/responses/thread'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: put-threads-id
      description: 'Updates the specified thread.


        When you make a `PUT` request, Nylas replaces all data in the nested object with the information

        included in your request. For more information, see

        [Updating objects](/docs/reference/api/#updating-objects).'
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/shared_folder_id'
      - $ref: '#/components/parameters/shared_from'
      requestBody:
        $ref: '#/components/requestBodies/thread_update'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request PUT \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/threads/<THREAD_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"unread\": true,\n    \"starred\": false,\n    \"folders\": [\"<FOLDER_ID>\"]\n  }'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function updateThread() {\n  try {\n    const calendar = await nylas.threads.update({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      threadId: \"<THREAD_ID>\",\n      requestBody: {\n        starred: true,\n      },\n    });\n\n    console.log(\"Updated Thread:\", calendar);\n  } catch (error) {\n    console.error(\"Error to update thread:\", error);\n  }\n}\n\nupdateThread();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\n\nthread = nylas.threads.update(\n  grant_id,\n  thread_id=\"<THREAD_ID>\",\n  request_body={\n    \"starred\": True\n  }\n)\n\nprint(thread)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\t\n\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  unread: true,\n  starred: true\n}\n\nthread, _ = nylas.threads.update(identifier: \"<NYLAS_GRANT_ID>\", \n                                 thread_id: \"<THREAD_ID>\",\n                                 request_body: request_body)\n\nputs thread\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport com.nylas.models.Thread;\n\npublic class UpdateThread {\n\tpublic static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n\t\tNylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n\t\tUpdateThreadRequest requestBody =\n\t\t\t\tnew UpdateThreadRequest.\n\t\t\t\tBuilder().\n\t\t\t\tunread(true).\n\t\t\t\tstarred(true).\n\t\t\t\tbuild();\n\n\t\tResponse<Thread> draft = nylas.threads().update(\"<NYLAS_GRANT_ID>\", \"<THREAD_ID>\", requestBody);\n\t\t\n\t\tSystem.out.printf(\"%s%s%s%n\",\n\t\t\tdraft.getData().getId(),\n\t\t\tdraft.getData().getUnread(),\n\t\t\tdraft.getData().getStarred()\n\t\t);\n\t}\n}"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.UpdateThreadRequest\n\nfun main(args: Array<String>) {\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val requestBody: UpdateThreadRequest =\n      UpdateThreadRequest.\n      Builder().\n      unread(true).\n      starred(true).\n      build()\n\n  val thread = nylas.threads().update(\"<NYLAS_GRANT_ID>\", \"<THREAD_ID>\", requestBody)\n  \n  print(\"${thread.data.id} ${thread.data.unread} ${thread.data.starred} \")\n}"
    delete:
      summary: Delete a thread
      tags:
      - Threads
      responses:
        '200':
          $ref: '#/components/responses/200-delete'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: delete-threads-id
      description: Moves the specified thread to the Trash, including all messages in the thread.
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - $ref: '#/components/parameters/shared_folder_id'
      - $ref: '#/components/parameters/shared_from'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request DELETE \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/threads/<THREAD_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\nconst identifier = \"<NYLAS_GRANT_ID>\";\nconst threadId = \"<THREAD_ID>\";\n\nconst deleteThread = async () => {\n  try {\n    await nylas.threads.destroy({ identifier, threadId });\n    console.log(`Thread with ID ${threadId} deleted successfully.`);\n  } catch (error) {\n    console.error(`Error deleting thread with ID ${threadId}:`, error);\n  }\n};\n\ndeleteThread();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nthread_id = \"<THREAD_ID>\"\n\nrequest = nylas.threads.destroy(\n  grant_id,\n  thread_id,\n)\n\nprint(request)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\t\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nthread, _ = nylas.threads.destroy(identifier: \"<NYLAS_GRANT_ID>\", \n                                  thread_id: \"<THREAD_ID>\")\n\nputs thread\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport com.nylas.models.Thread;\n\npublic class ReturnThread {\n    public static void main(String[] args) throws\n            NylasSdkTimeoutError, NylasApiError {\n\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        DeleteResponse thread = nylas.threads().destroy(\"<NYLAS_GRANT_ID>\",\n        \"<THREAD_ID>\");\n        System.out.println(thread);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\n\nfun main(args: Array<String>) {\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val thread = nylas.threads().destroy(\"<NYLAS_GRANT_ID>\", \"<THREAD_ID>\")\n\n  print(thread)\n}"
components:
  schemas:
    attachment:
      description: A file attached to an email message.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The ID of the attachment.
          readOnly: true
          example: 4kj2jrcoj9ve5j9yxqz5cuv98
        content_type:
          type: string
          minLength: 1
          description: 'The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types) of the attachment, used by the email client to determine how to display the attachment. If you don''t provide a type, Nylas infers it from the file name.

            The value of this field is exactly the same as the email attachment''s `Content-Type` header.

            The provider might set additional parameters, such as `name` and `charset`.


            Nylas returns an empty `content_type` field if an attachment file name contains non-ASCII characters (for example, accented characters like `ü`). This is because Google can''t detect its content type.'
          example: image/png; name="pic.png"
        filename:
          type: string
          minLength: 1
          description: The file name of the attachment.
          example: pic.png
        grant_id:
          $ref: '#/components/schemas/grant_id'
        content_id:
          type: string
          description: '(Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the message''s HTML. For

            example, you might see something like `<img src=\"cid:ce9b9547-9eeb-43b2-ac4e-58768bdf04e4\">` in

            the message body.


            Sometimes, the `content_id` value is contained in angle brackets (for example,

            `<ce9b9547-9eeb-43b2-ac4e-58768bdf04e4>`).'
          example: 1234567890
        content_disposition:
          type: string
          description: (Not supported for Microsoft and EWS) The content disposition of the attachment. Usually, this is `inline` or `attachment` followed by the file name (for example, `inline; filename="some-image.jpeg"`).
          example: inline
        is_inline:
          type: boolean
          description: If `true`, indicates that the attachment is an inline file.
          example: true
        size:
          type: integer
          description: The size of the attachment, in bytes.
          example: 13068
    id:
      title: ID
      type: string
      minLength: 1
      description: A globally unique object identifier for Microsoft accounts. An email address for Google accounts.
      example: 5d3qmne77v32r8l4phyuksl2x, nyla@example.com
    common_response:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
    message:
      title: Message
      type: object
      properties:
        attachments:
          type: array
          description: 'An array of Attachment objects. For Google, linked Google Drive files are not included. For

            Microsoft, linked OneDrive files are not included.'
          items:
            $ref: '#/components/schemas/attachment'
          uniqueItems: true
          minItems: 0
          example:
          - content_disposition: attachment
            content_type: text/calendar
            filename: null
            content_id: 4kj2jrcoj9ve5j9yxqz5cuv98
            size: 1708
          - content_disposition: attachment
            content_type: application/ics
            filename: invite.ics
            content_id: 70jcsv367jaiavt4njeu4xswg
            size: 1708
        bcc:
          type: array
          description: 'An array of name/email address pairs that the message was BCC''d to. For received messages, this

            is nearly always empty.'
          items:
            $ref: '#/components/schemas/message-participant'
        body:
          type: string
          description: 'The body of the message as either plain-text or HTML content. If the message has both plain-text

            and HTML, Nylas returns the HTML version.'
          example: Hello, I just sent a message using Nylas!
        cc:
          type: array
          description: An array of name/email address pairs that the message was CC'd to.
          items:
            $ref: '#/components/schemas/message-participant'
        date:
          type: integer
          description: 'Unix timestamp in seconds that represents when _the mail server_ received the message. This might be

            different from the unified `Date` header in a raw Message object.'
          example: 1635355739
        folders:
          type: array
          description: 'The IDs of the folders that the message appears in. Microsoft messages can be in a single folder

            only. Google allows a single message to appear in multiple folders.'
          items:
            type: string
          uniqueItems: true
          example:
          - 8l6c4d11y1p4dm4fxj52whyr9
          - d9zkcr2tljpu3m4qpj7l2hbr0
        from:
          type: array
          description: 'A list of name/email address pairs that the message was sent from. This is usually one pair only,

            but can be many.'
          items:
            $ref: '#/components/schemas/message-participant-response'
          uniqueItems: true
        grant_id:
          $ref: '#/components/schemas/grant_id'
        headers:
          type: array
          description: "An array of key-value pairs that contain the message headers. Nylas returns this field when you\nset the `fields` query parameter to either `include_headers` or `include_basic_headers`.\n\n- `fields=include_headers`: Returns the full set of headers on the message.\n- `fields=include_basic_headers`: Returns only the three RFC threading headers (`Message-ID`,\n  `In-Reply-To`, `References`). Use this option when you only need to track message identity and\n  thread relationships — payload size is significantly smaller than `include_headers`.\n\nA single message can sometimes have multiple headers with the same key name. Nylas adds all of\nthe headers to the `headers` array without merging or de-duplicating the data. When the headers\ncontain encoded data, Nylas adds it to the `headers` array without decoding it. If you need the\ndecoded data, you need to build decoding logic into your project.\n\nSome headers might contain raw MIME information (for example,\n`=?Windows-1252?Q?Re:_Candidature_de_Mme_Leyah_Miller?=`)."
          items:
            $ref: '#/components/schemas/message-header'
        id:
          $ref: '#/components/schemas/id'
        in_reply_to:
          type: string
          description: '(EWS only) The ID of the message that this message replies to. This ID is the same as the

            `In-Reply-To` header.'
          example: <b0582d2c-816d-42a4-9ff8-46073170d827@me.com>
        metadata:
          $ref: '#/components/schemas/metadata'
        object:
          type: string
          description: The object type of the response (in this case, `message`).
          example: message
        raw_mime:
          type: string
          description: 'A Base64url-encoded string containing the message data (including the body content).


            To get the raw MIME content for a message, set the `fields` query parameter to `raw_mime` in

            your request. When you request raw MIME data, Nylas returns the `grant_id`, `object`, `id`,

            and `raw_mime` fields only.'
        reply_to:
          type: array
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
          description: An array of name/email address pairs that should receive replies to the message.
        snippet:
          type: string
          minLength: 1
          description: 'A short snippet (the first 100 characters, with HTML tags removed) of the message body. This is

            useful for displaying a preview of the message.'
          example: 'You have been invited to the following event. Welcome! WhenThu Oct 28, 2021

            7am - 8am Eastern Time - Toronto Joining info'
        starred:
          type: boolean
          description: 'If `true`, shows that the message has been starred by the user. For EWS, this is only supported

            on Microsoft Exchange 2010 or later.'
          example: false
        subject:
          type: string
          description: The subject of the message.
          example: Nylas Send v3 Email
        thread_id:
          type: string
          minLength: 1
          description: 'A reference to the parent Thread object. Every message is associated with a thread, whether that

            thread contains one message or many. If the message is new, Nylas assigns a `thread_id` to it.'
          example: 1t8tv3890q4vgmwq6pmdwm8qgsaer
        to:
          type: array
          description: An array of name/email address pairs that the message was sent to.
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
        tracking_options:
          type: object
          description: Tracking options for the message.
          properties:
            opens:
              type: boolean
              description: When `true`, shows that message open tracking is enabled.
              example: true
            thread_replies:
              type: boolean
              description: When `true`, shows that thread replied tracking is enabled.
              example: true
            links:
              type: boolean
              description: When `true`, shows that link clicked tracking is enabled.
              example: true
            label:
              type: string
              description: A label describing the message tracking purpose.
              maxLength: 2048
              example: Tracking test
        unread:
          type: boolean
          description: If `true`, shows that the message has not been read by the user.
          example: true
    common_response_with_cursor:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
        next_cursor:
          type:
          - string
          - 'null'
          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    thread:
      title: Thread
      type: object
      properties:
        grant_id:
          $ref: '#/components/schemas/grant_id'
        id:
          $ref: '#/components/schemas/id'
        object:
          type: string
          description: The type of object (in this case, `thread`).
        latest_draft_or_message:
          type: object
          description: The latest message or draft in the thread.
          $ref: '#/components/schemas/message'
        has_attachments:
          type: boolean
          description: When `true`, indicates that the message has attachments.
          example: false
        has_drafts:
          type: boolean
          description: When `true`, indicates that the message is a draft.
          example: false
        earliest_message_date:
          type: integer
          description: 'The date when the earliest or first message in the thread was sent or received, in seconds using the Unix timestamp

            format.'
        latest_message_received_date:
          type: integer
          description: 'The date when the most recent incoming message in the thread was received, in seconds using the Unix timestamp

            format.'
        latest_message_sent_date:
          type: integer
          description: The date when the most recent outgoing message in the thread was sent, in seconds using the Unix timestamp format.
        participants:
          type: array
          description: A sub-object that contains the names and email addresses of all participants in the thread.
          items:
            type: object
            properties:
              email:
                type: string
              name:
                type: string
        snippet:
          type: string
          minLength: 1
          description: 'A short snippet (the first 100 characters, with HTML tags removed) of the body of the last

            received message. This is useful for displaying a preview of a message.'
          example: jnlnnn --Sent with Nylas
        starred:
          type: boolean
          description: 'When `true`, indicates that the thread is starred. For EWS, this is only supported for Microsoft

            Exchange 2010 or later.'
          example: false
        subject:
          type: string
          description: The subject line of the thread.
          example: Nylas Send v3 Thread
        unread:
          type: boolean
          description: When `false`, indicates that all messages in the thread have been read.
        message_ids:
          type: array
          description: An array of IDs for all messages in the thread.
          items:
            type: string
        draft_ids:
          type: array
          description: An array of IDs for all drafts in the thread.
          items:
            type: string
        folders:
          type: array
          description: 'An array of folder IDs for all folders that the messages in the thread appear in.


            Microsoft messages can only be in one folder at a time. Google messages can be in multiple

            folders.'
          items:
            type: string
          uniqueItems: true
          example:
          - 8l6c4d11y1p4dm4fxj52whyr9
          - d9zkcr2tljpu3m4qpj7l2hbr0
    message-participant-response:
      title: Message participant response
      type: object
      description: A name/email address pair.
      properties:
        name:
          type: string
          example: Jon Snow
        email:
          type: string
          format: email
          example: jon.snow@example.com
    message-participant:
      title: Message participant
      type: object
      description: A name/email address pair.
      properties:
        name:
          type: string
          example: Jon Snow
        email:
          type: string
          format: email
          example: jon.snow@example.com
      required:
      - email
    metadata:
      title: Metadata
      type: object
      description: 'The metadata associated with the object. For more information, see

        [Metadata](/docs/reference/api/#metadata).'
      additionalProperties:
        type: string
        description: A key-value pair.
        maxLength: 500
      maxProperties: 50
    message-header:
      title: Message header
      type: object
      description: A message header key-value pair.
      properties:
        name:
          type: string
          example: Date
        value:
          type: string
          example: Thu, 15 Aug 2024 00:59:58 +0000 (UTC)
      required:
