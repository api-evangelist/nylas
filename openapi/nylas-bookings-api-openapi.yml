servers:
- url: https://api.us.nylas.com
  description: U.S.
- url: https://api.eu.nylas.com
  description: E.U.
security:
- ACCESS_TOKEN: []
- NYLAS_API_KEY: []
tags:
- name: Bookings
  description: Nylas Scheduler uses the `/v3/scheduling/bookings` endpoint to manage bookings.
paths:
  /v3/scheduling/bookings:
    parameters:
    - schema:
        type: string
      name: timezone
      in: query
      required: false
      description: The timezone to use for the booking. If not provided, Nylas uses the timezone from the Configuration object.
    - schema:
        type: string
      name: configuration_id
      in: query
      required: false
      description: The ID of the Configuration object whose settings are used for calculating availability. If you're using session authentication (`requires_session_auth` is set to `true`), `configuration_id` is not required.
    - schema:
        type: string
      name: slug
      in: query
      required: false
      description: The slug of the Configuration object. You can use this with the `client_id` instead of using the `configuration_id`. If you're using session authentication (`requires_session_auth` is set to `true`) or using the `configuration_id`, `slug` is not required.
    - schema:
        type: string
      name: client_id
      in: query
      required: false
      description: The client ID that was used to create the Configuration object. `client_id` is required only if you're using `slug`.
    post:
      summary: Book an event
      tags:
      - Bookings
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/calendar.events
          others: https://www.googleapis.com/auth/calendar
        microsoft:
          min: https://graph.microsoft.com/Calendars.ReadWrite
          others: ''
      requestBody:
        $ref: '#/components/requestBodies/booking_create'
      responses:
        '200':
          $ref: '#/components/responses/booking_create'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: post-bookings
      description: 'Books an event with the participants listed in the session''s

        Configuration object, using the details from the

        Configuration. The `start_time` and `end_time` must correspond to a valid time slot returned by

        the

        Scheduling Availability endpoint

        using the same Configuration.


        Nylas validates the session ID and uses it to retrieve the related Configuration object. If you

        created a public Configuration, you don''t need to include the `Authorization` request header with

        a session ID, but you do need to pass the Configuration object ID as a query parameter.'
      x-code-samples:
      - lang: bash
        label: cURL (Public)
        source: "curl --compressed --request POST \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings?configuration_id=<SCHEDULER_CONFIG_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"start_time\": 1709643600,\n    \"end_time\": 1709645400,\n    \"participants\": [],\n    \"guest\": {\n      \"name\": \"Jane Doe\",\n      \"email\": \"jane.doe@example.com\"\n    }\n  }'"
      - lang: bash
        label: cURL (Private)
        source: "curl --compressed --request POST \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <SCHEDULER_SESSION_ID>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"start_time\": 1709643600,\n    \"end_time\": 1709645400,\n    \"participants\": [],\n    \"guest\": {\n      \"name\": \"Jane Doe\",\n      \"email\": \"jane.doe@example.com\"\n    }\n  }'"
      - lang: javascript
        label: Node.js SDK (Public)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function createBooking() {\n  try {\n    const booking = await nylas.scheduler.bookings.create({\n      queryParams: {\n        configurationId: \"<SCHEDULER_CONFIG_ID>\",\n      },\n      requestBody: {\n        startTime: 1763119800,\n        endTime: 1763121600,\n        guest: {\n          name: \"Jane Doe\",\n          email: \"jane.doe@example.com\",\n        },\n      },\n    });\n    console.log(\"Created Booking\", booking);\n  } catch (error) {\n    console.error(\"Error creating booking\", error);\n  }\n}\ncreateBooking();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nbooking = nylas.scheduler.bookings.create(\n    request_body={\n        \"start_time\": 1763119800,\n        \"end_time\": 1763121600,\n        \"guest\": {\n            \"name\": \"Jane Doe\",\n            \"email\": \"jane.doe@example.com\",\n        },\n    },\n    query_params={\n        \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n    },\n)\n\nprint(\"Created booking:\", booking)\n"
      - lang: javascript
        label: Node.js SDK (Private)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function createBooking() {\n  try {\n    const booking = await nylas.scheduler.bookings.create({\n      requestBody: {\n        startTime: 1763119800,\n        endTime: 1763121600,\n        guest: {\n          name: \"Jane Doe\",\n          email: \"jane.doe@example.com\",\n        },\n      },\n    });\n    console.log(\"Created Booking\", booking);\n  } catch (error) {\n    console.error(\"Error creating booking\", error);\n  }\n}\ncreateBooking();\n"
      - lang: ruby
        label: Ruby SDK (Public)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  \"start_time\": 1709643600,\n  \"end_time\": 1709645400,\n  \"participants\": [],\n  \"guest\": {\n    \"name\": \"Jane Doe\",\n    \"email\": \"jane.doe@example.com\"\n  }\n}\n\nbooking, _request_ids = nylas.scheduler.bookings.create(request_body: request_body, query_params: { configuration_id: \"<SCHEDULER_CONFIG_ID>\" })\n\nputs booking"
      - lang: ruby
        label: Ruby SDK (Private)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<SCHEDULER_SESSION_ID>\"\n)\n\nrequest_body = {\n  \"start_time\": 1709643600,\n  \"end_time\": 1709645400,\n  \"participants\": [],\n  \"guest\": {\n    \"name\": \"Jane Doe\",\n    \"email\": \"jane.doe@example.com\"\n  }\n}\n\nbooking, _request_ids = nylas.scheduler.bookings.create(request_body: request_body)\n\nputs booking"
      - lang: java
        label: Java SDK (Public)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.Booking;\nimport com.nylas.models.BookingGuest;\nimport com.nylas.models.CreateBookingQueryParams;\nimport com.nylas.models.CreateBookingRequest;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\nimport com.nylas.models.Response;\n\npublic class CreateBookingPublic {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    BookingGuest guest = new BookingGuest(\"jane.doe@example.com\", \"Jane Doe\");\n\n    CreateBookingRequest requestBody = new CreateBookingRequest.Builder()\n        .startTime(\"1763119800\")\n        .endTime(\"1763121600\")\n        .guest(guest)\n        .build();\n\n    // Public Configuration objects need the configuration ID as a query parameter.\n    CreateBookingQueryParams queryParams = new CreateBookingQueryParams.Builder()\n        .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n        .build();\n\n    Response<Booking> booking = nylas.scheduler().bookings().create(requestBody, queryParams);\n\n    System.out.println(\"Created booking: \" + booking.getData());\n  }\n}\n"
      - lang: java
        label: Java SDK (Private)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.Booking;\nimport com.nylas.models.BookingGuest;\nimport com.nylas.models.CreateBookingRequest;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\nimport com.nylas.models.Response;\n\npublic class CreateBooking {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    // Use a Scheduler session ID as the API key for session-authenticated bookings.\n    NylasClient nylas = new NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build();\n\n    BookingGuest guest = new BookingGuest(\"jane.doe@example.com\", \"Jane Doe\");\n\n    CreateBookingRequest requestBody = new CreateBookingRequest.Builder()\n        .startTime(\"1763119800\")\n        .endTime(\"1763121600\")\n        .guest(guest)\n        .build();\n\n    Response<Booking> booking = nylas.scheduler().bookings().create(requestBody);\n\n    System.out.println(\"Created booking: \" + booking.getData());\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Public)
        source: "import com.nylas.NylasClient\nimport com.nylas.models.BookingGuest\nimport com.nylas.models.CreateBookingQueryParams\nimport com.nylas.models.CreateBookingRequest\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val guest = BookingGuest(email = \"jane.doe@example.com\", name = \"Jane Doe\")\n\n  val requestBody = CreateBookingRequest.Builder()\n      .startTime(\"1763119800\")\n      .endTime(\"1763121600\")\n      .guest(guest)\n      .build()\n\n  // Public Configuration objects need the configuration ID as a query parameter.\n  val queryParams = CreateBookingQueryParams.Builder()\n      .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n      .build()\n\n  val booking = nylas.scheduler().bookings().create(requestBody, queryParams)\n\n  println(\"Created booking: ${booking.data}\")\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Private)
        source: "import com.nylas.NylasClient\nimport com.nylas.models.BookingGuest\nimport com.nylas.models.CreateBookingRequest\n\nfun main() {\n  // Use a Scheduler session ID as the API key for session-authenticated bookings.\n  val nylas = NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build()\n\n  val guest = BookingGuest(email = \"jane.doe@example.com\", name = \"Jane Doe\")\n\n  val requestBody = CreateBookingRequest.Builder()\n      .startTime(\"1763119800\")\n      .endTime(\"1763121600\")\n      .guest(guest)\n      .build()\n\n  val booking = nylas.scheduler().bookings().create(requestBody)\n\n  println(\"Created booking: ${booking.data}\")\n}\n"
      security:
      - SCHEDULER_SESSION_TOKEN: []
  /v3/scheduling/bookings/{booking_id}:
    parameters:
    - schema:
        type: string
      name: booking_id
      in: path
      required: true
      description: The ID of the booking object to access.
    - schema:
        type: string
      name: configuration_id
      in: query
      required: false
      description: 'The ID of the Configuration object used for calculating availability. If you''re using session

        authentication (`requires_session_auth: true`), the `configuration_id` isn''t required.'
    - schema:
        type: string
      name: slug
      in: query
      required: false
      description: 'The Configuration object slug. You can use this with the `client_id` instead of using the

        `configuration_id`. If you''re using session authentication (`requires_session_auth: true`) or

        using the `configuration_id`, `slug` isn''t required.'
    - schema:
        type: string
      name: client_id
      in: query
      required: false
      description: 'The client ID that was used to create the Configuration object. Required only if you''re using

        `slug`.'
    get:
      summary: Return a booking
      tags:
      - Bookings
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/calendar.events
          others: https://www.googleapis.com/auth/calendar
        microsoft:
          min: https://graph.microsoft.com/Calendars.ReadWrite
          others: ''
      operationId: get-bookings-id
      description: 'Returns the specified Booking object.


        Nylas validates the provided session ID and uses it to retrieve the related

        Configuration object. If you created a public

        Configuration, you don''t need to include the `Authorization` request header with a session ID, but

        you do need to pass the Configuration object ID as a query parameter.'
      x-code-samples:
      - lang: bash
        label: cURL (Public)
        source: "curl --compressed --request GET \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>?configuration_id=<SCHEDULER_CONFIG_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json'"
      - lang: bash
        label: cURL (Private)
        source: "curl --compressed --request GET \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <SCHEDULER_SESSION_ID>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK (Public)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchBookingById() {\n  try {\n    const booking = await nylas.scheduler.bookings.find({\n      queryParams: {\n        configurationId: \"<SCHEDULER_CONFIG_ID>\",\n      },\n      bookingId: \"<BOOKING_ID>\",\n    });\n    console.log(\"Booking\", booking);\n  } catch (error) {\n    console.error(\"Error fetching booking\", error);\n  }\n}\n\nfetchBookingById();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nbooking = nylas.scheduler.bookings.find(\n    booking_id=\"<BOOKING_ID>\",\n    query_params={\n        \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n    },\n)\n\nprint(\"Booking:\", booking)\n"
      - lang: javascript
        label: Node.js SDK (Private)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<SCHEDULER_SESSION_ID>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchBookingById() {\n  try {\n    const booking = await nylas.scheduler.bookings.find({\n      bookingId: \"<BOOKING_ID>\",\n    });\n    console.log(\"Booking\", booking);\n  } catch (error) {\n    console.error(\"Error fetching booking\", error);\n  }\n}\n\nfetchBookingById();\n"
      - lang: ruby
        label: Ruby SDK (Public)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nbooking, _request_ids = nylas.scheduler.bookings.find(booking_id: \"<SCHEDULER_BOOKING_ID>\", query_params: { configuration_id: \"<SCHEDULER_CONFIG_ID>\" })\n\nputs booking"
      - lang: ruby
        label: Ruby SDK (Private)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<SCHEDULER_SESSION_ID>\"\n)\n\nbooking, _request_ids = nylas.scheduler.bookings.find(booking_id: \"<SCHEDULER_BOOKING_ID>\")\n\nputs booking"
      - lang: java
        label: Java SDK (Public)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.Booking;\nimport com.nylas.models.FindBookingQueryParams;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\nimport com.nylas.models.Response;\n\npublic class FindBookingPublic {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    FindBookingQueryParams queryParams = new FindBookingQueryParams.Builder()\n        .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n        .build();\n\n    Response<Booking> booking = nylas.scheduler().bookings().find(\"<BOOKING_ID>\", queryParams);\n\n    System.out.println(\"Booking: \" + booking.getData());\n  }\n}\n"
      - lang: java
        label: Java SDK (Private)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.Booking;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\nimport com.nylas.models.Response;\n\npublic class FindBooking {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build();\n\n    Response<Booking> booking = nylas.scheduler().bookings().find(\"<BOOKING_ID>\");\n\n    System.out.println(\"Booking: \" + booking.getData());\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Public)
        source: "import com.nylas.NylasClient\nimport com.nylas.models.FindBookingQueryParams\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val queryParams = FindBookingQueryParams.Builder()\n      .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n      .build()\n\n  val booking = nylas.scheduler().bookings().find(\"<BOOKING_ID>\", queryParams)\n\n  println(\"Booking: ${booking.data}\")\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Private)
        source: "import com.nylas.NylasClient\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build()\n\n  val booking = nylas.scheduler().bookings().find(\"<BOOKING_ID>\")\n\n  println(\"Booking: ${booking.data}\")\n}\n"
      responses:
        '200':
          $ref: '#/components/responses/booking_create'
        '400':
          $ref: '#/components/responses/400'
        '401':
