      security:
      - SCHEDULER_SESSION_TOKEN: []
    patch:
      summary: Reschedule a booking
      tags:
      - Bookings
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/calendar.events
          others: https://www.googleapis.com/auth/calendar
        microsoft:
          min: https://graph.microsoft.com/Calendars.ReadWrite
          others: ''
      operationId: patch-bookings-id
      description: 'Reschedules the specified booking. Nylas also updates the associated event on the provider.


        Nylas recommends against changing participants'' email addresses while updating a booking, to avoid

        confusion.


        Nylas validates the provided session ID and uses it to retrieve the related

        Configuration object. If you created a public

        Configuration, you don''t need to include the `Authorization` request header with a session ID, but

        you do need to pass the Configuration object ID as a query parameter.


        When you make a `PATCH` request, Nylas replaces all data in the nested object with the information

        included in your request. For more information, see

        Updating objects.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/booking_update'
                title: Reschedule standard booking
              - $ref: '#/components/schemas/booking_update_group'
                title: Reschedule group booking
      x-code-samples:
      - lang: bash
        label: cURL (Public)
        source: "curl --compressed --request PATCH \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>?configuration_id=<SCHEDULER_CONFIG_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"start_time\": 1708714800,\n    \"end_time\": 1708722000\n  }'"
      - lang: bash
        label: cURL (Private)
        source: "curl --compressed --request PATCH \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <SCHEDULER_SESSION_ID>' \\\n  --header 'Content-Type: application/json' \\ \n  --data '{\n    \"start_time\": 1708714800,\n    \"end_time\": 1708722000\n  }'"
      - lang: javascript
        label: Node.js SDK (Public)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function rescheduleBooking() {\n  try {\n    const booking = await nylas.scheduler.bookings.reschedule({\n      queryParams: {\n        configurationId: \"<SCHEDULER_CONFIG_ID>\",\n      },\n      bookingId: \"booking-id\",\n      requestBody: {\n        startTime: 1763292600,\n        endTime: 1763294400,\n      },\n    });\n    console.log(\"Rescheduled Booking\", booking);\n  } catch (error) {\n    console.error(\"Error rescheduling booking\", error);\n  }\n}\n\nrescheduleBooking();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nbooking = nylas.scheduler.bookings.confirm(\n    booking_id=\"<BOOKING_ID>\",\n    request_body={\n        \"salt\": \"<SALT>\",\n        \"status\": \"confirmed\",\n    },\n    query_params={\n        \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n    },\n)\n\nprint(\"Confirmed booking:\", booking)\n"
      - lang: javascript
        label: Node.js SDK (Private)
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<SCHEDULER_SESSION_ID>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function rescheduleBooking() {\n  try {\n    const booking = await nylas.scheduler.bookings.reschedule({\n      bookingId: \"booking-id\",\n      requestBody: {\n        startTime: 1763292600,\n        endTime: 1763294400,\n      },\n    });\n    console.log(\"Rescheduled Booking\", booking);\n  } catch (error) {\n    console.error(\"Error rescheduling booking\", error);\n  }\n}\n\nrescheduleBooking();\n"
