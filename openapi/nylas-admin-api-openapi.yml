    patch:
      operationId: update_connector_by_provider
      tags:
      - Admin
      summary: Update a connector
      description: 'Update the connector for the specified provider.


        When you make a `PATCH` request, Nylas replaces all data in the nested object with the information

        included in your request. For more information, see

        [Updating objects](/docs/reference/api/#updating-objects).'
      security:
      - NYLAS_API_KEY: []
      parameters:
      - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  description: Oauth provider credentials and settings
                  example:
                    tenant: common
                scope:
                  type: array
                  description: Oauth "scope" parameter
                  example:
                  - Mail.Read
                  - User.Read
                  - offline_access
                  items:
                    type: string
                active_credential_id:
                  type: string
                  description: (Optional) The ID of the "default" credential record of this Connector. This credential will be used as a default for communication with the provider.
                  example: c123f8e1a-eb1c-41c0-b6a6-d2e59daf7f47
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: ID of the request
                    example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
                  data:
                    $ref: '#/components/schemas/ConnectorObject'
          description: Returns the connector object (previously called an integration) for the provider you specify.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: Not Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request PATCH \\\n  --url 'https://api.us.nylas.com/v3/connectors/<PROVIDER>' \\\n  --header 'Content-Type: application/json' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --data '{\n    \"name\": \"google\"\n  }'"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nconnector = nylas.connectors.update(\n    provider=\"google\",\n    request_body={\n        \"name\": \"google\"\n    }\n)\n\nprint(\"Connector:\", connector)\n"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\n\nnylas = Nylas::Client.new(\n    api_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  scope: [\n    'https://www.googleapis.com/auth/contacts'\n  ]\n}\n\nconnector = nylas.connectors.update(provider: \"google\", request_body: request_body)\n\nputs connector\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class ListDraft {\n    public static void main(String[] args) throws \n    NylasSdkTimeoutError, NylasApiError {\n\n        NylasClient nylas = \n        new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        List<String> scope = new ArrayList<>();\n        scope.add(\"https://www.googleapis.com/auth/contacts\");\n\n        GoogleConnectorSettings settings = new GoogleConnectorSettings();\n\n        UpdateConnectorRequest.Google request = new UpdateConnectorRequest.Google.Builder()\n            .settings(settings)\n            .scope(scope)\n            .build();\n\n        nylas.connectors().update(AuthProvider.GOOGLE, request);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.AuthProvider\nimport com.nylas.models.GoogleConnectorSettings\nimport com.nylas.models.UpdateConnectorRequest\n\nfun main(args: Array<String>) {\n\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n    val settings : GoogleConnectorSettings = \n    GoogleConnectorSettings()\n\n    val request = \n    UpdateConnectorRequest.Google(settings)\n\n    val connector = \n    nylas.connectors().update(AuthProvider.GOOGLE, \n    request)\n    println(connector)\n}\n"
