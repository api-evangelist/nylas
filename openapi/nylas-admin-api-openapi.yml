    post:
      summary: Verify domain
      tags:
      - Admin
      operationId: verify-domain
      description: '<div id="admonition-warning">⚠️ <b>Before you can use the Manage Domains endpoints, you need a <a href="/docs/v3/auth/nylas-service-account/">Nylas Service Account</a></b>.</div>


        Triggers a verification check for the specified DNS record type. Before calling this endpoint,

        add the required DNS records to your domain''s DNS configuration. You can get the required records

        by calling the [Get domain info](/docs/reference/api/manage-domains/get-domain-info/) endpoint.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  description: The type of DNS verification to trigger.
                  enum:
                  - ownership
                  - mx
                  - spf
                  - dkim
                  - feedback
                  example: dkim
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl -X POST \"https://api.us.nylas.com/v3/admin/domains/<DOMAIN_ID>/verify\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Nylas-Signature: <BASE64_SIGNATURE>\" \\\n  -H \"X-Nylas-Kid: <SERVICE_ACCOUNT_ID>\" \\\n  -H \"X-Nylas-Nonce: <NONCE>\" \\\n  -H \"X-Nylas-Timestamp: 1742932766\" \\\n  -d '{\n    \"type\": \"dkim\"\n  }'"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\nfrom nylas.handler.service_account import ServiceAccountSigner\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nsigner = ServiceAccountSigner(\n    private_key_pem=\"<SERVICE_ACCOUNT_PRIVATE_KEY_PEM>\",\n    private_key_id=\"<SERVICE_ACCOUNT_ID>\",\n)\n\nresult = nylas.domains.verify(\n    domain_id=\"<DOMAIN_ID>\",\n    request_body={\n        \"type\": \"dkim\",\n    },\n    signer=signer,\n)\n\nprint(result)\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: ID of the request.
                    example: 5fa64c92-e840-4357-86b9-2aa364d35b88
                  data:
                    $ref: '#/components/schemas/DomainVerificationResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
