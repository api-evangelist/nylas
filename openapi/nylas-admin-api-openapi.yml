        label: cURL
        source: "curl -X POST \"https://api.us.nylas.com/v3/policies\" \\\n  -H \"Authorization: Bearer <NYLAS_API_KEY>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"name\": \"Standard Agent Account Policy\",\n    \"spam_detection\": {\n      \"use_list_dnsbl\": true,\n      \"use_header_anomaly_detection\": true,\n      \"spam_sensitivity\": 1.5\n    },\n    \"limits\": {\n      \"limit_attachment_size_limit\": 26214400,\n      \"limit_attachment_count_limit\": 20,\n      \"limit_inbox_retention_period\": 365,\n      \"limit_spam_retention_period\": 30\n    }\n  }'\n"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function createPolicy() {\n  try {\n    const policy = await nylas.policies.create({\n      requestBody: {\n        name: \"Standard Agent Account Policy\",\n        rules: [\"<RULE_ID>\"],\n        limits: {\n          limitAttachmentSizeLimit: 26214400,\n          limitAttachmentCountLimit: 20,\n          limitInboxRetentionPeriod: 365,\n          limitSpamRetentionPeriod: 30,\n        },\n        spamDetection: {\n          useListDnsbl: true,\n          useHeaderAnomalyDetection: true,\n          spamSensitivity: 1.5,\n        },\n      },\n    });\n\n    console.log(\"Policy:\", policy);\n  } catch (error) {\n    console.error(\"Error creating policy:\", error);\n  }\n}\n\ncreatePolicy();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\npolicy = nylas.policies.create(\n    request_body={\n        \"name\": \"Standard Agent Account Policy\",\n        \"spam_detection\": {\n            \"use_list_dnsbl\": True,\n            \"use_header_anomaly_detection\": True,\n            \"spam_sensitivity\": 1.5,\n        },\n        \"limits\": {\n            \"limit_attachment_size_limit\": 26214400,\n            \"limit_attachment_count_limit\": 20,\n            \"limit_inbox_retention_period\": 365,\n            \"limit_spam_retention_period\": 30,\n        },\n    },\n)\n\nprint(policy)\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: ID of the request.
                    example: 5fa64c92-e840-4357-86b9-2aa364d35b88
                  data:
                    $ref: '#/components/schemas/PolicyObject'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
