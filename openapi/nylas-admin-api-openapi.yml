    put:
      summary: Update a rule
      tags:
      - Admin
      operationId: update-rule
      description: 'Updates the specified rule. All fields are optional — only provided fields are updated. The same validation rules

        apply as on create.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Block spam domains (updated)
                description:
                  type: string
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                enabled:
                  type: boolean
                trigger:
                  type: string
                  enum:
                  - inbound
                  - outbound
                  description: 'The trigger the rule listens for. Inbound rules accept only `from.*` conditions. Outbound

                    rules accept `from.*`, `recipient.*`, and `outbound.type`.'
                match:
                  type: object
                  properties:
                    operator:
                      type: string
                      enum:
                      - any
                      - all
                      description: Optional. When omitted, the rule defaults to `all`.
                    conditions:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                            enum:
                            - from.address
                            - from.domain
                            - from.tld
                            - recipient.address
                            - recipient.domain
                            - recipient.tld
                            - outbound.type
                            description: '`from.*` fields match the normalized sender and are valid on both triggers.

                              `recipient.*` fields and `outbound.type` apply only to `outbound` rules.

                              `recipient.*` matches any recipient on the send, including To, CC, BCC, and SMTP

                              envelope recipients.'
                          operator:
                            type: string
                            enum:
                            - is
                            - is_not
                            - contains
                            - in_list
                            description: '`outbound.type` accepts only `is` and `is_not`.'
                          value:
                            oneOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                            description: 'For `in_list`, pass an array of List IDs. For `outbound.type`, pass `compose` or

                              `reply` (normalized to lowercase).'
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - block
                        - mark_as_spam
                        - assign_to_folder
                        - mark_as_read
                        - mark_as_starred
                        - archive
                        - trash
                      value:
                        type: string
                        description: 'Required when `type` is `assign_to_folder` — the target folder by name. Use a custom

                          folder''s name (or its full path for a nested folder, e.g. `Clients/Acme`), or a system

                          folder name (`Inbox`, `Sent`, `Drafts`, `Trash`, `Junk`, `Archive`).'
                        example: Receipts
