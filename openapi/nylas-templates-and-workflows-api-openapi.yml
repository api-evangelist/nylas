      tags:
      - Templates and Workflows
      operationId: render-template-html
      description: 'Renders the HTML content of an application-level template using the provided variables and specified

        templating engine.'
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
