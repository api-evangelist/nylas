          schema:
            $ref: '#/components/schemas/create_folder'
          examples:
            Google Folder:
              value:
                name: Invoices
                text_color: '#fff'
                background_color: '#00FF00'
            Microsoft Folder:
              value:
                name: Invoices
                parent_id: AAMkADk0ZWVhMzJhLWY1ODktNDRhZi1hNDcyLWJkMDRlYmE0MTc3ZAAuAAAAAAC6eJwD9EoFS4TLH1YcoDjXAQDIFSkx-42TT5zffjtLuf8AAAAAAAEIAAA=
  securitySchemes:
    ACCESS_TOKEN:
      scheme: bearer
      type: http
