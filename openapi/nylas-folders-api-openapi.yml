      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request POST \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/folders' \\\n  --header 'Content-Type: application/json' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --data '{\n    \"text_color\": \"#000000\",\n    \"name\": \"new folder\",\n    \"background_color\": \"#73AFFF\"\n  }'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\nconst identifier = \"<NYLAS_GRANT_ID>\";\n\nconst createFolder = async () => {\n  try {\n    const folder = await nylas.folders.create({\n      identifier,\n      requestBody: {\n        name: \"New Folder\",\n      },\n    });\n\n    console.log(\"Folder created:\", folder);\n  } catch (error) {\n    console.error(\"Error creating folder:\", error);\n  }\n};\n\ncreateFolder();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\n\nfolder = nylas.folders.create(\n  grant_id,\n  request_body={\n    \"name\": 'New Folder',\n  }\n)\n\nprint(folder)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\n\nnylas = Nylas::Client.new(\n    api_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  name: \"My Custom label\"\n}\n\nfolder = nylas.folders.create(identifier: \"<NYLAS_GRANT_ID>\", \n    request_body: request_body)"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\n\npublic class CreateFolder {\n\n    public static void main(String[] args) throws \n    NylasSdkTimeoutError, NylasApiError {\n\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        CreateFolderRequest request = \n        new CreateFolderRequest(\"My Custom folder\", \"\", \"\", \"\");\n\n        Response<Folder> label =  \n        nylas.folders().create(\"<NYLAS_GRANT_ID>\", request);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.CreateFolderRequest\n\nfun main(args: Array<String>) {\n\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n   val request = CreateFolderRequest(\"My Custom folder\")\n   val folder = nylas.folders().create(\"<NYLAS_GRANT_ID>\",  request).data\n   println(folder.name)\n}\n"
