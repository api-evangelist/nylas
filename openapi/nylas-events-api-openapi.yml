    event_common:
      title: Event
      type: object
      properties:
        busy:
          type: boolean
          description: 'If `true`, shows the event''s time block as `busy` on shared or public calendars. This may be

            called "transparency" in some systems.'
        calendar_id:
          $ref: '#/components/schemas/event_calendar_id'
        conferencing:
          $ref: '#/components/schemas/event_conferencing_response'
        created_at:
          $ref: '#/components/schemas/event_created_at'
        description:
          type:
          - string
          - 'null'
          description: 'A brief description of the event (for example, its agenda). The description might be returned

            as an HTML string, depending on how the provider formats it.

            For Google accounts, this field accepts a maximum of 8,192 characters.'
          example: Time for us to sync weekly on any new project changes
          minLength: 0
        text_description:
          type:
          - string
          - 'null'
          description: 'A brief text description of the event (for example, its agenda). If the description is HTML-formatted,

            this field will contain the text version of the description.'
          example: Time for us to sync weekly on any new project changes
          minLength: 0
        hide_participants:
          type: boolean
          description: (Not supported for iCloud or EWS events) When `true`, hides the event's list of participants.
        grant_id:
          $ref: '#/components/schemas/grant_id'
        html_link:
          $ref: '#/components/schemas/event_html_link'
        ical_uid:
          $ref: '#/components/schemas/event_ical_uid'
        id:
          $ref: '#/components/schemas/event_id'
        location:
          type:
          - string
          - 'null'
          description: The location of the event (for example, a physical address or the name of a meeting room).
        master_event_id:
          type:
          - string
          - 'null'
          description: 'If the event is an instance of a recurring event series, this field lists the ID of the parent

            event. If the parent event belongs to a different calendar that you don''t have access to, or it''s

            been deleted or cancelled, you can''t retrieve it using this ID.'
        metadata:
          $ref: '#/components/schemas/metadata'
        object:
          $ref: '#/components/schemas/object'
        organizer:
          $ref: '#/components/schemas/organizer'
        participants:
          $ref: '#/components/schemas/event_participants'
        resources:
          type: array
          description: An array of room resource bookings added to the event.
          items:
            $ref: '#/components/schemas/event_resources'
        read_only:
          $ref: '#/components/schemas/event_read_only'
        reminders:
          $ref: '#/components/schemas/event_reminders'
        recurrence:
          $ref: '#/components/schemas/event_recurrence'
        status:
          $ref: '#/components/schemas/event_status'
        title:
          type: string
          minLength: 1
          description: The name of the event.
          maxLength: 1024
          example: 'Remote Event: Group Yoga Class'
        updated_at:
          $ref: '#/components/schemas/event_updated_at'
        visibility:
          $ref: '#/components/schemas/event_visibility'
        when:
          $ref: '#/components/schemas/event_when_response'
        original_start_time:
          type: integer
          description: '(Not supported for virtual calendars) The original start time of the event, in seconds using the Unix timestamp

            format. This field is present only if the event is an instance of a recurring event.'
          example: 1633698000
        notetaker:
          $ref: '#/components/schemas/event_sync'
    object:
      type: string
      description: The type of object.
    meeting_settings:
      allOf:
      - $ref: '#/components/schemas/meeting_settings_common'
      - type: object
        properties:
          transcription_settings:
            type: object
            nullable: true
            description: "Optional settings that tune how Notetaker transcribes audio. `transcription` must be\n`true` for these settings to take effect. Provide any combination of the fields below.\n\nThe fields fall into two independent groups:\n\n- **Language hints** (`expected_languages`, `fallback_language`) constrain automatic\n  language detection. This declares the languages you expect; it does not translate\n  transcripts or force the recording into a specific language.\n- **Keyword hints** (`keywords`, `use_speaker_names_as_keywords`) bias recognition toward\n  domain-specific terms such as names, acronyms, and product names.\n\nSet on individual Notetakers, on calendar sync, or on event sync. When set on a calendar,\nevents inherit the value unless the event's own request overrides it. Send `null` or `{}`\nto clear inherited settings and return to default transcription behavior.\n\nSee [Set transcription languages](/docs/v3/notetaker/#set-transcription-languages) for\nsupported language codes and validation rules."
            properties:
              expected_languages:
                type: array
                description: 'Language codes the audio is expected to contain. Optional. When provided, it must

                  contain at least one supported code and cannot be `null` or empty. When omitted,

                  transcription considers all supported languages.'
                minItems: 1
                items:
                  type: string
                example:
                - en
                - es
              fallback_language:
                type: string
                description: 'Language to use if Notetaker does not detect one of the `expected_languages`. Optional.

                  When `expected_languages` is set, the fallback must be one of those codes. When

                  `expected_languages` is omitted, transcription considers all supported languages and

                  the fallback may be any supported code. When `fallback_language` is omitted, the

                  transcriber auto-detects the language. The field is not stored, so responses do not

                  return it.'
                example: en
              keywords:
                type: array
                description: 'Domain-specific terms that bias transcription toward recognizing them correctly, such

                  as names, acronyms, and product names. Optional. Up to 200 terms; each term must be

                  1 to 200 characters and cannot contain control characters. Cannot be `null`.'
                maxItems: 200
                items:
                  type: string
                  maxLength: 200
                example:
                - Nylas
                - AssemblyAI
              use_speaker_names_as_keywords:
                type: boolean
                description: 'When `true`, Notetaker adds known speaker names to the keyword set so they are

                  transcribed accurately. Optional. Cannot be `null`.'
                example: true
    event_ical_uid:
      title: iCal format ID
      type:
      - string
      - 'null'
      description: 'A unique ID that you can use to identify events across calendaring systems, in

        [iCalendar format](https://datatracker.ietf.org/doc/html/rfc5545#section-3.8.4.7).

        Recurring events might share the same ID.


        Can be `null` for events synced before the year 2020.'
    event_status:
      title: Event status
      type: string
      description: '(Not supported for iCloud) The status of the event. You can''t set this field when creating or updating

        an event. If you''re the organizer of the event and you want to reply "maybe" or "no" to the

        invitation, use the

        [Send RSVP endpoint](/docs/reference/api/events/send-rsvp/)

        instead.


        For Google events, a `cancelled` status indicates that the event was an occurrence of a recurring

        event, and that the occurrence has been cancelled by the event organizer.


        For Microsoft and EWS events, a `cancelled` status indicates that the event was organized by someone

        else, and the organizer cancelled or deleted the event.'
      example: confirmed
      enum:
      - confirmed
      - cancelled
      - maybe
    common_response_with_cursor:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
        next_cursor:
          type:
          - string
          - 'null'
          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    event_date:
      title: Date
      type: object
      description: 'The date on which the event occurs, without a clock-based start

        or end time (for example, a birthday or holiday).'
      properties:
        date:
          type: string
          example: '2021-05-09'
          description: The date of the event, in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates).
  parameters:
    end:
      name: end
      in: query
      schema:
        type: integer
      description: 'Filter for events that end at or before the specified time, in seconds using the Unix timestamp format. For example, if

        you filter for events that end at 5:00p.m., and the calendar includes an event that runs from

        4:30–5:30p.m., Nylas returns that event.


        Defaults to one month from the time you make the request.


        The `end` value cannot be earlier than `start`. For iCloud accounts, the difference between `start`

        and `end` can''t be greater than one year.'
    metadata_pair:
      name: metadata_pair
      in: query
      required: false
      schema:
        type: string
      description: 'Pass a metadata key/value pair (for example, `?metadata_pair=key1:value`) to search for metadata

        associated with objects. See [Metadata](/docs/reference/api/#metadata) for more information.'
    start:
      name: start
      in: query
      schema:
        type: integer
      description: 'Filter for events that start at or after the specified time, in seconds using the Unix timestamp format. For example, if

        you filter for events that start at 9:00a.m., and the calendar includes an event that runs from

        8:30–9:30a.m., Nylas returns that event.


        Defaults to the time that you make the request.


        The `start` value cannot be later than `end`. For iCloud accounts, the difference between `start`

        and `end` can''t be greater than one year.'
    title:
      name: title
      in: query
      required: false
      schema:
        type: string
      description: Filter for events that match the specified title. The filter is case insensitive and will match partial titles.
    ical_uid:
      name: ical_uid
      in: query
      schema:
        type: string
      description: '(Not supported for iCloud) Filter for events with the specified `ical_uid`. You _cannot_ apply other

        filters if you use this parameter.'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
    busy:
      name: busy
      in: query
      required: false
      schema:
        type: boolean
      description: (Not supported for iCloud) Filter for events with the specified `busy` status.
    updated_after:
      name: updated_after
      in: query
      required: false
      schema:
        type: integer
      description: '(Google, Microsoft, and EWS only) Filter for events that have been updated after the specified time,

        in seconds using the Unix timestamp format.


        `updated_after` is _not_ respected by metadata filtering.'
    calendar_id_no_validate:
      name: calendar_id
      in: query
      required: true
      schema:
        type: string
      description: 'The calendar ID of the event.


        For Microsoft, we do not validate whether the given calendar ID matches the real calendar ID of the event.

        This is due to a limitation of the Microsoft Graph API.


        (Not supported for iCloud) You can use `primary` to query the user''s primary calendar.'
    expand_recurring:
      name: expand_recurring
      in: query
      schema:
        type: boolean
        default: true
      required: false
      deprecated: true
      description: '**This parameter is deprecated. Use the

        [Import Events endpoint](/docs/reference/api/events/import-events/)

        instead**.


        When `true`, Nylas returns all recurring events within the specified time range, including individual

        occurrences of the recurring event. Otherwise, Nylas only returns the parent event and any event

        overrides (individual occurrences that have been edited) in the time range.'
    notify_participants:
      schema:
        type: boolean
        default: true
      in: query
      name: notify_participants
      description: 'Filter for events matching the specified `notify_participants` setting.


        Microsoft and iCloud do _not_ support `notify_participants=false`.'
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    show_cancelled:
      name: show_cancelled
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: '(Not supported for iCloud or EWS) If `true`, Nylas includes events whose `status` is `cancelled`.


        Different providers have different semantics for cancelled events:


        - **Google**: An event is considered cancelled after a user deletes it from their calendar, until

        it''s eventually hard-deleted and is no longer readable.

        - **Microsoft**: An event is considered cancelled if the user is invited to an event and the

        organizer deletes it. The cancelled version of the event stays on the participants'' calendars until

        they delete it manually.'
    updated_before:
      name: updated_before
      in: query
      required: false
      schema:
        type: integer
      description: '(Google, Microsoft, and EWS only) Filter for events that have been updated before the specified time,

        in seconds using the Unix timestamp format.


        `updated_before` is _not_ respected by metadata filtering.'
    grant_id:
      name: grant_id
      schema:
        type: string
      in: path
      required: true
      description: 'ID of the grant to access. You can also use the email address associated with the grant, or use `/me/`

        to refer to the grant associated with an access token.'
      example: nyla@example.com
    event_type:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        enum:
        - default
        - outOfOffice
        - focusTime
        - workingLocation
      description: '(Google only) Filter for events with the specified event type. You can pass this query parameter

        multiple times to select or exclude multiple event types. For example,

        `event_type=default&event_type=outOfOffice` returns all events that are default or `OOO`, and excludes

        any events that are `focusTime` or that have a `workingLocation`.


        If you don''t specify an event type, Nylas uses `default` to filter for regular events that don''t have

        another specific type.'
    description:
      name: description
      in: query
      required: false
      schema:
        type: string
      description: Filter for events matching the specified description. The filter is case insensitive and will match partial descriptions.
    skip_nylas_email:
      name: skip_nylas_email
      in: query
      schema:
        type: boolean
        default: false
      description: When `true`, Nylas does not send the RSVP email to the event organizer.
    master_event_id:
      name: master_event_id
      in: query
      schema:
        type: string
      description: '(Not supported for iCloud) Filter for instances of recurring events with the specified `master_event_id`.


        `master_event_id` is _not_ respected by metadata filtering.


        When using `master_event_id` to fetch recurring events with a Google grant, the order of the results will not be sorted chronologically.

        Instead, Nylas returns the unchanged occurrences first, followed by the modified occurrences.

        For example, if you have a recurring event with the following occurrences:

        - 2025-01-01

        - 2025-01-02

        - 2025-01-03


        But you modify the time of the second occurrence to 2025-01-02, the results will be:

        - 2025-01-01

        - 2025-01-03

        - 2025-01-02 (modified)'
    field_selection:
      name: select
      in: query
      required: false
      schema:
        type: string
      description: 'Specify fields that you want Nylas to return, as a comma-separated list (for example,

        `select=id,updated_at`). This allows you to receive only the portion of object data that you''re

        interested in. You can use `select` to optimize response size and reduce latency by limiting queries

        to only the information that you need.'
    tentative_as_busy:
      name: tentative_as_busy
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: (Microsoft and EWS only) When `true`, Nylas treats tentative events as busy.
    location:
      name: location
      in: query
      required: false
      schema:
        type: string
      description: Filter for events with the specified location. The filter is case insensitive and will match partial locations.
    attendees:
      name: attendees
      in: query
      required: false
      schema:
        type: string
      description: '(Not supported for virtual calendars) Filter for events that include the specified attendees. This

        parameter accepts a comma-delimited list of email addresses.'
    max_results:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 500
      description: 'Specifies the maximum number of events Nylas returns in a single page of results. The actual number

        of events Nylas returns might be lower than this limit, even if other events match your query

        parameters.'
    calendar_id:
      name: calendar_id
      in: query
      required: true
      schema:
        type: string
      description: 'Filter for the specified calendar ID.


        (Not supported for iCloud) You can use `primary` to query the user''s primary calendar.'
  responses:
    events-send_rsvp:
      description: Send-RSVP Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  type: object
                  properties:
                    send_ics_error:
                      type: object
                      description: 'If an error occurs while sending an updated ICS file to the organizer of an event,

                        Nylas returns an error message in this field. The event is still updated, but the

                        ICS file is _not_ sent to the organizer.'
                      properties:
                        type:
                          type: string
                          description: The type of error that occurred.
                        message:
                          type: string
                          description: A human-readable message with details about the error.
          example:
            Event response example:
              request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
              data:
                send_ics_error:
                  type: provider_error
                  message: Request had insufficient authentication scopes.
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
                  provider_error:
                    type: object
                    description: The error from the provider.
          examples:
            Bad Request:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: invalid_request_error
                  message: error parsing request body
                  provider_error:
                    code: TargetIdShouldNotBeMeOrWhitespace
                    message: Id is malformed.
            Invalid Idempotency-Key:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: api.invalid_idempotency_key
                  message: Idempotency-Key must be 256 characters or fewer.
    event:
      description: Event Response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  $ref: '#/components/schemas/event'
          example:
            Event response example:
              request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
              data:
                busy: true
                calendar_id: 7d93zl2palhxqdy6e5qinsakt
                conferencing:
                  provider: Zoom Meeting
                  details:
                    meeting_code: code-123456
                    password: password-123456
                    url: https://zoom.us/j/1234567890?pwd=1234567890
                created_at: 1661874192
                description: Description of my new calendar
