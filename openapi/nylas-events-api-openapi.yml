    group_event_participants:
      title: Group event participants
      type: object
      description: 'An array of participants to include in the event booking. If you don''t specify at least

        one participant, Nylas uses the event organizer instead.'
      required:
      - email
      properties:
        name:
          type: string
          description: The participant's name.
          example: Leyah Miller
        email:
          type: string
          description: The participant's email address.
          example: leyah@example.com
        is_organizer:
          type: boolean
          description: When `true`, indicates that the participant is the event organizer.
          default: false
          example: true
    group_event:
      type: object
      required:
      - availability
      - event_booking
      - participants
      - when
      properties:
        capacity:
          type: integer
          description: (Not supported for EWS events) The maximum number of attendees allowed in the event.
          minimum: 1
          maximum: 500
          default: 10
          example: 50
        conferencing:
          $ref: '#/components/schemas/event_conferencing_request'
        description:
          type: string
          description: 'A brief description of the group event (for example, its agenda). Nylas might return the

            description as an HTML string, depending on how the provider formats it.


            For Google accounts, this field accepts a maximum of 8,192 characters.'
          example: Come ready to talk philosophy!
        location:
          type: string
          description: 'The location of the group event (for example, a physical address or the name of a meeting

            room).'
          maxLength: 255
          example: New York Public Library, Cave Room
        participants:
          type: array
          items:
            $ref: '#/components/schemas/group_event_participants'
        recurrence:
          $ref: '#/components/schemas/group_event_recurrence'
        reminders:
          type: array
          required:
          - type
          - minutes_before_event
          items:
            type: object
            properties:
              type:
                type: string
                description: The reminder type.
                enum:
                - email
                - webhook
                example: email
              minutes_before_event:
                type: integer
                description: The number of minutes before the event to send the reminder.
                minimum: 1
                example: 30
              recipient:
                type: string
                description: (Email reminders only) Who should receive the reminder.
                enum:
                - host
                - guest
                example: host
              email_subject:
                type: string
                description: (Email reminders only) The subject line of the email reminder.
                example: 'Reminder: Annual Philosophy Club Meeting'
        title:
          type: string
          description: The name of the event.
          maxLength: 1024
          example: Annual Philosophy Club Meeting
        when:
          type: object
          description: The time and duration of the event.
          oneOf:
          - $ref: '#/components/schemas/event_timespan'
          - title: Read-only object
            type: object
            description: Read-only placeholder. Returned only in responses.
            readOnly: true
    group_event_recurrence:
      title: Group event recurrence settings
      type: array
      items:
        type: string
      description: "An array of `RRULE` and `EXDATE` strings. Nylas includes this field only if the event is the main\n(master) event. See [RFC-5545](https://tools.ietf.org/html/rfc5545#section-3.8.5) for more details.\nYou can use [this tool](https://jkbrzt.github.io/rrule/) to learn more about the `RRULE` spec.\n\nEvents inherit their timezone from the `when` object. Nylas recommends that you use the `when`\nobject to specify the event's start and end time.\n\nProvider specifics:\n  - Virtual calendars don't support `DTSTART` or `TZID`.\n  - iCloud accounts do _not_ support recurring events for group events\n  - Microsoft Graph adds one day to the `UNTIL` date."
      example:
      - RRULE:FREQ=WEEKLY;BYDAY=MO
      - EXDATE:20210405T000000Z
  parameters:
    master_event_id:
      name: master_event_id
      in: query
      schema:
        type: string
      description: '(Not supported for iCloud) Filter for instances of recurring events with the specified `master_event_id`.


        `master_event_id` is _not_ respected by metadata filtering.


        When using `master_event_id` to fetch recurring events with a Google grant, the order of the results will not be sorted chronologically.

        Instead, Nylas returns the unchanged occurrences first, followed by the modified occurrences.

        For example, if you have a recurring event with the following occurrences:

        - 2025-01-01

        - 2025-01-02

        - 2025-01-03


        But you modify the time of the second occurrence to 2025-01-02, the results will be:

        - 2025-01-01

        - 2025-01-03

        - 2025-01-02 (modified)'
    metadata_pair:
      name: metadata_pair
      in: query
      required: false
      schema:
        type: string
      description: 'Pass a metadata key/value pair (for example, `?metadata_pair=key1:value`) to search for metadata

        associated with objects. See [Metadata](/docs/reference/api/#metadata) for more information.'
    expand_recurring:
      name: expand_recurring
      in: query
      schema:
        type: boolean
        default: true
      required: false
      deprecated: true
      description: '**This parameter is deprecated. Use the

        [Import Events endpoint](/docs/reference/api/events/import-events/)

        instead**.


        When `true`, Nylas returns all recurring events within the specified time range, including individual

        occurrences of the recurring event. Otherwise, Nylas only returns the parent event and any event

        overrides (individual occurrences that have been edited) in the time range.'
    max_results:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 500
      description: 'Specifies the maximum number of events Nylas returns in a single page of results. The actual number

        of events Nylas returns might be lower than this limit, even if other events match your query

        parameters.'
    ical_uid:
      name: ical_uid
      in: query
      schema:
        type: string
      description: '(Not supported for iCloud) Filter for events with the specified `ical_uid`. You _cannot_ apply other

        filters if you use this parameter.'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
    start:
      name: start
      in: query
      schema:
        type: integer
      description: 'Filter for events that start at or after the specified time, in seconds using the Unix timestamp format. For example, if

        you filter for events that start at 9:00a.m., and the calendar includes an event that runs from

        8:30–9:30a.m., Nylas returns that event.


        Defaults to the time that you make the request.


        The `start` value cannot be later than `end`. For iCloud accounts, the difference between `start`

        and `end` can''t be greater than one year.'
    notify_participants:
      schema:
        type: boolean
        default: true
      in: query
      name: notify_participants
      description: 'Filter for events matching the specified `notify_participants` setting.


        Microsoft and iCloud do _not_ support `notify_participants=false`.'
    end:
      name: end
      in: query
      schema:
        type: integer
      description: 'Filter for events that end at or before the specified time, in seconds using the Unix timestamp format. For example, if

        you filter for events that end at 5:00p.m., and the calendar includes an event that runs from

        4:30–5:30p.m., Nylas returns that event.


        Defaults to one month from the time you make the request.


        The `end` value cannot be earlier than `start`. For iCloud accounts, the difference between `start`

        and `end` can''t be greater than one year.'
    event_type:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        enum:
        - default
        - outOfOffice
        - focusTime
        - workingLocation
      description: '(Google only) Filter for events with the specified event type. You can pass this query parameter

        multiple times to select or exclude multiple event types. For example,

        `event_type=default&event_type=outOfOffice` returns all events that are default or `OOO`, and excludes

        any events that are `focusTime` or that have a `workingLocation`.


        If you don''t specify an event type, Nylas uses `default` to filter for regular events that don''t have

        another specific type.'
    description:
      name: description
      in: query
      required: false
      schema:
        type: string
      description: Filter for events matching the specified description. The filter is case insensitive and will match partial descriptions.
    calendar_id:
      name: calendar_id
      in: query
      required: true
      schema:
        type: string
      description: 'Filter for the specified calendar ID.


        (Not supported for iCloud) You can use `primary` to query the user''s primary calendar.'
    skip_nylas_email:
      name: skip_nylas_email
      in: query
      schema:
        type: boolean
        default: false
      description: When `true`, Nylas does not send the RSVP email to the event organizer.
    updated_after:
      name: updated_after
      in: query
      required: false
      schema:
        type: integer
      description: '(Google, Microsoft, and EWS only) Filter for events that have been updated after the specified time,

        in seconds using the Unix timestamp format.


        `updated_after` is _not_ respected by metadata filtering.'
    updated_before:
      name: updated_before
      in: query
      required: false
      schema:
        type: integer
      description: '(Google, Microsoft, and EWS only) Filter for events that have been updated before the specified time,

        in seconds using the Unix timestamp format.


        `updated_before` is _not_ respected by metadata filtering.'
    show_cancelled:
      name: show_cancelled
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: '(Not supported for iCloud or EWS) If `true`, Nylas includes events whose `status` is `cancelled`.


        Different providers have different semantics for cancelled events:


        - **Google**: An event is considered cancelled after a user deletes it from their calendar, until

        it''s eventually hard-deleted and is no longer readable.

        - **Microsoft**: An event is considered cancelled if the user is invited to an event and the

        organizer deletes it. The cancelled version of the event stays on the participants'' calendars until

        they delete it manually.'
    attendees:
      name: attendees
      in: query
      required: false
      schema:
        type: string
      description: '(Not supported for virtual calendars) Filter for events that include the specified attendees. This

        parameter accepts a comma-delimited list of email addresses.'
    grant_id:
      name: grant_id
      schema:
        type: string
      in: path
      required: true
      description: 'ID of the grant to access. You can also use the email address associated with the grant, or use `/me/`

        to refer to the grant associated with an access token.'
      example: nyla@example.com
    title:
      name: title
      in: query
      required: false
      schema:
        type: string
      description: Filter for events that match the specified title. The filter is case insensitive and will match partial titles.
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    busy:
      name: busy
      in: query
      required: false
      schema:
        type: boolean
      description: (Not supported for iCloud) Filter for events with the specified `busy` status.
    tentative_as_busy:
      name: tentative_as_busy
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: (Microsoft and EWS only) When `true`, Nylas treats tentative events as busy.
    calendar_id_no_validate:
      name: calendar_id
      in: query
      required: true
      schema:
        type: string
      description: 'The calendar ID of the event.


        For Microsoft, we do not validate whether the given calendar ID matches the real calendar ID of the event.

        This is due to a limitation of the Microsoft Graph API.


        (Not supported for iCloud) You can use `primary` to query the user''s primary calendar.'
    field_selection:
      name: select
      in: query
      required: false
      schema:
        type: string
      description: 'Specify fields that you want Nylas to return, as a comma-separated list (for example,

        `select=id,updated_at`). This allows you to receive only the portion of object data that you''re

        interested in. You can use `select` to optimize response size and reduce latency by limiting queries

        to only the information that you need.'
    location:
      name: location
      in: query
      required: false
      schema:
        type: string
      description: Filter for events with the specified location. The filter is case insensitive and will match partial locations.
    start_time:
      name: start_time
      in: query
      required: true
      schema:
        type: integer
      description: 'Filter for events that start at or after the specified time, in seconds using the Unix timestamp format. For example,

        if you filter for events that start at 9:00a.m. and the calendar includes an event that runs from

        8:30–9:30a.m., Nylas returns that event.'
    end_time:
      name: end_time
      in: query
      required: true
      schema:
        type: integer
      description: 'Filter for events that end at or before the specified time, in seconds using the Unix timestamp format. For example,

        if you filter for events that end at 5:00p.m. and the calendar includes an event that runs from

        4:30–5:30p.m., Nylas returns that event.'
  requestBodies:
    event_send_rsvp:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/event_send_rsvp'
    validate_timeslot:
      description: Validate time slot
      content:
        application/json:
          schema:
            type: object
            required:
            - calendar_id
            - start_time
            - end_time
            - event_id
            properties:
              calendar_id:
                type: string
                description: ID of the calendar to access.
                example: primary
              capacity:
                type: number
                description: 'The maximum number of attendees for the event. If not specified, Nylas uses the default

                  capacity for your Configuration.'
                minimum: 1
                maximum: 500
                default: 10
                example: 50
              emails:
                type: array
                items:
                  type: string
                description: A list of email addresses associated with the event's participants.
                example:
                - nyla@example.com
                - leyah@example.com
              event_id:
                type: string
                description: ID of the event to validate.
                example: 5d3qmne77v32r8l4phyuksl2x
              master_id:
                type: string
                description: The master event ID. Required when working with recurring events.
                example: 5d3qmne77v32r8l4phyuksl2x
    import_group_event:
      description: Import group event
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
              - calendar_id
              - event_id
              properties:
                calendar_id:
                  type: string
                  description: The ID of the calendar to access.
                  example: primary
                capacity:
                  type: number
                  description: 'The maximum number of attendees allowed in the event. If not specified, Nylas uses the

                    default capacity for your Configuration.'
                  minimum: 1
                  maximum: 500
                  default: 10
                  example: 50
                event_id:
                  type: string
                  description: ID of the event to import.
                  example: 5d3qmne77v32r8l4phyuksl2x
                exceptions:
                  type: array
                  description: An array of events to create exceptions for.
                  items:
                    type: object
                    properties:
                      capacity:
                        type: number
                        description: 'The maximum number of attendees allowed in the event. You must specify a `capacity`

                          for all events in `exceptions`.'
                        example: 5
                      event_id:
                        type: string
                        description: ID of the to create an exception for.
                        example: 5d3qmne77v32r8l4phyuksl2x
                participants:
                  type: array
                  description: 'An array of participants to include in the event booking. If you don''t specify at least

                    one participant, Nylas uses the event organizer instead.'
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The participant's full name.
                        example: Leyah Miller
                      email:
                        type: string
                        description: The participant's email address.
                        example: leyah@example.com
    group_event_create:
      description: Create a group event
      content:
        application/json:
          schema:
            type: object
            required:
            - calendar_id
            - capacity
            - participants
            - title
            - when
            properties:
              calendar_id:
                type: string
                description: The ID of the calendar to access.
                example: primary
              capacity:
                type: integer
                description: The maximum number of attendees allowed in the event.
                minimum: 1
                maximum: 500
                default: 10
                example: 50
              conferencing:
                type: object
                description: 'An object that lets you automatically create a conference, or enter conferencing details

                  manually.'
                oneOf:
                - $ref: '#/components/schemas/event_conferencing_request'
                - title: Read-only object
                  type: object
                  description: Read-only placeholder. Returned only in responses.
                  readOnly: true
              description:
                type: string
                description: 'A brief description of the group event (for example, its agenda). Nylas might return the

                  description as an HTML string, depending on how the provider formats it.'
                example: Come ready to talk philosophy today!
              location:
                type: string
                description: 'The location of the group event (for example, a physical address or the name of a meeting

                  room).'
                maxLength: 255
                example: New York Public Library, Cave Room
              participants:
                type: object
                description: A list of participants to be included in the group event.
                properties:
                  name:
                    type: string
                    description: The participant's name.
                    example: Leyah Miller
                  email:
                    type: string
                    description: The participant's email address.
                    example: leyah@example.com
                  is_organizer:
                    type: boolean
                    description: When `true`, indicates that the participant is the organizer for the event.
                    example: true
              recurrence:
                $ref: '#/components/schemas/group_event_recurrence'
              title:
                type: string
                description: The name of the group event.
                maxLength: 1024
                example: Annual Philosophy Club Meeting
              when:
                type: object
                description: An object representing the time and duration of the group event.
                oneOf:
                - $ref: '#/components/schemas/event_timespan'
                - title: Read-only object
                  type: object
                  description: Read-only placeholder. Returned only in responses.
                  readOnly: true
    group_event_update:
      description: Update a group event
      content:
        application/json:
          schema:
            type: object
            properties:
              calendar_id:
                type: string
                description: The ID of the calendar to access.
                example: primary
              capacity:
                type: integer
                description: The maximum number of attendees allowed in the event.
                minimum: 1
                maximum: 500
                default: 10
                example: 50
              conferencing:
                type: object
                description: 'An object that lets you automatically create a conference, or enter conferencing details

                  manually.'
                oneOf:
                - $ref: '#/components/schemas/event_conferencing_request'
                - title: Read-only object
                  type: object
                  description: Read-only placeholder. Returned only in responses.
                  readOnly: true
              description:
                type: string
                description: 'A brief description of the group event (for example, its agenda). Nylas might return the

                  description as an HTML string, depending on how the provider formats it.'
                example: Come ready to talk philosophy today!
              location:
                type: string
                description: 'The location of the group event (for example, a physical address or the name of a meeting

                  room).'
                maxLength: 255
                example: New York Public Library, Cave Room
              participants:
                type: object
                description: A list of participants to be included in the group event.
                properties:
                  name:
                    type: string
                    description: The participant's name.
                    example: Leyah Miller
                  email:
                    type: string
                    description: The participant's email address.
                    example: leyah@example.com
                  is_organizer:
                    type: boolean
                    description: When `true`, indicates that the participant is the organizer for the event.
                    example: true
                  recurrence:
                    $ref: '#/components/schemas/group_event_recurrence'
              title:
                type: string
                description: The name of the event.
                maxLength: 1024
                example: Annual Philosophy Club Meeting
              when:
                type: object
                description: An object representing the time and duration of the group event.
                oneOf:
                - $ref: '#/components/schemas/event_timespan'
                - title: Read-only object
                  type: object
                  description: Read-only placeholder. Returned only in responses.
                  readOnly: true
