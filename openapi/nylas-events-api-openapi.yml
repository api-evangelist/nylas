        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nevents = nylas.events.list_import_events(\n    identifier=\"<NYLAS_GRANT_ID>\",\n    query_params={\n        \"calendar_id\": \"<CALENDAR_ID>\",\n        \"start\": 1763119800,\n        \"end\": 1765711800,\n    },\n)\n\nprint(\"Imported events:\", events)\n"
