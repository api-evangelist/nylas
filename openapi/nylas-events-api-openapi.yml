    post:
      summary: Send RSVP
      tags:
      - Events
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.send
          others:
          - https://www.googleapis.com/auth/gmail.compose
          - https://www.googleapis.com/auth/gmail.modify
        microsoft:
          min: https://graph.microsoft.com/Mail.ReadWrite
          others: https://graph.microsoft.com/Mail.ReadWrite.Shared
      operationId: send-rsvp
      description: '(Not supported for iCloud) Sends a response to an event that you''re added to as a participant. You

        can''t directly update events as a participant.


        For most events on EWS, if you decline the event by sending a "no" RSVP response, it''s removed from

        your calendar. If an EWS administrator disabled the option to remove declined events from calendars,

        the event remains on the calendar with the "no" RSVP status.


        Due to a provider limitation, Microsoft Graph might not update the event status properly.


        Google allows the meeting organizer to reply "yes", "maybe", and "no" to event invitations. However,

        other providers do not allow meeting organizers to reply to their own event.


        Nylas sends calendar RSVPs to the event organizer as email updates.

        This can duplicate the RSVP email sent by the calendar provider.

        If you want to stop Nylas from sending the RSVP email,

        you can set the `skip_nylas_email` field to `true` in the query parameters.


        If your application does not implement the

        scopes that allow you to send messages, Nylas updates

        the RSVP for the event and returns a `200` with an error message. Event participants on the same provider

        will see the update, but participants on other providers will not.'
      parameters:
      - $ref: '#/components/parameters/calendar_id'
      - $ref: '#/components/parameters/skip_nylas_email'
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      requestBody:
        $ref: '#/components/requestBodies/event_send_rsvp'
      responses:
        '200':
          $ref: '#/components/responses/events-send_rsvp'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request POST \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/events/<EVENT_ID>/send-rsvp?calendar_id=<CALENDAR_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"status\": \"yes\"\n  }'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function sendEventRSVP() {\n  try {\n    const response = await nylas.events.sendRsvp({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      eventId: \"<EVENT_ID>\",\n      requestBody: {\n        status: \"yes\",\n      },\n      queryParams: {\n        calendarId: \"<CALENDAR_ID>\",\n      },\n    });\n\n    console.log(\"Event RSVP:\", response);\n  } catch (error) {\n    console.error(\"Error sending RSVP:\", error);\n  }\n}\n\nsendEventRSVP();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\nresponse = nylas.events.send_rsvp(\n    identifier=\"<NYLAS_GRANT_ID>\",\n    event_id=\"<EVENT_ID>\",\n    request_body={\"status\": \"yes\"},\n    query_params={\"calendar_id\": \"<CALENDAR_ID>\"},\n)\n\nprint(response)\n"
