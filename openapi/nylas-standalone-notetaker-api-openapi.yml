    get-standalone-notetaker-200:
      description: Success. Returns standalone Notetaker bot.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  $ref: '#/components/schemas/standalone_notetaker'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
                  provider_error:
                    type: object
                    description: The raw error from the provider, if available
                    properties:
                      code:
                        type: string
                      message:
                        type: string
          examples:
            Not Found:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: not_found_error
                  message: requested object not found
                  provider_error:
                    code: MailboxNotEnabledForRESTAPI
                    message: The mailbox is either inactive, soft-deleted, or is hosted on-premise.
    delete-notetaker-200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id:
                type: string
                description: The ID of the request.
                example: 5fa64c92-e840-4357-86b9-2aa364d35b88
    leave-meeting-202:
      description: Accepted
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The Notetaker ID.
                    message:
                      type: string
                      description: A message describing the API response.
          example:
            request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
            data:
              id: AAAA-BBBB-1111-2222
              message: Notetaker is already leaving meeting.
  parameters:
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    notetaker_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - scheduled
        - connecting
        - waiting_for_entry
        - failed_entry
        - attending
        - media_processing
        - media_available
        - media_error
        - media_deleted
      description: Filter for Notetaker bots with the specified meeting state.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
    notetaker_order_by:
      name: order_by
      in: query
      required: false
      schema:
        type: string
        enum:
        - name
        - join_time
        - created_at
        default: created_at
      description: The field to order the Notetaker bots by.
    notetaker_order_direction:
      name: order_direction
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
      description: The direction to order the Notetaker bots by.
    prev_page_token:
      name: prev_page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `prev_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    join_time_end:
      name: join_time_end
      in: query
      required: false
      schema:
        type: number
      description: 'Filter for Notetaker bots that have join times that end at or are before a specific time, in Unix

        timestamp format.'
    join_time_start:
      name: join_time_start
      in: query
      required: false
      schema:
        type: number
      description: 'Filter for Notetaker bots that have join times that start at or after a specific time, in Unix

        timestamp format.'
  requestBodies:
    patch-notetaker:
      content:
        application/json:
          schema:
            type: object
            properties:
              join_time:
                type: integer
                description: 'When Notetaker should join the meeting, in seconds using the Unix timestamp format. If empty, Notetaker joins the

                  meeting immediately.


                  If you provide a time that''s in the past, Nylas returns an error.'
                example: 1732657774
              meeting_settings:
                $ref: '#/components/schemas/meeting_settings'
              name:
                type: string
                description: The display name for the Notetaker bot.
                default: Nylas Notetaker
                example: Nylas Notetaker
    notetakers:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/notetakers'
  securitySchemes:
    ACCESS_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_ACCESS_TOKEN
      description: 'The Nylas **access token** for a specific grant. Issued as part of OAuth 2.1 flow token

        exchange.'
    NYLAS_API_KEY:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_API_KEY
      description: 'The Nylas **API key** provides application-level access to APIs and all grants. You can

        generate these from the Dashboard. Learn more about [authorizing requests](/docs/v3/auth/).'
    SCHEDULER_SESSION_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: Session ID
      description: The Nylas Scheduler **session ID** that Scheduler UI Components use to authorize API requests.
