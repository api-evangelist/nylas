components:
  parameters:
    notetaker_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - scheduled
        - connecting
        - waiting_for_entry
        - failed_entry
        - attending
        - media_processing
        - media_available
        - media_error
        - media_deleted
      description: Filter for Notetaker bots with the specified meeting state.
    notetaker_order_by:
      name: order_by
      in: query
      required: false
      schema:
        type: string
        enum:
        - name
        - join_time
        - created_at
        default: created_at
      description: The field to order the Notetaker bots by.
    join_time_start:
      name: join_time_start
      in: query
      required: false
