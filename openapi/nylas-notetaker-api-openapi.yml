  /v3/grants/{grant_id}/notetakers/{notetaker_id}:
    parameters:
    - $ref: '#/components/parameters/grant_id'
    - schema:
        type: string
      name: notetaker_id
      in: path
      required: true
      description: ID of the Notetaker bot to access.
      example: 71c807752c744ad0902f64d43e6cc399
    get:
      summary: Return a Notetaker
      tags:
      - Notetaker
      operationId: get-notetaker
      description: Returns the specified Notetaker bot and its details.
      x-scopes:
        google:
          min: ''
        microsoft:
          min: ''
        yahoo:
          min: ''
      security:
      - NYLAS_API_KEY: []
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url \"https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/notetakers/<NOTETAKER_ID>\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function findNotetaker() {\n  try {\n    const notetaker = await nylas.notetakers.find({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      notetakerId: \"<NOTETAKER_ID>\",\n    });\n\n    console.log(\"Notetaker:\", notetaker);\n  } catch (error) {\n    console.error(\"Error finding notetaker:\", error);\n  }\n}\n\nfindNotetaker();\n"
