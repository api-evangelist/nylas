    messages-clean:
      description: Clean message response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  type: array
                  items:
                    allOf:
                    - $ref: '#/components/schemas/message'
                    - properties:
                        conversation:
                          type: string
                          description: 'The cleaned message body. If `html_as_markdown` is `true`, the text is

                            Markdown-formatted. Otherwise, Nylas returns plain text.'
                          example: Hello, I just sent a message using Nylas!
          example:
            request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
            data:
            - body: '<div dir="ltr"><div>Hello, I just sent a message using Nylas! <br></div><img src="cid:ii_ltppe5ph0" alt="Nylas-Logo-Stacked-Blue_.png" width="540" height="464"><br><div dir="ltr" class="gmail_signature" data-smartmail="gmail_signature"><div dir="ltr"></div></div></div>

                '
              cc:
              - name: Arya Stark
                email: arya.stark@example.com
              date: 1635355739
