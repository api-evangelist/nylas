openapi: 3.2.0
info:
  title: Nylas Messages API
  version: v3
  summary: The complete Nylas v3 API — Email, Calendar, Contacts, Notetaker, Scheduling, Administration, and Migration.
  description: The Nylas API is designed using the REST ideology to provide simple and predictable URIs to access and modify objects.
  contact:
    url: https://www.nylas.com/
  x-provenance:
    method: harvested
    first_party: true
    publisher: Nylas
    source: https://developer.nylas.com/_spec-files/nylas-api.yaml
    harvested: '2026-08-21'
    sha256: 7ff001d571e163b1ffe22178741b59f813d8208ec878157a839a33dc2c13fd35
    bytes: 1666223
    note: 'Published by Nylas as the unified contract for the Nylas v3 API and stored verbatim; API Evangelist added only this provenance block. Submitted by the provider in api-evangelist/nylas#1 and verified against the live URL before harvest: OpenAPI 3.1.0, 118 paths, 208 operations, 174 component schemas, 100% of operations carrying summary, description, tag and a unique operationId, x-code-samples on 208 of 208. This document REPLACES a 22-operation scaffold API Evangelist derived from reading the documentation, now quarantined under openapi/_scaffold/.'
  x-evidence:
  - url: https://developer.nylas.com/_spec-files/nylas-api.yaml
    what: the published unified contract, harvested verbatim 2026-08-21 (200, text/yaml, 1,666,223 bytes)
  - url: https://developer.nylas.com/.well-known/api-catalog
    what: RFC 9727 linkset advertising that URL as service-desc for api.us.nylas.com and api.eu.nylas.com (200, application/linkset+json)
servers:
- url: https://api.us.nylas.com
  description: U.S.
- url: https://api.eu.nylas.com
  description: E.U.
security:
- ACCESS_TOKEN: []
- NYLAS_API_KEY: []
tags:
- name: Messages
  description: The Nylas Send API allows you to send messages immediately, and schedule them to be sent in the future (asynchronously).
paths:
  /v3/grants/{grant_id}/messages:
    parameters:
    - schema:
        type: string
      name: grant_id
      in: path
      required: true
      description: 'ID of the grant to access. You can also use the email address associated with the grant, or

        use `/me/` to refer to the grant associated with an access token.'
      example: nyla@example.com
    get:
      summary: Return all Messages
      tags:
      - Messages
      operationId: get-messages
      description: 'Returns all messages using standard pagination.


        ⚠️ Your users receive a large number of messages. If you encounter

        429 errors or provider

        rate limits when listing messages, Nylas

        recommends you set the limit parameter to 20 and add

        query parameters to your request to

        limit the results.'
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.readonly
          others: https://www.googleapis.com/auth/gmail.modify
        microsoft:
          min: https://graph.microsoft.com/Mail.Read
          others:
          - https://graph.microsoft.com/Mail.ReadWrite
          - https://graph.microsoft.com/Mail.Read.Shared
          - https://graph.microsoft.com/Mail.ReadWrite.Shared
        yahoo:
          min: email, mail-r
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - name: any_email
        schema:
          type: string
        in: query
        description: 'Return messages that were sent to or received from this comma-separated list of email addresses

          (for example, `leyah@example.com,nyla@example.com`). Nylas returns messages that contain one

          of the specified email addresses in the To, From, CC, or BCC fields. You can specify up to 25

          email addresses per request.'
      - name: bcc
        schema:
          type: string
        in: query
        description: 'Return messages that include the specified email address in the BCC list. Because most SMTP

          gateways remove BCC information, Nylas usually returns messages sent from the current grant.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: cc
        schema:
          type: string
        in: query
        description: 'Return messages that include the specified email address in the CC list.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: fields
        schema:
          type: string
          enum:
          - standard
          - include_headers
          - include_basic_headers
          - include_tracking_options
          - raw_mime
          x-enumDescriptions:
            standard: Returns the standard message payload.
            include_headers: Returns messages and their full set of headers.
            include_basic_headers: Returns messages with only `Message-ID`, `In-Reply-To`, and `References` in the `headers` array.
            include_tracking_options: Returns messages and their tracking settings.
            raw_mime: Returns `grant_id`, `object`, `id`, and `raw_mime` fields for each message.
          default: standard
        in: query
        description: "Return the specified data for each message.\n\n- `standard`: Returns the standard message payload.\n- `include_headers`: Returns messages and their full set of headers.\n- `include_basic_headers`: Returns messages with only the three RFC threading headers\n  (`Message-ID`, `In-Reply-To`, `References`) in the `headers` array. Use this option when you\n  only need to track message identity and thread relationships — payload size is significantly\n  smaller than `include_headers`.\n- `include_tracking_options`: Returns messages and their [tracking settings](/docs/v3/email/message-tracking/).\n- `raw_mime`: Returns the `grant_id`, `object`, `id`, and `raw_mime` fields for each message."
      - name: from
        schema:
          type: string
        in: query
        description: 'Return messages sent from the specified email address. If you want to filter for messages sent

          from the current grant, use the `in` query parameter and specify the Sent folder instead.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: has_attachment
        schema:
          type: boolean
        in: query
        description: When `true`, Nylas returns messages that include attachments.
      - name: in
        schema:
          type: string
        in: query
        description: 'Return messages in the specified folder or label, by folder ID.

          Required when using `shared_from` or `query_imap`.'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/metadata_pair'
      - $ref: '#/components/parameters/page_token'
      - $ref: '#/components/parameters/query_imap_list'
      - name: received_after
        schema:
          type: integer
        in: query
        description: Return messages received after the specified time, in seconds using the Unix timestamp format.
      - name: received_before
        schema:
          type: integer
        in: query
        description: Return messages received before the specified time, in seconds using the Unix timestamp format.
      - name: search_query_native
        schema:
          type: string
        in: query
        description: 'Specify a URL-encoded search query. Connected providers use their provider-specific syntax,

          while Nylas Agent Accounts use Nylas full-text search syntax. The query parameters that you can

          use alongside `search_query_native` depend on the provider:


          - **Google**: `in`, `limit`, and `page_token`

          - **Microsoft**: `in`, `limit`, and `page_token`

          - **IMAP/Yahoo/iCloud**: Any parameter

          - **EWS**: Any parameter _except_ `thread_id`

          - **Nylas Agent Accounts**: Any other parameter supported for Agent Accounts by this endpoint


          Required when using `shared_from`.


          For an overview of searching messages and threads with `search_query_native` across providers,

          see [Searching with Nylas](/docs/dev-guide/best-practices/search/#search-messages-and-threads-using-search_query_native).

          If you''re using a Nylas Agent Account, see

          [Email search for Agent Accounts](/docs/v3/agent-accounts/email-search/) for the complete Nylas

          search syntax, examples, and limits.'
        examples:
          Agent Account:
            description: Nylas full-text query for messages that contain "charger" or "station".
            value: charger%20OR%20station
          Google:
            description: Google query string for messages with subject "foo" or "bar".
            value: subject%3Afoo%20OR%20subject%3Abar
          Microsoft:
            description: Microsoft Graph query for messages using the `$filter` syntax.
            value: '%24filter%3Dfrom%2FemailAddress%2Faddress%20eq%20%27someuser%40example.com%27'
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/shared_folder_id'
      - $ref: '#/components/parameters/shared_from'
      - name: starred
        schema:
          type: boolean
        in: query
        description: 'When `true`, Nylas returns starred messages.


          EWS only supports starred messages on Microsoft Exchange 2010 or later.'
      - name: subject
        schema:
          type: string
        in: query
        description: 'Return messages with a matching subject. This filter is case-sensitive and returns partial

          matches.'
      - name: thread_id
        schema:
          type: string
        in: query
        description: Return messages in the specified thread.
      - name: to
        schema:
          type: string
        in: query
        description: 'Return messages sent to the specified email address.


          For Microsoft grants, Nylas sometimes doesn''t return messages that satisfy the conditions of

          this query parameter. This is because of a limitation on the provider. Instead, you can use

          the `thread_id` to retrieve a specific conversation.'
      - name: unread
        schema:
          type: boolean
        in: query
        description: When `true`, Nylas returns unread messages.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request GET \\\n  --url \"https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/messages?limit=5\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchRecentEmails() {\n  try {\n    const messages = await nylas.messages.list({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      queryParams: {\n        limit: 5,\n      },\n    });\n\n    console.log(\"Messages:\", messages);\n  } catch (error) {\n    console.error(\"Error fetching emails:\", error);\n  }\n}\n\nfetchRecentEmails();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\n\nmessages = nylas.messages.list(\n  grant_id,\n  query_params={\n    \"limit\": 5\n  }\n)\n\nprint(messages)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nmessages, _ = nylas.messages.list(identifier: \"<NYLAS_GRANT_ID>\")\nmessages.each {|message|\n\tputs \"[#{Time.at(message[:date]).strftime(\"%d/%m/%Y at %H:%M:%S\")}] | \\\n#{message[:id]} | \\\n#{message[:subject]} | \\\n#{message[:folders]}\"\n}\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport java.text.SimpleDateFormat;\n\npublic class ReadEmail {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n    ListResponse<Message> message = nylas.messages().list(\"<NYLAS_GRANT_ID>\");\n\n    for(Message email : message.getData()){\n      String date = new SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss\").\n          format(new java.util.Date((email.getDate() == null ? 1 : 1000L)));\n\n      System.out.println(email.getId() + \"[\" + date + \"] | \" + \n          email.getSubject() + \" | \" +\n          email.getFolders());\n    }\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.*\nimport java.text.SimpleDateFormat\nimport java.util.*\n\nfun dateFormatter(milliseconds: String): String {\n  return SimpleDateFormat(\"dd/MM/yyyy HH:mm:ss\").\n      format(Date(milliseconds.toLong() * 1000)).\n      toString()\n}\n\nfun main(args: Array<String>) {\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val messages : List<Message> = nylas.messages().list(\"<NYLAS_GRANT_ID>\").data\n\n  for(message in messages){\n    println(\"[${message.id}] | \" +\n        \"${message.subject} | \" +\n        \"${message.folders}\")\n  }\n}"
      responses:
        '200':
          $ref: '#/components/responses/messages'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
  /v3/grants/{grant_id}/messages/{message_id}:
    parameters:
    - $ref: '#/components/parameters/grant_id'
    - schema:
        type: string
      name: message_id
      in: path
      required: true
      description: 'ID of the message to access. We recommend you URL-encode this field, or you might receive a

        [`404` error](/docs/api/errors/400-response/) if the ID contains special characters (for example,

        `#`).'
    get:
      summary: Return a Message
      tags:
      - Messages
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.readonly
          others: https://www.googleapis.com/auth/gmail.modify
        microsoft:
          min: https://graph.microsoft.com/Mail.Read
          others:
          - https://graph.microsoft.com/Mail.ReadWrite
          - https://graph.microsoft.com/Mail.Read.Shared
          - https://graph.microsoft.com/Mail.ReadWrite.Shared
        yahoo:
          min: email, mail-r
      responses:
        '200':
          $ref: '#/components/responses/message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: get-messages-id
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - name: fields
        in: query
        description: "Return the specified data for each message.\n\n - `standard`: Returns the standard message payload.\n - `include_headers`: Returns the message and its full set of headers.\n - `include_basic_headers`: Returns the message with only the three RFC threading headers\n   (`Message-ID`, `In-Reply-To`, `References`) in the `headers` array. Use this option when you\n   only need to track message identity and thread relationships — payload size is significantly\n   smaller than `include_headers`.\n - `include_tracking_options`: Returns the message and its [tracking settings](/docs/v3/email/message-tracking/).\n - `raw_mime`: Returns the `grant_id`, `object`, `id`, and `raw_mime` fields for the message."
        schema:
          type: string
          enum:
          - standard
          - include_headers
          - include_basic_headers
          - include_tracking_options
          - raw_mime
          default: standard
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/query_imap_get_by_id'
      - $ref: '#/components/parameters/shared_from'
      description: Returns the specified message.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request GET \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/messages/<MESSAGE_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function fetchMessageById() {\n  try {\n    const message = await nylas.messages.find({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      messageId: \"<MESSAGE_ID>\",\n    });\n\n    console.log(\"message:\", message);\n  } catch (error) {\n    console.error(\"Error fetching message:\", error);\n  }\n}\n\nfetchMessageById();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nmessage_id = \"<MESSAGE_ID>\"\n\nmessage = nylas.messages.find(\n  grant_id,\n  message_id,\n)\n\nprint(message)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\t\n\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nmessage, _ = nylas.messages.find(identifier: \"<NYLAS_GRANT_ID>\", message_id: \"<MESSAGE_ID>\")\n\nputs message"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\n\npublic class ReturnMessage {\n    public static void main(String[] args) throws \n    NylasSdkTimeoutError, NylasApiError {\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        Response<Message> message = \n        nylas.messages().find(\"<NYLAS_GRANT_ID>\", \"<MESSAGE_ID>\");\n        System.out.println(message);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "// Import Nylas packages\nimport com.nylas.NylasClient\n\nfun main(args: Array<String>) {\n\n  // Initialize Nylas client\n  val nylas: NylasClient = NylasClient(\n      apiKey = \"<NYLAS_API_KEY>\"\n  )\n\n  val message = nylas.messages().find( \"<NYLAS_GRANT_ID>\",  \"<MESSAGE_ID>\")\n\n  println(message)\n}"
    put:
      summary: Update message attributes
      tags:
      - Messages
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.modify
          others: ''
        microsoft:
          min: https://graph.microsoft.com/Mail.ReadWrite
          others: https://graph.microsoft.com/Mail.ReadWrite.Shared
        yahoo:
          min: email, mail-r, mail-w
      responses:
        '200':
          $ref: '#/components/responses/message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      operationId: put-messages-id
      description: 'Updates the attributes (folders, stars, read/unread status, and so on) for the specified email

        message.


        When you make a `PUT` request, Nylas replaces all data in the nested object with the information

        included in your request. For more information, see

        Updating objects.'
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - $ref: '#/components/parameters/field_selection'
      - $ref: '#/components/parameters/query_imap_get_by_id'
      - $ref: '#/components/parameters/shared_from'
      requestBody:
        $ref: '#/components/requestBodies/message_update'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request PUT \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/messages/<MESSAGE_ID>' \\\n  --header 'Content-Type: application/json' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --data '{\n    \"folders\": [\"<FOLDER_ID>\"]\n  }'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\nconst identifier = \"<NYLAS_GRANT_ID>\";\nconst folderId = \"<FOLDER_ID>\";\nconst messageId = \"<MESSAGE_ID>\";\n\nconst updateMessageFolder = async () => {\n  try {\n    const updatedMessage = await nylas.messages.update({\n      identifier,\n      messageId,\n      requestBody: {\n        folders: [folderId],\n      },\n    });\n\n    console.log(\"Message updated:\", updatedMessage);\n  } catch (error) {\n    console.error(\"Error updating message folder:\", error);\n  }\n};\n\nupdateMessageFolder();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nfolder_id = \"<FOLDER_ID>\"\nmessage_id = \"<MESSAGE_ID>\"\n\nmessage = nylas.messages.update(\n  grant_id,\n  message_id,\n  request_body={\n    \"folders\": [folder_id]\n  }\n)\n\nprint(message)"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\t\n\nnylas = Nylas::Client.new(\n\tapi_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  unread: true,\n  starred: true\n}\n\nmessage, _ = nylas.messages.update(identifier: \"<NYLAS_GRANT_ID>\", \n                                   message_id: \"<MESSAGE_ID>\", \n                                   request_body: request_body)\n\nputs message\n\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\nimport java.util.List;\n\npublic class UpdateMessage {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    UpdateMessageRequest request = new UpdateMessageRequest.Builder().\n        unread(true).\n        starred(true).\n        build();\n\n    Response<Message> message = nylas.messages().\n        update(\"<NYLAS_GRANT_ID>\", \"<MESSAGE_ID>\", request);\n\n    System.out.println(message);\n  }\n}"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.UpdateMessageRequest\n\nfun main(args: Array<String>) {\n\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n    val request : UpdateMessageRequest =\n        UpdateMessageRequest.Builder().\n        unread(true).\n        starred(true).\n        build()\n\n    val message = nylas.messages().update(\n        \"<NYLAS_GRANT_ID>\",\n        \"<MESSAGE_ID>\", request\n    )\n    print(message)\n}\n"
    delete:
      summary: Delete a message
      tags:
      - Messages
      operationId: delete-message
      description: 'Deletes the specified message. If `hard_delete` is not defined or is `false`, Nylas moves the

        message to the user''s Trash folder.'
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/gmail.modify
          others: https://mail.google.com/
        microsoft:
          min: https://graph.microsoft.com/Mail.ReadWrite
          others: https://graph.microsoft.com/Mail.ReadWrite.Shared
        yahoo:
          min: email, mail-r, mail-w
      security:
      - NYLAS_API_KEY: []
      - ACCESS_TOKEN: []
      parameters:
      - $ref: '#/components/parameters/hard_delete'
      - $ref: '#/components/parameters/shared_from'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request DELETE \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>/messages/<MESSAGE_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function deleteMessage() {\n  try {\n    const result = await nylas.messages.destroy({\n      identifier: \"<NYLAS_GRANT_ID>\",\n      messageId: \"<MESSAGE_ID>\",\n    });\n\n    console.log(\"Result:\", result);\n  } catch (error) {\n    console.error(\"Error deleting message:\", error);\n  }\n}\n\ndeleteMessage();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nmessage_id = \"<MESSAGE_ID>\"\n\nresult = nylas.messages.destroy(\n  grant_id,\n  message_id,\n)\n\nprint(result)"
