  parameters:
    hard_delete:
      name: hard_delete
      in: query
      schema:
        type: boolean
        default: false
      description: 'When `true`, Nylas immediately deletes the specified message instead of sending it to the user''s Trash

        folder. This operation is irreversible.


        To use this query parameter, you need to turn on "Enable hard delete" in the

        [Nylas Dashboard](https://dashboard-v3.nylas.com/?utm_source=docs&utm_content=docs-hard-delete) under

        **Customizations > API**.'
    shared_from:
      name: shared_from
      in: query
      schema:
        type: string
      description: '(Microsoft only) When provided, Nylas returns items that were shared from the specified email address.

        It also accepts grant ID.

        This parameter only accepts single email address or grant ID.

        Check out the [Shared folders](/docs/provider-guides/microsoft/shared-folders) guide for more information.'
    grant_id:
      name: grant_id
      schema:
        type: string
      in: path
      required: true
      description: 'ID of the grant to access. You can also use the email address associated with the grant, or use `/me/`

        to refer to the grant associated with an access token.'
      example: nyla@example.com
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    metadata_pair:
      name: metadata_pair
      in: query
      required: false
      schema:
        type: string
      description: 'Pass a metadata key/value pair (for example, `?metadata_pair=key1:value`) to search for metadata

        associated with objects. See [Metadata](/docs/reference/api/#metadata) for more information.'
    shared_folder_id:
      name: shared_folder_id
      in: query
      schema:
        type: string
      description: '(Microsoft only) When provided, Nylas returns items from the specified shared folder ID.

        Required when using `shared_from`.

        This parameter only accepts a single folder ID.

        Check out the [Shared folders](/docs/provider-guides/microsoft/shared-folders) guide for more information.'
    query_imap_get_by_id:
      name: query_imap
      schema:
        type: boolean
        default: false
      in: query
      required: false
      description: '(IMAP, iCloud, and Yahoo only) When `true`, Nylas queries from the IMAP server directly instead of

        the Nylas database.'
    query_imap_list:
      name: query_imap
      schema:
        type: boolean
        default: false
      in: query
      required: false
      description: '(IMAP, Yahoo, and iCloud only) When `true`, Nylas queries the IMAP server directly instead of the

        Nylas database. You also need to set the `in` query parameter in your request so Nylas knows which

        folder to query.'
    field_selection:
      name: select
      in: query
      required: false
      schema:
        type: string
      description: 'Specify fields that you want Nylas to return, as a comma-separated list (for example,

        `select=id,updated_at`). This allows you to receive only the portion of object data that you''re

        interested in. You can use `select` to optimize response size and reduce latency by limiting queries

        to only the information that you need.'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
    parent_id:
      name: parent_id
      in: query
      schema:
        type: string
      description: (Microsoft and EWS only) Use the ID of a folder to find all child folders it contains.
    include_hidden_folders:
      name: include_hidden_folders
      in: query
      schema:
        type: boolean
        default: false
      description: (Microsoft only) When `true`, Nylas includes hidden folders in its response.
    single_level:
      name: single_level
      schema:
        type: boolean
        default: false
      in: query
      required: false
      description: (Microsoft only) If `true`, retrieves folders from a single-level hierarchy only. If `false`, retrieves folders across a multi-level hierarchy.
  requestBodies:
    message_update:
      content:
        application/json:
          schema:
            title: Message Update payload
            type: object
            properties:
              starred:
                type: boolean
                description: Set to `true` to mark as starred; `false` to mark as not starred.
                example: true
              unread:
                type: boolean
                description: Set to `true` to mark as unread; `false` to mark as read.
                example: true
              folders:
                type: array
                items:
                  type: string
                description: The ID(s) of the folder(s) to apply, overwriting all folders previously associated with the message. Microsoft messages can be in a single folder only. Google allows a single message to appear in multiple folders.
                example:
                - folder-1
                - folder-2
              metadata:
                $ref: '#/components/schemas/metadata'
    message_send:
      content:
        application/json:
          schema:
            type: object
            required:
            - to
            properties:
              attachments:
                type: array
                description: An array of files to be sent with the message.
                items:
                  type: object
                  properties:
                    content:
                      type: string
                      description: 'The Base64-encoded file content. See

                        [Working with email attachments](/docs/v3/email/attachments/#attachment-schemas-and-size-limits)

                        for more information.'
                      example: YXR0YWNoDQoNCi0tLS0tLS0tLS0gRm9yd2FyZGVkIG1lc3NhZ2UgL=
                    content_disposition:
                      type: string
                      description: '(Not supported for Microsoft and EWS) The content disposition of the file. Usually,

                        this is `inline` or `attachment`, followed by the file name.'
                      example: attachment; filename="nylas_logo.png"
                    content_id:
                      type: string
                      description: '(Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the HTML

                        message body. To avoid unexpected behavior in threads, make sure to use unique CIDs

                        across messages of a thread.'
                      example: ce9b9547-9eeb-43b2-ac4e-58768bdf04e4
                    content_type:
                      type: string
                      description: 'The

                        [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types)

                        of the file. This is used by the email client to determine how to display the

                        attachment.'
                      minLength: 1
                      example: image/png
                    filename:
                      type: string
                      description: The file name.
                      minLength: 1
                      example: nylas_logo.png
              bcc:
                type: array
                description: A list of people BCC'd on the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person BCC'd on the message.
                      example: Leyah Miller
                    email:
                      type: string
                      description: The email address of the person BCC'd on the message.
                      example: leyah@example.com
              body:
                type: string
                description: The HTML body of the message.
                example: Looking forward to seeing you!
              cc:
                type: array
                description: A list of people CC'd on the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person CC'd on the message.
                      example: Kaveh
                    email:
                      type: string
                      description: The email address of the person CC'd on the message.
                      example: kaveh@example.com
              custom_headers:
                type: array
                description: An array of custom headers to add to the message.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The header name.
                      example: Email-Campaign
                    value:
                      type: string
                      description: The header value.
                      example: meetings
              from:
                type: array
                description: 'The sender of the message. Accepts a single object in an array. If omitted, Nylas uses the

                  grant''s email address and display name.'
                items:
                  type: object
                  required:
                  - email
                  properties:
                    name:
                      type: string
                      description: The name of the user sending the message.
                      example: Nyla
                    email:
                      type: string
                      description: The email address of the user sending the message.
                      example: nyla@example.com
              is_plaintext:
                type: boolean
                description: When `true`, the message body is sent as plain text and the MIME data doesn't include the HTML version of the message. When `false`, the message body is sent as HTML.
                default: false
              metadata:
                $ref: '#/components/schemas/metadata'
              reply_to:
                type: array
                description: A list of people who should receive replies to the message by default.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person who should receive replies to the message.
                      example: Leyah Miller
                    email:
                      type: string
                      description: The email address of the person who should receive replies to the message.
                      example: leyah@example.com
              reply_to_message_id:
                type: string
                description: 'The ID of the message you''re replying to. For Gmail and Microsoft Graph, this is the

                  message ID on the provider. For IMAP Send, this is the

                  [RFC822](https://datatracker.ietf.org/doc/html/rfc822#section-4.6.1) `Message-ID` header

                  of the message you''re replying to.'
              send_at:
                type: integer
                description: 'The time when Nylas should send the message, in seconds using the Unix timestamp format. This time must be

                  at least one minute in the future from the time you make your request. You can schedule

                  a message to be sent up to 30 days in the future. If the request includes

                  `tracking_options.domain_name`, Nylas validates the hostname when it creates the schedule

                  and revalidates it before delivery.'
              subject:
                type: string
                description: The subject of the message.
                example: 'Reminder: Annual Philosophy Club Meeting'
              template:
                type: object
                description: The [template](/docs/reference/api/application-level-templates/) to use for the message. Can be overriden by the `body` and `subject` fields.
                properties:
                  id:
                    type: string
                    description: The template ID.
                    example: b79c82b2-a51b-4c54-8469-28006a43551a
                  strict:
                    type: boolean
                    description: 'When `true`, Nylas returns an error if the template contains variables that aren''t

                      defined in the `variables` object.'
                    default: true
                    example: true
                  variables:
                    type: object
                    description: 'A set of key/value pairs representing variables to substitute for values in the

                      template.'
                    additionalProperties:
                      type: string
                    example:
                      user:
                        name: Leyah
                        surname: Miller
              to:
                type: array
                description: A list of people that the message will be sent to.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the person the message will be sent to.
                      example: Kim Townsend
                    email:
                      type: string
                      description: The email address of the person the message will be sent to.
                      example: kim@example.com
              tracking_options:
                type: object
                description: Tracking settings for the message. See [Track messages](/docs/v3/email/message-tracking/).
                properties:
                  opens:
                    type: boolean
                    description: 'When `true`, enables

                      [message open tracking](/docs/v3/email/message-tracking/#message-open-tracking) on the

                      message. Nylas generates a

                      [`message.opened` webhook notification](/docs/reference/notifications/#message-opened-notifications)

                      when a participant first opens the message.'
                    default: false
                  thread_replies:
                    type: boolean
                    description: 'When `true`, enables

                      [thread replied tracking](/docs/v3/email/message-tracking/#thread-replied-tracking)

                      on the message. Nylas generates a

                      [`thread.replied` webhook notification](/docs/reference/notifications/#thread-replied-notifications)

                      when a participant replies to the thread.'
                    default: false
                  links:
                    type: boolean
                    description: 'When `true`, enables

                      [link clicked tracking](/docs/v3/email/message-tracking/#link-clicked-tracking) on the

                      message. Nylas generates a

                      [`message.link_clicked` webhook notification](/docs/reference/notifications/#link-clicked-notifications)

                      when a participant clicks a link in the message.'
                    default: false
                  label:
                    type: string
                    description: 'A brief description of the message, why it''s being tracked, or the tracking options

                      enabled.'
                    maxLength: 2048
                  domain_name:
                    $ref: '#/components/schemas/tracking_domain_name'
              use_draft:
                type: boolean
                description: '(Google and Microsoft only) When `true`, Nylas saves the message in the user''s Drafts folder

                  until its `send_at` time. This field can''t be `true` if `send_at` is undefined.'
                default: false
              signature_id:
                type: string
                description: 'The ID of a [signature](/docs/v3/email/signatures/) to append to the message body. Nylas

                  inserts the signature after a line break at the end of the body, including after any quoted

                  text in replies and forwards. Only one signature can be used per message.'
                example: sig_abc123
        multipart/form-data:
          schema:
            type: object
            properties:
              attachment:
                type: string
                description: The content of the attachment (if available), in binary format.
                format: binary
              message:
                type: object
                required:
                - to
                properties:
                  bcc:
                    type: array
                    description: A list of people BCC'd on the message.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the person BCC'd on the message.
                          example: Leyah Miller
                        email:
                          type: string
                          description: The email address of the person BCC'd on the message.
                          example: leyah@example.com
                  body:
                    type: string
                    description: The HTML body of the message.
                    example: Looking forward to seeing you!
                  cc:
                    type: array
                    description: A list of people CC'd on the message.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the person CC'd on the message.
                          example: Kaveh
                        email:
                          type: string
                          description: The email address of the person CC'd on the message.
                          example: kaveh@example.com
                  custom_headers:
                    type: array
                    description: An array of custom headers to add to the message.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The header name.
                          example: Email-Campaign
                        value:
                          type: string
                          description: The header value.
                          example: meetings
                  from:
                    type: array
                    description: 'The sender of the message. Accepts a single object in an array. If omitted, Nylas uses

                      the grant''s email address and display name.'
                    items:
                      type: object
                      required:
                      - email
                      properties:
                        name:
                          type: string
                          description: The name of the user sending the message.
                          example: Nyla
                        email:
                          type: string
                          description: The email address of the user sending the message.
                          example: nyla@example.com
                  is_plaintext:
                    type: boolean
                    description: When `true`, the message body is sent as plain text and the MIME data doesn't include the HTML version of the message. When `false`, the message body is sent as HTML.
                    default: false
                  reply_to:
                    type: array
                    description: A list of people who should receive replies to the message by default.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the person who should receive replies to the message.
                          example: Leyah Miller
                        email:
                          type: string
                          description: The email address of the person who should receive replies to the message.
                          example: leyah@example.com
                  send_at:
                    type: integer
                    description: 'The time when Nylas should send the message, in seconds using the Unix timestamp format.

                      Must be at least one minute in the future from the time you make your request. You can

                      schedule a message to be sent up to 30 days in the future. If the request includes

                      `tracking_options.domain_name`, Nylas validates the hostname when it creates the schedule

                      and revalidates it before delivery.'
                  subject:
                    type: string
                    description: The subject of the message.
                    example: 'Reminder: Annual Philosophy Club Meeting'
                  template:
                    type: object
                    description: The [template](/docs/reference/api/application-level-templates/) to use for the message. Can be overriden by the `body` and `subject` fields.
                    properties:
                      id:
                        type: string
                        description: The template ID.
                        example: b79c82b2-a51b-4c54-8469-28006a43551a
                      strict:
                        type: boolean
                        description: 'When `true`, Nylas returns an error if the template contains variables that aren''t

                          defined in the `variables` object.'
                        default: true
                        example: true
                      variables:
                        type: object
                        description: 'A set of key/value pairs representing variables to substitute for values in the

                          template.'
                        additionalProperties:
                          type: string
                        example:
                          user:
                            name: Leyah
                            surname: Miller
                  to:
                    type: array
                    description: A list of people that the message will be sent to.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the person the message will be sent to.
                          example: Kim Townsend
                        email:
                          type: string
                          description: The email address of the person the message will be sent to.
                          example: kim@example.com
                  tracking_options:
                    type: object
                    description: Tracking settings for the message. See [Track messages](/docs/v3/email/message-tracking/).
                    properties:
                      opens:
                        type: boolean
                        description: 'When `true`, enables

                          [message open tracking](/docs/v3/email/message-tracking/#message-open-tracking) on the

                          message. Nylas generates a

                          [`message.opened` webhook notification](/docs/reference/notifications/#message-opened-notifications)

                          when a participant first opens the message.'
                        default: false
                      thread_replies:
                        type: boolean
                        description: 'When `true`, enables

                          [thread replied tracking](/docs/v3/email/message-tracking/#thread-replied-tracking)

                          on the message. Nylas generates a

                          [`thread.replied` webhook notification](/docs/reference/notifications/#thread-replied-notifications)

                          when a participant replies to the thread.'
                        default: false
                      links:
                        type: boolean
                        description: 'When `true`, enables

                          [link clicked tracking](/docs/v3/email/message-tracking/#link-clicked-tracking) on the

                          message. Nylas generates a

                          [`message.link_clicked` webhook notification](/docs/reference/notifications/#link-clicked-notifications)

                          when a participant clicks a link in the message.'
                        default: false
                      label:
                        type: string
                        description: 'A brief description of the message, why it''s being tracked, or the tracking options

                          enabled.'
                        maxLength: 2048
                      domain_name:
                        $ref: '#/components/schemas/tracking_domain_name'
                  use_draft:
                    type: boolean
                    description: '(Google and Microsoft only) When `true`, Nylas saves the message in the user''s Drafts folder

                      until its `send_at` time. This field can''t be `true` if `send_at` is undefined.'
                    default: false
                  signature_id:
                    type: string
                    description: 'The ID of a [signature](/docs/v3/email/signatures/) to append to the message body. Nylas

                      inserts the signature after a line break at the end of the body, including after any quoted

                      text in replies and forwards. Only one signature can be used per message.'
                    example: sig_abc123
          encoding:
            attachment:
              contentType: application/octet-stream
            message:
              contentType: application/json
    messages-clean:
      content:
        application/json:
          schema:
            type: object
            properties:
              message_id:
                type: array
                items:
                  type: string
                description: An array of IDs for the messages Nylas will clean.
                example:
                - 18df98cadcc8534a
                maxItems: 20
              ignore_links:
                type: boolean
                description: If `true`, removes link-related tags (`<a>`) from the message while keeping the text.
                example: true
                default: true
              ignore_images:
                type: boolean
                description: If `true`, removes images from the message.
                example: true
                default: true
              images_as_markdown:
                type: boolean
                description: 'If `true`, converts images in the message to

                  [Markdown](https://en.wikipedia.org/wiki/Markdown). Can''t be `false` when `html_as_markdown`

                  is `true`.'
                example: true
                default: true
              ignore_tables:
                type: boolean
                description: 'If `true`, removes table-related tags (`<table>`, `<th>`, `<td>`, `<tr>`) from the message

                  while keeping rows.'
                example: true
                default: true
              remove_conclusion_phrases:
                type: boolean
                description: If `true`, removes phrases such as "Best" and "Regards" from the message signature.
                example: true
                default: true
              html_as_markdown:
                type: boolean
                description: '**This property is in beta**. If `true`, converts the message to

                  [Markdown](https://en.wikipedia.org/wiki/Markdown). Can''t be `true` when

                  `images_as_markdown` is `false`.'
                example: false
                default: false
    folder_update:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_folder'
          examples:
            Google Folder:
              value:
                name: Invoices
                text_color: '#fff'
                background_color: '#00FF00'
            Microsoft Folder:
              value:
                name: Invoices
                parent_id: AAMkADk0ZWVhMzJhLWY1ODktNDRhZi1hNDcyLWJkMDRlYmE0MTc3ZAAuAAAAAAC6eJwD9EoFS4TLH1YcoDjXAQDIFSkx-42TT5zffjtLuf8AAAAAAAEIAAA=
    folder_create:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_folder'
          examples:
            Google Folder:
              value:
                name: Invoices
                text_color: '#fff'
                background_color: '#00FF00'
            Microsoft Folder:
              value:
                name: Invoices
                parent_id: AAMkADk0ZWVhMzJhLWY1ODktNDRhZi1hNDcyLWJkMDRlYmE0MTc3ZAAuAAAAAAC6eJwD9EoFS4TLH1YcoDjXAQDIFSkx-42TT5zffjtLuf8AAAAAAAEIAAA=
    signature_create:
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - body
            properties:
              name:
                type: string
                description: A label for the signature (for example, "Work", "Personal", or "Mobile").
                example: Work Signature
              body:
                type: string
                description: 'The HTML content of the signature. Maximum 100 KB. Images must use externally hosted URLs

                  (base64 inline images are not supported). Nylas sanitizes the HTML on input to prevent

                  malicious content.'
                example: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p><p><a href="mailto:nick@nylas.com">nick@nylas.com</a></p></div>
          example:
            name: Work Signature
            body: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p><p><a href="mailto:nick@nylas.com">nick@nylas.com</a></p></div>
    signature_update:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Updated label for the signature.
                example: Updated Work Signature
              body:
                type: string
                description: 'Updated HTML content for the signature. Maximum 100 KB. Images must use externally hosted

                  URLs (base64 inline images are not supported). Nylas sanitizes the HTML on input to prevent

                  malicious content.'
                example: <div><p><strong>Nick Barraclough</strong></p><p>Senior Product Manager | Nylas</p></div>
          example:
            name: Updated Work Signature
            body: <div><p><strong>Nick Barraclough</strong></p><p>Senior Product Manager | Nylas</p></div>
