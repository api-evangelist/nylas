        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\nfolder_id = \"<FOLDER_ID>\"\nattachment_id = \"<ATTACHMENT_ID>\"\n\nattachment = nylas.attachments.find(\n  grant_id,\n  attachment_id,\n  query_params= {\n    \"message_id\": \"<MESSAGE_ID>\",\n  }\n)\n\nprint(attachment)"
