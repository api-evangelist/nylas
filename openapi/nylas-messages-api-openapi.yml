        use_draft:
          $ref: '#/components/schemas/use_draft'
    common_response_with_cursor:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
        next_cursor:
          type:
          - string
          - 'null'
          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    use_draft:
      type: boolean
      description: '(Google and Microsoft only) If `true` when scheduling a message, Nylas saves the message in the user''s

        Drafts folder until it''s sent. For more information, see

        [Schedule messages to send in the future](/docs/v3/email/scheduled-send/).'
      default: false
      example: false
    message-participant-response:
      title: Message participant response
      type: object
      description: A name/email address pair.
      properties:
        name:
          type: string
          example: Jon Snow
        email:
          type: string
          format: email
          example: jon.snow@example.com
    metadata:
      title: Metadata
      type: object
      description: 'The metadata associated with the object. For more information, see

        [Metadata](/docs/reference/api/#metadata).'
      additionalProperties:
        type: string
        description: A key-value pair.
        maxLength: 500
      maxProperties: 50
    message-participant:
      title: Message participant
      type: object
      description: A name/email address pair.
      properties:
        name:
          type: string
          example: Jon Snow
        email:
          type: string
          format: email
          example: jon.snow@example.com
      required:
      - email
    tracking_domain_name:
      type: string
      minLength: 1
      maxLength: 253
      example: tracking.example.com
      description: 'The custom hostname to use for link click and message open tracking. The hostname must be

        registered to the authenticated organization in the

        [Nylas Dashboard](https://dashboard-v3.nylas.com/organization/domains?tab=hosted-auth) and have an

        active certificate.


        Custom tracking hostnames are available on select plans. Contact your Nylas account representative

        or the [Nylas Sales team](https://www.nylas.com/contact-sales/) to enable this feature for your

        organization.


        Nylas trims surrounding whitespace, removes one trailing dot, and converts ASCII letters to

        lowercase before looking up the hostname. Provide an ASCII fully qualified hostname without a URL

        scheme, path, port, or wildcard.


        You must enable `links`, `opens`, or both when you provide this field. A custom tracking hostname

        does not support `thread_replies` by itself. If you omit this field, Nylas uses its regional

        tracking hostname. Invalid, inactive, blocked, deleted, and unowned hostnames return the same

        generic `400` response. If Nylas cannot complete the explicit ownership and certificate lookup, it

        returns a `5xx` response without falling back to a Nylas hostname.'
    grant_id:
      title: Grant ID
      type: string
      description: The ID of grant for the connected user.
      example: 41009df5-bf11-4c97-aa18-b285b5f2e386
      readOnly: true
    update_folder:
      title: update_folder
      type: object
      properties:
        name:
          type: string
          description: The name of the folder to be updated.
        parent_id:
          type: string
          description: (Microsoft and EWS only) The ID of the parent folder.
        text_color:
          type: string
          description: '(Google only) The text color of the folder, in hexadecimal format (for example, `#0099EE`). See

            [Google''s reference documentation](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color)

            for a list of accepted values.'
        background_color:
          type: string
          description: '(Google only) The background color of the folder, in hexadecimal format (for example, `#0099EE`).

            See

            [Google''s reference documentation](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color)

            for a list of accepted values.'
    create_folder:
      title: create_folder
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 1024
          minLength: 1
          description: Creates a folder with the specified display name.
        parent_id:
          type: string
          description: (Microsoft and EWS only) The ID of the parent folder.
        text_color:
          type: string
          description: (Google only) The text color of the folder, in hexadecimal format (for example, `#0099EE`). See the [list of Google-defined values](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color) for more information.
        background_color:
          type: string
          description: (Google only) The background color of the folder, in hexadecimal format (for example, `#0099EE`). See the [list of Google-defined values](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color) for more information.
    object:
      type: string
      description: The type of object.
    folder:
      title: Folder
      type: object
      description: An email folder or label.
      properties:
        background_color:
          type: string
          description: '(Google only) The background color of the folder, in hexadecimal format (for example, `#0099EE`).

            See the

            [list of Google-defined values](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color)

            for more information.'
        child_count:
          type: integer
          description: (Microsoft and EWS only) The number of immediate child folders nested under the specified folder.
          readOnly: true
        grant_id:
          $ref: '#/components/schemas/grant_id'
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
          description: The name of the folder.
          example: Invoices
        object:
          $ref: '#/components/schemas/object'
        parent_id:
          type: string
          description: (Microsoft and EWS only) The ID of the parent folder.
        single_level:
          type: boolean
          description: (Microsoft only) If `true`, retrieves folders from a single-level hierarchy only. If `false`, retrieves folders across a multi-level hierarchy.
        system_folder:
          type: boolean
          description: '(Google only) If `true`, the folder is a standard folder created by Google. If `false`, the folder

            was created by the user.'
          readOnly: true
        text_color:
          type: string
          description: '(Google only) The text color of the folder, in hexadecimal format (for example, `#0099EE`). See

            the

            [list of Google-defined values](https://developers.google.com/gmail/api/reference/rest/v1/users.labels#color)

            for more information.'
        total_count:
          type: integer
          description: The number of items inside the folder.
          readOnly: true
        unread_count:
          type: integer
          description: The number of unread items inside the folder.
          readOnly: true
        attributes:
          type: array
          description: 'An array of attribute descriptors shared by system folders across providers. For example, folders

            that contain sent messages ("Sent Items" on Microsoft, or "SENT" on other providers) have the

            `["\\Sent"]` attribute. For more information, see

            [Common folder attributes](/docs/v3/email/folders/#common-folder-attributes). If a folder does not have one of the standard system folders, Nylas returns the `attributes` array empty.


            You can''t query for folders using attributes, but you _can_ manually filter through folders to

            find any that match the attributes you''re looking for.'
          items:
            type: string
            minItems: 0
    signature:
      title: Signature
      type: object
      properties:
        id:
          type: string
          description: Globally unique identifier for the signature.
          readOnly: true
          example: sig_abc123
        grant_id:
          $ref: '#/components/schemas/grant_id'
        name:
          type: string
          description: A label for the signature (for example, "Work", "Personal", or "Mobile").
          example: Work Signature
        body:
          type: string
          description: The HTML content of the signature. Images must use externally hosted URLs.
          example: <div><p><strong>Nick Barraclough</strong></p><p>Product Manager | Nylas</p></div>
        object:
          type: string
          description: The type of object.
          example: signature
          readOnly: true
        created_at:
          type: integer
          description: Unix timestamp when the signature was created.
          readOnly: true
          example: 1706367600
        updated_at:
          type: integer
          description: Unix timestamp when the signature was last modified.
          readOnly: true
          example: 1706367600
    transactional_send_message:
      type: object
      properties:
        id:
          type: string
          description: The message ID.
          example: 6c45fe5e-0bb6-41b9-9acc-ccb15bfc51eb
        attachments:
          type: array
          description: An array of Attachment objects. For google, linked Google Drive files are not included. For Microsoft, linked One Drive files are not included.
          items:
            $ref: '#/components/schemas/attachment_transactional_send'
          uniqueItems: true
          minItems: 0
          example:
          - content_disposition: attachment
            content_type: text/calendar
            filename: null
            content_id: 4kj2jrcoj9ve5j9yxqz5cuv98
            size: 1708
          - content_disposition: attachment
            content_type: application/ics
            filename: invite.ics
            content_id: 70jcsv367jaiavt4njeu4xswg
            size: 1708
        bcc:
          type: array
          description: 'An array of name/email address pairs that the message was BCC''d to. For received messages, this

            is nearly always empty.'
          items:
            $ref: '#/components/schemas/message-participant'
        body:
          type: string
          description: The body of the message. This field is the same as the `body` field in your request.
          example: Hello, I just sent a message using Nylas!
        cc:
          type: array
          description: An array of name/email address pairs that the message was CC'd to.
          items:
            $ref: '#/components/schemas/message-participant'
        from:
          type: array
          description: A list of name/email address pairs that the message was sent from. For transactional send, this will always be one pair.
          items:
            $ref: '#/components/schemas/message-participant-response'
          uniqueItems: true
        object:
          type: string
          description: The object type of the response (in this case, `message`).
          example: message
        reply_to:
          type: array
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
          description: An array of name/email address pairs that should receive replies to the message.
        snippet:
          type: string
          minLength: 1
          description: 'A short snippet (the first 100 characters, with HTML tags removed) of the message body. This is

            useful for displaying a preview of the message.'
          example: 'You have been invited to the following event. Welcome! WhenThu Oct 28, 2021 7am - 8am Eastern

            Time - Toronto Joining info'
        subject:
          type: string
          description: The subject of the message.
          example: Nylas Send v3 Email
        tracking_options:
          type: object
          description: Tracking options for the message.
          properties:
            opens:
              type: boolean
              description: When `true`, shows that message open tracking is enabled.
              example: true
            links:
              type: boolean
              description: When `true`, shows that link clicked tracking is enabled.
              example: true
            label:
              type: string
              description: A label describing the message tracking purpose.
              maxLength: 2048
              example: Tracking test
        to:
          type: array
          description: An array of name/email address pairs that the message was sent to.
          items:
            $ref: '#/components/schemas/message-participant'
          uniqueItems: true
    attachment_transactional_send:
      description: A file attachment for a transactional email message.
      type: object
      properties:
        content_type:
          type: string
          minLength: 1
          description: 'The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types) of the attachment, used by the email client to determine how to display the attachment. If you don''t provide a type, Nylas infers it from the file name.

            The value of this field is exactly the same as the email attachment''s `Content-Type` header.

            The provider might set additional parameters, such as `name` and `charset`.


            Nylas returns an empty `content_type` field if an attachment file name contains non-ASCII characters (for example, accented characters like `ü`). This is because Google can''t detect its content type.'
          example: image/png; name="pic.png"
        filename:
          type: string
          minLength: 1
          description: The file name of the attachment.
          example: pic.png
        content_id:
          type: string
          description: '(Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the message''s HTML. For

            example, you might see something like `<img src=\"cid:ce9b9547-9eeb-43b2-ac4e-58768bdf04e4\">` in

            the message body.


            Sometimes, the `content_id` value is contained in angle brackets (for example,

            `<ce9b9547-9eeb-43b2-ac4e-58768bdf04e4>`).'
          example: 1234567890
        content_disposition:
          type: string
          description: (Not supported for Microsoft and EWS) The content disposition of the attachment. Usually, this is `inline` or `attachment` followed by the file name (for example, `inline; filename="some-image.jpeg"`).
          example: inline
        is_inline:
          type: boolean
          description: If `true`, indicates that the attachment is an inline file.
          example: true
        size:
          type: integer
          description: The size of the attachment, in bytes.
          example: 13068
    attachment_metadata:
      description: Metadata for a file attached to an email message.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        content_type:
          type: string
          minLength: 1
          description: 'The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types/Common_types) of the attachment, used by the email client to determine how to display the attachment. If you don''t provide a type, Nylas infers it from the file name.

            The value of this field is exactly the same as the email attachment''s `Content-Type` header.

            The provider might set additional parameters, such as `name` and `charset`.


            Nylas returns an empty `content_type` field if an attachment file name contains non-ASCII characters (for example, accented characters like `ü`). This is because Google can''t detect its content type.'
          example: image/png; name="pic.png"
        filename:
          type: string
          minLength: 1
          description: The file name of the attachment.
          example: pic.png
        grant_id:
          $ref: '#/components/schemas/grant_id'
        content_id:
          type: string
          description: '(Inline attachments only) The alphanumeric `cid` from the `<img>` tag in the message''s HTML. For

            example, you might see something like `<img src=\"cid:ce9b9547-9eeb-43b2-ac4e-58768bdf04e4\">` in

            the message body.'
          example: 1234567890
        content_disposition:
          type: string
          description: (Not supported for Microsoft and EWS) The content disposition of the attachment. Usually, this is `inline` or `attachment` followed by the file name (for example, `inline; filename="some-image.jpeg"`).
          example: inline; filename="pic.png"
        is_inline:
          type: boolean
          description: Whether the attachment is inline (embedded in the message body, such as an image).
          example: true
        size:
          type: integer
          description: The size of the attachment, in bytes.
          example: 13068
  responses:
    message:
      description: Message response
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  $ref: '#/components/schemas/message'
          example:
            request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
            data:
              body: Hello, I just sent a message using Nylas!
              cc:
              - name: Arya Stark
                email: arya.stark@example.com
              date: 1635355739
              attachments:
              - content_type: text/calendar
                id: 4kj2jrcoj9ve5j9yxqz5cuv98
                size: 1708
              - content_type: application/ics
                filename: invite.ics
                id: 70jcsv367jaiavt4njeu4xswg
                size: 1708
              folders:
              - 8l6c4d11y1p4dm4fxj52whyr9
              - d9zkcr2tljpu3m4qpj7l2hbr0
              from:
              - name: Daenerys Targaryen
                email: daenerys.t@example.com
              grant_id: 41009df5-bf11-4c97-aa18-b285b5f2e386
              id: 5d3qmne77v32r8l4phyuksl2x
              object: message
              reply_to:
              - name: Daenerys Targaryen
                email: daenerys.t@example.com
              snippet: Hello, I just sent a message using Nylas!
              starred: true
              subject: Hello from Nylas!
              thread_id: 1t8tv3890q4vgmwq6pmdwm8qgsaer
              to:
              - name: Jon Snow
                email: j.snow@example.com
              unread: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
                  provider_error:
                    type: object
                    description: The error from the provider.
          examples:
            Unauthorized:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: unauthorized
                  message: Unauthorized
                  provider_error:
                    code: 401
                    message: Request had invalid authentication credentials. Expected OAuth 2 access token, login cookie or other valid authentication credential.
    200_schedule_id:
      description: Schedule(s) Retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Schedules'
          examples:
            Retrieved two schedules:
              value:
                schedule_id: 8cd56334-6d95-432c-86d1-c5dab0ce98be
                status:
                  code: pending
                  description: schedule send awaiting send at time
    '202':
      description: Email Send Accepted
      content:
        application/json:
          schema:
            type: object
            required:
            - grant_id
            - data
            - request_id
            - schedule_id
            properties:
              grant_id:
                type: string
              request_id:
                type: string
              data:
                $ref: '#/components/schemas/message_send_response'
          examples:
            example1:
              description: Save a scheduled message with an Attachment as a draft
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                schedule_id: 17d0281e-0c25-4ad1-a275-639c74f5f6a4
                send_at: 1671234087
                use_draft: true
                grant_id: your grant_id
                data:
                  subject: Sending Emails with Nylas
                  body: Nylas API v3 Test!
                  from:
                  - name: John Doe
                    email: johnn.doe@example.com
                  to:
                  - name: Jane Doe
                    email: jane.doe@example.com
                  cc:
                  - name: Nylas
                    email: nylas@example.com
                  bcc:
                  - name: Nylas
                    email: nylas@example.com
                  attachments:
                  - content_id: HASKDJhiuahsdjlkhKJAsd=
                    content_type: text/plain
                    content_disposition: inline
                    filename: myfile.txt
            example2:
              description: Send a scheduled message with many recipients
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                schedule_id: 17d0281e-0c25-4ad1-a275-639c74f5f6a4
                send_at: 1671234087
                use_draft: false
                grant_id: your grant_id
                data:
                  subject: Sending Emails with Nylas
                  body: Nylas API v3 Test!
                  from:
                  - name: John Doe
                    email: johnn.doe@example.com
                  to:
                  - name: Jane Doe
                    email: jane.doe@example.com
                  - name: Scott
                    email: scott@example.com
                  - name: Tom
                    email: tom@example.com
                  attachments:
                  - content_id: HASKDJhiuahsdjlkhKJAsd=
                    content_type: text/plain
                    filename: myfile.txt
                    content_disposition: attachment
    200-delete:
      description: Delete Succeeded
      content:
        application/json:
          schema:
            type: object
            required:
            - request_id
            properties:
              request_id:
                type: string
                description: ID of the request.
                example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
    200_messages_send:
