  /v3/grants/{grantId}:
    get:
      parameters:
      - name: grantId
        schema:
          example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
          type: string
        in: path
        required: true
      - name: expose_aliases
        schema:
          type: boolean
          default: false
        in: query
        required: false
        description: 'If set to `true`, the response will include an array of email aliases associated with the grant.

          Applicable only for Google and Microsoft grants. Not set by default.

          For Microsoft, aliases are only available for Microsoft 365 / Exchange Online mailboxes. Free

          Outlook.com (consumer) accounts have no aliases to expose, so the `email_aliases` field is

          omitted from the response entirely.

          Email aliases are only returned for the called API, not stored in the grant object permanently.'
      operationId: get_grant_by_id
      tags:
      - Manage Grants
      summary: Get a grant
      description: 'Gets a grant with the provided ID.


        If the grant''s `grant_status` is `invalid`, the grant has expired and needs to be re-authenticated. See Handling expired grants for best practices on detection and recovery.'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --request GET \\\n  --url 'https://api.us.nylas.com/v3/grants/<NYLAS_GRANT_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\n// Instantiate Nylas SDK\nconst NylasConfig = {\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n};\n\nconst nylas = new Nylas(NylasConfig);\n\n// Define the ID of the grant to find\nconst grantId = \"<NYLAS_GRANT_ID>\";\n\n// Function to find the grant\nasync function findGrant() {\n  try {\n    const grant = await nylas.grants.find({ grantId });\n\n    console.log(\"Grant found:\", grant);\n  } catch (error) {\n    console.error(\"Error finding grant:\", error);\n  }\n}\n\nfindGrant();\n"
      - lang: python
        label: Python SDK
        source: "import sys\nfrom nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\"\n)\n\ngrant_id = \"<NYLAS_GRANT_ID>\"\n\ngrant = nylas.grants.find(\n  grant_id\n)\n\nprint(grant)"
      - lang: ruby
        label: Ruby SDK
        source: "# frozen_string_literal: true\n\n# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: '<NYLAS_API_KEY>'\n)\n\ngrant, _ = nylas.grants.find(grant_id: \"<NYLAS_GRANT_ID>\")\n\nputs grant"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\n\npublic class get_grants {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n    Response<Grant> grant = nylas.grants().find(\"<NYLAS_GRANT_ID>\");\n    \n    System.out.println(grant);\n  }\n}"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\n\nfun main(args: Array<String>) {\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n    val grant = nylas.grants().find(\"<NYLAS_GRANT_ID>\")\n    print(grant)\n}\n"
      security:
      - NYLAS_API_KEY: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: ID of the request
                    example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
                  data:
                    $ref: '#/components/schemas/GrantObject'
          description: Returns Grant object
        '401':
          description: Not Authenticated
          content:
            application/json:
