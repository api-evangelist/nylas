openapi: 3.2.0
info:
  title: Nylas Manage Grants API
  version: v3
  summary: The complete Nylas v3 API — Email, Calendar, Contacts, Notetaker, Scheduling, Administration, and Migration.
  description: The Nylas API is designed using the REST ideology to provide simple and predictable URIs to access and modify objects.
  contact:
    url: https://www.nylas.com/
  x-provenance:
    method: harvested
    first_party: true
    publisher: Nylas
    source: https://developer.nylas.com/_spec-files/nylas-api.yaml
    harvested: '2026-08-21'
    sha256: 7ff001d571e163b1ffe22178741b59f813d8208ec878157a839a33dc2c13fd35
    bytes: 1666223
    note: 'Published by Nylas as the unified contract for the Nylas v3 API and stored verbatim; API Evangelist added only this provenance block. Submitted by the provider in api-evangelist/nylas#1 and verified against the live URL before harvest: OpenAPI 3.1.0, 118 paths, 208 operations, 174 component schemas, 100% of operations carrying summary, description, tag and a unique operationId, x-code-samples on 208 of 208. This document REPLACES a 22-operation scaffold API Evangelist derived from reading the documentation, now quarantined under openapi/_scaffold/.'
  x-evidence:
  - url: https://developer.nylas.com/_spec-files/nylas-api.yaml
    what: the published unified contract, harvested verbatim 2026-08-21 (200, text/yaml, 1,666,223 bytes)
  - url: https://developer.nylas.com/.well-known/api-catalog
    what: RFC 9727 linkset advertising that URL as service-desc for api.us.nylas.com and api.eu.nylas.com (200, application/linkset+json)
servers:
- url: https://api.us.nylas.com
  description: U.S.
- url: https://api.eu.nylas.com
  description: E.U.
security:
- ACCESS_TOKEN: []
- NYLAS_API_KEY: []
tags:
- name: Manage Grants
  description: Grants are the main objects that power Nylas, because they _grant_ your Nylas application specific scopes of access (for example, permission to read email messages) to the user's resources and data on their provider.
paths:
  /v3/connect/custom:
    post:
      summary: Bring Your Own Authentication
      tags:
      - Manage Grants
      operationId: byo_auth
      description: 'Manually creates a grant using the Bring Your Own (BYO) Authentication flow. If you''re handling the

        OAuth flow in your own project or you want to migrate existing users, BYO Auth lets you provide

        the user''s `refresh_token` to create a grant.


        If a user previously authenticated with your Nylas application using the same email address, Nylas

        detects this and re-authenticates their existing grant instead of creating a new one. The API

        response contains the user''s existing `grant_id`.


        ### Supported providers


        Pick the request body variant that matches your provider:


        - **Refresh token** — OAuth providers (`google`, `microsoft`, `yahoo`, `zoom`) using a standard refresh token.

        - **Credential override** — OAuth providers, but using a stored credential record to swap in different client credentials.

        - **Microsoft bulk auth** — Microsoft App Permissions. Requires a connector credential and the admin consent flow.

        - **Google bulk auth** — Google Service Accounts. Requires a connector credential and the Service Account flow.

        - **IMAP** — direct IMAP/SMTP credentials for any IMAP provider.

        - **iCloud** — an iCloud email address plus an Apple app password.

        - **EWS** — on-premises Microsoft Exchange; hosted Exchange should use Microsoft Graph instead.

        - **Virtual calendar** — a Virtual Calendar grant for scheduling without a third-party provider.

        - **Zoom Meetings** — Zoom OAuth. Your OAuth app must include the granular scopes `meeting:write:meeting`, `meeting:update:meeting`, and `meeting:delete:meeting`.

        - **Nylas (Agent Account)** — a fully Nylas-hosted Agent Account email and calendar mailbox on a domain you''ve registered with Nylas.'
      security:
      - NYLAS_API_KEY: []
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Refresh token
                description: Use an OAuth refresh token to create a grant.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's OAuth provider.
                    enum:
                    - google
                    - microsoft
                    - yahoo
                    - zoom
                  settings:
                    description: A list of settings required by the provider, including the `refresh_token`.
                    example:
                      refresh_token: 1//09XpDHQ6hq6PrCgYIARAAGAkSNwF...
                    type: object
                    properties:
                      refresh_token:
                        type: string
                        description: The refresh token associated with the email account.
                        example: 1//09XpDHQ6hq6PrCgYIARAAGAkSNwF...
              - type: object
                title: Credential override
                description: Override the connector's client credentials with a stored credential record.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's OAuth provider.
                    enum:
                    - google
                    - microsoft
                    - yahoo
                    - zoom
                  settings:
                    description: 'A list of settings required by the provider, including the `refresh_token`.


                      If you add the `credential_id` field with the UUID of an existing

                      [credential record](/docs/reference/api/connector-credentials/), Nylas uses the

                      provider''s `client_id` and `client_secret` from the credential record.'
                    example:
                      refresh_token: 1//09XpDHQ6hq6PrCgYIARAAGAkSNwF...
                      credential_id: e280d2fa-86db-4937-81c9-ffbd539872d6
                    type: object
                    properties:
                      refresh_token:
                        type: string
                        description: The refresh token associated with the email account.
                        example: 1//09XpDHQ6hq6PrCgYIARAAGAkSNwF...
                      credential_id:
                        type: string
                        description: 'The UUID of an existing

                          [credential record](/docs/reference/api/connector-credentials/) that Nylas

                          can use to override the default connector settings.'
              - type: object
                title: Microsoft bulk auth
                description: Create a grant via Microsoft admin-consent App Permissions.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's OAuth provider.
                    enum:
                    - microsoft
                  settings:
                    description: 'A list of settings required by Microsoft. This sets the user''s email address and

                      the Nylas `credential_id`.


                      If a grant already exists for the provided email address, Nylas automatically starts

                      the re-authentication process.'
                    example:
                      email_address: user@office365.com
                      credential_id: e280d2fa-86db-4937-81c9-ffbd539872d6
                    type: object
                    properties:
                      email_address:
                        type: string
                        description: The user's email address.
                        example: user@office365.com
                      credential_id:
                        type: string
                        description: 'The ID of an existing `adminconsent` credential that Nylas can use to

                          authenticate Microsoft App Permission grants.'
                        example: e280d2fa-86db-4937-81c9-ffbd539872d6
              - type: object
                title: Google bulk auth
                description: Create a grant via a Google Service Account.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's OAuth provider.
                    enum:
                    - google
                  settings:
                    description: 'A list of settings required by Google. This sets the user''s email address and the

                      Nylas `credential_id`.


                      If a grant already exists for the provided email address, Nylas automatically starts

                      the re-authentication process.'
                    example:
                      email_address: user@gmailworkspace.com
                      credential_id: e280d2fa-86db-4937-81c9-ffbd539872d6
                    type: object
                    properties:
                      email_address:
                        type: string
                        description: The user's email address.
                        example: user@gmailworkspace.com
                      credential_id:
                        type: string
                        description: 'The ID of an existing `serviceaccount` credential that Nylas can use to

                          authenticate Google Service Account grants.'
                        example: e280d2fa-86db-4937-81c9-ffbd539872d6
                      scopes:
                        type: array
                        items:
                          type: string
                        description: A list of scopes for the grant.
                        example:
                        - https://www.googleapis.com/auth/userinfo.email
                        - https://www.googleapis.com/auth/userinfo.profile
                        - https://www.googleapis.com/auth/gmail.readonly
              - type: object
                title: IMAP
                description: Create an IMAP grant using username, password, and server details.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's provider.
                    enum:
                    - imap
                  settings:
                    description: 'A list of settings needed for Nylas to connect to the provider''s IMAP server. If

                      the provider uses a different address or credentials for SMTP (to send email),

                      include that information separately in the SMTP fields.'
                    example:
                      imap_username: <IMAP_USERNAME>
                      imap_password: <IMAP_PASSWORD>
                      imap_host: <IMAP_HOST>
                      imap_port: '993'
                      smtp_host: <SMTP_HOST>
                      smtp_port: '465'
                      smtp_username: <SMTP_USERNAME>
                      smtp_password: <SMTP_PASSWORD>
                    type: object
                    properties:
                      imap_username:
                        type: string
                        description: The user's username or email address.
                        example: nyla@example.com
                      imap_password:
                        type: string
                        description: The user's email account password or app password.
                      imap_host:
                        type: string
                        description: 'The IMAP host. If you don''t define the host in the request payload, Nylas tries

                          to auto-detect the hostname using the provided `imap_username`. If you''re using

                          a self-hosted IMAP server, you _must_ provide the hostname.'
                        example: imap.mail.me.com
                      imap_port:
                        type: integer
                        description: 'The IMAP port number. If you don''t define the port in the request payload, Nylas

                          tries to auto-detect it using the provided `imap_username`. If you''re using a

                          self-hosted IMAP server, you _must_ provide the port number.'
                        example: 993
                      smtp_host:
                        type: string
                        description: 'The SMTP host. If you don''t define the host in the request payload, Nylas tries

                          to auto-detect it using the provided `imap_username`. If you''re using a self-

                          hosted SMTP server, you _must_ provide the hostname.'
                        example: smtp.mail.me.com
                      smtp_port:
                        type: integer
                        description: 'The SMTP port number. If you don''t define the port in the request payload, Nylas

                          tries to auto-detect it using the provided `imap_username`. If you''re using a

                          self-hosted SMTP server, you _must_ provide the port number.'
                        example: 587
                      smtp_username:
                        type: string
                        description: 'The user''s SMTP username, if their SMTP credentials are different from their

                          IMAP credentials.'
                        example: nyla@example.com
                      smtp_password:
                        type: string
                        description: 'The user''s SMTP password, if their SMTP credentials are different from their

                          IMAP credentials.'
              - type: object
                title: iCloud
                description: Create an iCloud grant using an email address and app password.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's provider.
                    enum:
                    - icloud
                  settings:
                    description: A list of settings required by iCloud.
                    example:
                      username: <ICLOUD_USERNAME>
                      password: <ICLOUD_PASSWORD>
                    type: object
                    properties:
                      username:
                        type: string
                        description: The user's iCloud email address.
                        example: example@icloud.com
                      password:
                        type: string
                        description: The user's app password.
              - type: object
                title: EWS
                description: Create a grant for an on-premises Microsoft Exchange account.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's provider.
                    enum:
                    - ews
                  settings:
                    description: A list of settings required by EWS.
                    example:
                      email: nyla@ews.example.com
                      ews_username: <EWS_USERNAME>
                      ews_password: <EWS_PASSWORD>
                      ews_host: <EWS_HOST>
                    type: object
                    properties:
                      email:
                        type: string
                        description: The user's email address.
                        example: nyla@ews.example.com
                      ews_username:
                        type: string
                        description: The user's Exchange username, formatted as an email address.
                        example: nyla@ews.example.com
                      ews_password:
                        type: string
                        description: The user's Microsoft Exchange password.
                      ews_host:
                        type: string
                        description: 'The EWS host. If you don''t define the host in the request payload, Nylas tries

                          to auto-detect it using the provided `ews_username`. If you''re using a self-

                          hosted EWS server, you _must_ provide the hostname.'
                        example: ews.mail.example.com
                      ews_port:
                        type: integer
                        description: The EWS port number.
                        default: 443
                  scope:
                    type: array
                    items:
                      type: string
                    description: A list of scopes for the grant.
                    example:
                    - ews.messages
                    - ews.calendars
                    - ews.contacts
              - type: object
                title: Virtual calendar
                description: Create a Virtual Calendar grant for scheduling without a provider.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The account's provider.
                    enum:
                    - virtual-calendar
                    example: virtual-calendar
                  settings:
                    description: A list of settings required by Nylas.
                    type: object
                    properties:
                      email:
                        type: string
                        description: 'The virtual account identifier. This can be any arbitrary string — it doesn''t

                          have to be in email address format.'
                        example: floor1desk24@example.com
                  state:
                    type: string
                    description: 'An optional state value that Nylas returns to your project when the authentication

                      flow completes. If you include the `state`, Nylas returns the unmodified value to

                      your project. You can use this for verification, or to track information about the

                      account.


                      For more information about the `state` parameter, see the

                      [OAuth 2.0 specification](https://datatracker.ietf.org/doc/html/rfc6749) or the

                      [official OAuth 2.0 documentation](https://www.oauth.com/oauth2-servers/authorization/the-authorization-request/).'
                    example: my-state
              - type: object
                title: Zoom Meetings
                description: Create a Zoom Meetings grant from an OAuth refresh token.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The user's OAuth provider (in this case, `zoom`).
                    enum:
                    - zoom
                  settings:
                    description: A list of settings required by Zoom.
                    type: object
                    properties:
                      refresh_token:
                        type: string
                        description: The `refresh_token` from the Zoom `code` exchange flow.
                        example: <ZOOM_REFRESH_TOKEN>
              - type: object
                title: Nylas (Agent Account)
                description: Create a Nylas-hosted Agent Account on a domain you've registered.
                required:
                - provider
                - settings
                properties:
                  provider:
                    type: string
                    description: The account's provider. Use `nylas` to create an Agent Account.
                    enum:
                    - nylas
                    example: nylas
                  name:
                    type: string
                    description: 'The Agent Account''s display name. Nylas stores this as the grant''s `name` and uses it

                      as the default `From` display name when the account sends email, so a recipient sees

                      `Sales Agent <sales-agent@agents.yourcompany.com>` instead of the bare address. Omit it

                      and the account sends with no display name. You can override the name on an individual

                      message with the `from` field on [send](/docs/reference/api/messages/send-message/).'
                    example: Sales Agent
                  workspace_id:
                    type: string
                    description: 'The ID of the [workspace](/docs/reference/api/workspaces/) to place the Agent Account in.

                      The workspace''s `policy_id` and `rule_ids` govern the account''s limits, spam detection,

                      and mail rules. If omitted, Nylas auto-groups the account into a workspace whose `domain`

                      matches the email address (when `auto_group` is enabled), or places it in the

                      application''s default workspace.'
                    example: abf6ff99-05ad-4c0a-aaf8-400aacf2470a
                  settings:
                    description: The settings required for a Nylas Agent Account.
                    example:
                      email: user@yourdomain.com
                    type: object
                    required:
                    - email
                    properties:
                      email:
                        type: string
                        description: 'The Agent Account''s email address. The email''s domain must match a domain you''ve already

                          [registered with Nylas](/docs/reference/api/manage-domains/).'
                        example: user@yourdomain.com
                      app_password:
                        type: string
                        description: 'Optional password that unlocks IMAP and SMTP-submission access to the Agent Account.

                          Omit it and protocol-level access stays disabled. Must be 18–40 printable ASCII

                          characters (codes 33–126) and contain at least one uppercase letter, one lowercase

                          letter, and one digit. Stored as a bcrypt hash — it can''t be retrieved later, only

                          reset by updating the grant. See [Connect mail clients to an Agent Account](/docs/v3/agent-accounts/mail-clients/).'
                        minLength: 18
                        maxLength: 40
                        example: MySecureP4ssword!2024
      x-code-samples:
      - lang: bash
        label: cURL (Microsoft)
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/custom\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"microsoft\",\n    \"settings\": {\n      \"refresh_token\": \"<REFRESH_TOKEN>\"\n    }\n  }'\n"
      - lang: bash
        label: cURL (Google)
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/custom\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"google\",\n    \"settings\": {\n      \"refresh_token\": \"<GOOGLE_REFRESH_TOKEN>\"\n    }\n  }'\n"
      - lang: bash
        label: cURL (IMAP)
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/custom\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"imap\",\n    \"settings\": {\n      \"imap_username\": \"user@example.com\",\n      \"imap_password\": \"<IMAP_PASSWORD>\",\n      \"imap_host\": \"imap.example.com\",\n      \"imap_port\": 993,\n      \"smtp_host\": \"smtp.example.com\",\n      \"smtp_port\": 587,\n      \"smtp_username\": \"user@example.com\",\n      \"smtp_password\": \"<SMTP_PASSWORD>\"\n    }\n  }'\n"
      - lang: bash
        label: cURL (iCloud)
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/custom\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"icloud\",\n    \"settings\": {\n      \"username\": \"user@icloud.com\",\n      \"password\": \"<ICLOUD_APP_PASSWORD>\"\n    }\n  }'\n"
      - lang: bash
        label: cURL (Virtual Calendar)
        source: "curl --request POST \\\n  --url \"https://api.us.nylas.com/v3/connect/custom\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"virtual-calendar\",\n    \"settings\": {\n      \"email\": \"conference-room-3a@example.com\"\n    }\n  }'\n"
      - lang: bash
        label: cURL (Nylas Agent Account)
        source: "curl --location 'https://api.us.nylas.com/v3/connect/custom' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"provider\": \"nylas\",\n    \"name\": \"Sales Agent\",\n    \"workspace_id\": \"<WORKSPACE_ID>\",\n    \"settings\": {\n        \"email\": \"user@yourdomain.com\"\n    }\n}'\n"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\n// Microsoft (refresh-token) Bring-Your-Own-Auth grant.\nasync function authenticateMicrosoft() {\n  const grant = await nylas.auth.customAuthentication({\n    requestBody: {\n      provider: \"microsoft\",\n      settings: {\n        refreshToken: \"<MICROSOFT_REFRESH_TOKEN>\",\n      },\n      scope: [\"Mail.Read\", \"Mail.Send\"],\n    },\n  });\n\n  return grant;\n}\n\n// Nylas Agent Account grant — provisions a Nylas-hosted mailbox on a domain\n// you've registered with Nylas. No OAuth refresh token required.\nasync function authenticateAgentAccount() {\n  const grant = await nylas.auth.customAuthentication({\n    requestBody: {\n      provider: \"nylas\",\n      name: \"Sales Agent\",\n      settings: {\n        email: \"agent@yourdomain.com\",\n        policyId: \"<POLICY_ID>\",\n      },\n    },\n  });\n\n  return grant;\n}\n\nauthenticateMicrosoft()\n  .then((grant) => console.log(\"Microsoft grant:\", grant))\n  .catch((error) => console.error(\"Microsoft auth error:\", error));\n\nauthenticateAgentAccount()\n  .then((grant) => console.log(\"Agent Account grant:\", grant))\n  .catch((error) => console.error(\"Agent Account auth error:\", error));\n"
      - lang: ruby
        label: Ruby SDK
        source: "require 'nylas'\n\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\",\n)\n\nrequest_body = {\n  provider: '<PROVIDER>',\n  settings: {'username': '<USERNAME>', 'password': '<PASSWORD>'},\n  scope: 'email.read_only,calendar.read_only,contacts.read_only',\n  state: '<STATE>'\n}\n\nauth = nylas.auth.custom_authentication(request_body)\nputs auth\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nrequest_body = {\n    \"provider\": \"icloud\",\n    \"settings\": {\n        \"username\": \"<USERNAME>\",\n        \"password\": \"<PASSWORD>\",\n    },\n    \"scope\": [\"email.read_only\", \"calendar.read_only\", \"contacts.read_only\"],\n    \"state\": \"<STATE>\",\n}\n\ngrant = nylas.auth.custom_authentication(request_body)\nprint(grant)\n"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.*;\n\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\n\npublic class Main {\n    public static void main(String[] args) throws\n            NylasSdkTimeoutError, NylasApiError {\n        NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n        AuthProvider provider = AuthProvider.ICLOUD;\n\n        Map<String, Object> settings = new HashMap<>();\n        settings.put(\"username\", \"<USERNAME>\");\n        settings.put(\"password\", \"<PASSWORD>\");\n\n        List<String> scopes = List.of(\n            \"email.read_only\", \"calendar.read_only\", \"contacts.read_only\");\n\n        CreateGrantRequest requestBody = new CreateGrantRequest.Builder(provider, settings)\n            .state(\"<STATE>\")\n            .scopes(scopes)\n            .build();\n\n        Response<Grant> grant = nylas.auth().customAuthentication(requestBody);\n        System.out.println(grant);\n    }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.*\n\nfun main() {\n    val nylas: NylasClient = NylasClient(\n        apiKey = \"<NYLAS_API_KEY>\"\n    )\n\n    val provider = AuthProvider.ICLOUD\n    val settings = mapOf(\"username\" to \"<USERNAME>\", \"password\" to \"<PASSWORD>\")\n    val scopes = listOf(\"email.read_only\", \"calendar.read_only\", \"contacts.read_only\")\n\n    val requestBody = CreateGrantRequest(provider, settings, \"<STATE>\", scopes)\n    val grant = nylas.auth().customAuthentication(requestBody)\n\n    println(grant)\n}\n"
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: The request ID.
                    example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
                  data:
                    $ref: '#/components/schemas/GrantObject'
          description: Grant Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          description: Not Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
  /v3/grants:
    get:
      summary: Return all grants
      tags:
      - Manage Grants
      operationId: get-all-grants
      description: Returns all grants in your Nylas application.
      security:
      - NYLAS_API_KEY: []
      parameters:
      - name: account_id
        in: query
        schema:
          type: string
        description: 'Returns grants with a matching v2 Nylas account ID. Only applicable for grants migrated from

          Nylas v2.'
      - name: account_ids
        in: query
        schema:
          type: string
        description: 'Returns grants with a matching list of v2 Nylas account IDs. Only applicable for grants migrated

          from Nylas v2.'
