  schemas:
    DomainObject:
      title: Domain
      type: object
      properties:
        id:
          type: string
          description: Globally unique identifier for the domain.
          example: abc-123-domain-id
        name:
          type: string
          description: A human-readable label for the domain.
          example: My transactional domain
        branded:
          type: boolean
          description: If `true`, this is a Nylas-branded `nylas.email` subdomain managed by Nylas. You can only have one free Nylas branded domain per organization and region. If `false`, this is a custom domain.
          example: false
        domain_address:
          type: string
          description: The domain address (for example, `mail.example.com`).
          example: mail.example.com
        organization_id:
          type: string
          description: The ID of the Nylas organization that owns the domain.
          example: org-123
        region:
          type: string
          description: The Nylas data center region where the domain is registered.
          enum:
          - us
          - eu
          example: us
        verified_ownership:
          type: boolean
          description: If `true`, the domain's ownership TXT record has been verified.
          example: true
        verified_dkim:
          type: boolean
          description: If `true`, the domain's DKIM TXT record has been verified.
          example: false
        verified_spf:
          type: boolean
          description: If `true`, the domain's SPF record has been verified.
          example: false
        verified_mx:
          type: boolean
          description: If `true`, the domain's MX record has been verified.
          example: false
        verified_feedback:
          type: boolean
          description: If `true`, the domain's feedback MX record for bounce detection has been verified.
          example: false
        verified_dmarc:
          type: boolean
          description: Currently not verified by Nylas. However, it is highly recommended to set DMARC to your desired value to prevent emails going to spam.
          example: false
        verified_arc:
          type: boolean
          description: Currently not verified by Nylas.
          example: false
        created_at:
          type: number
          description: When the domain was created, in seconds using the Unix timestamp format.
          example: 1742932766
        updated_at:
          type: number
          description: When the domain was last updated, in seconds using the Unix timestamp format.
          example: 1742932766
    DomainVerificationResponse:
      title: DomainVerificationResponse
      type: object
      properties:
        domain_id:
          type: string
          description: The ID of the domain.
          example: abc-123-domain-id
        attempt:
          type: object
          description: Details about the verification attempt.
          properties:
            type:
              type: string
              description: The type of DNS verification.
              enum:
              - ownership
              - mx
              - spf
              - dkim
              - feedback
              example: ownership
            options:
              type: object
              description: The DNS record values to configure at your DNS provider.
              properties:
                host:
                  type: string
                  description: The DNS host value.
                  example: '@'
                type:
                  type: string
                  description: The DNS record type.
                  example: TXT
                value:
                  type: string
                  description: The DNS record value to set.
                  example: nylas-ownership-verify=gNIeZAtY1lPUEpWOhA2XBB...
        status:
          type: string
          description: The status of the verification attempt.
          enum:
          - done
          - failed
          - pending
          example: done
        created_at:
          type: number
          description: When the verification attempt was created, in seconds using the Unix timestamp format.
          example: 1742932766
        expires_at:
          type: number
          description: When the verification attempt expires, in seconds using the Unix timestamp format.
          example: 1743537566
        message:
          type: string
          description: A human-readable message about the verification status.
          example: Domain ownership verified successfully.
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
  securitySchemes:
    ACCESS_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_ACCESS_TOKEN
      description: 'The Nylas **access token** for a specific grant. Issued as part of OAuth 2.1 flow token

        exchange.'
    NYLAS_API_KEY:
      scheme: bearer
      type: http
      bearerFormat: NYLAS_API_KEY
      description: 'The Nylas **API key** provides application-level access to APIs and all grants. You can

        generate these from the Dashboard. Learn more about [authorizing requests](/docs/v3/auth/).'
    SCHEDULER_SESSION_TOKEN:
      scheme: bearer
      type: http
      bearerFormat: Session ID
      description: The Nylas Scheduler **session ID** that Scheduler UI Components use to authorize API requests.
