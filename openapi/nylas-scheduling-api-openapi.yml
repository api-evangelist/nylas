    '429':
      description: Rate Limit
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
          examples:
            Not Found:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: rate_limit_error
                  message: Too many requests, please try again shortly.
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            title: error
            type: object
            properties:
              request_id:
                type: string
                description: The request ID.
              error:
                type: object
                description: The response error object.
                properties:
                  type:
                    type: string
                    description: The error type.
                  message:
                    type: string
                    description: The error message.
                  provider_error:
                    type: object
                    description: The raw error from the provider, if available
                    properties:
                      code:
                        type: string
                      message:
                        type: string
          examples:
            Not Found:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
                error:
                  type: not_found_error
                  message: requested object not found
                  provider_error:
                    code: MailboxNotEnabledForRESTAPI
                    message: The mailbox is either inactive, soft-deleted, or is hosted on-premise.
    booking_create:
      description: Create a new booking
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  $ref: '#/components/schemas/booking'
          example:
            request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
            data:
              booking_id: AAAA-BBBB-1111-2222
              event_id: CCCC-DDDD-3333-4444
              title: My test event
              organizer:
                name: John Doe
                email: user@example.com
              status: booked
              description: This is an example of a description.
    booking_confirm:
      description: Booking confirmed or cancelled
      content:
        application/json:
          schema:
            oneOf:
            - title: Booking confirmed
              type: object
              description: Returned when the booking was confirmed.
              properties:
                request_id:
                  type: string
                  description: The ID of the request.
                  example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
                data:
                  type: object
                  properties:
                    booking_id:
                      type: string
                      description: The unique ID of the booking.
                      example: xxxxxxxx-xxxx-Mxxx-Nxxx-xxxxxxxxxxxx
                    description:
                      type: string
                      description: A brief description of the event.
                      example: Come ready to talk philosophy!
                    event_id:
                      type: string
                      description: The event ID associated with the booking.
                      example: 5d3qmne77v32r8l4phyuksl2x
                    organizer:
                      type: object
                      description: The participant designated as the organizer of the event.
                      properties:
                        email:
                          type: string
                          description: The organizer's email address.
                          example: leyah@example.com
                        name:
                          type: string
                          description: The organizer's name.
                          example: Leyah Miller
                    status:
                      type: string
                      description: The status of the booking.
                      enum:
                      - booked
                      - cancelled
                      - pending
                      example: booked
                    title:
                      type: string
                      description: The title of the event.
                      example: Annual Philosophy Club Meeting
            - title: Booking cancelled
              type: object
              $ref: '#/components/schemas/200-delete'
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id:
                type: string
                description: ID of the request.
          examples:
            OK:
              value:
                request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
    session_delete:
      description: The response to a successful request to delete a scheduling session.
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id:
                type: string
                description: The ID of the request
                example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
    session_create:
      description: Create a new scheduling session
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/common_response'
            - properties:
                data:
                  type: object
                  properties:
                    session_id:
                      type: string
                      description: The ID of the session
          example:
            request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
            data:
              session_id: AAAA-BBBB-1111-2222
  parameters:
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'An identifier that specifies which page of data to return. You can get this value from the

        `next_cursor` response field. See [Pagination](/docs/reference/api/#pagination) for more

        information.'
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
      description: 'The maximum number of objects to return. See [Pagination](/docs/reference/api/#pagination)

        for more information.'
  requestBodies:
    booking_confirm:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/booking_confirm'
          example:
            salt: -zgLLAuk_qtcsw
            status: cancelled
            cancellation_reason: I am no longer available at this time.
    booking_create:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/booking_create'
          example:
            start_time: '1708714800'
            end_time: '1708722000'
            participants:
            - email: user@example.com
            guest:
              name: Guest
              email: guest@example.com
    session_create:
      description: Create a new scheduling session
      content:
        application/json:
          schema:
            type: object
            properties:
              configuration_id:
                type: string
                description: The ID of the Scheduler Configuration object for the session. If you're using `slug`, `configuration_id` is not required.
                example: AAAA-BBBB-1111-2222
              slug:
                type: string
                description: The slug of the Scheduler Configuration object for the session. You can use `slug` instead of `configuration_id`.
                example: my-page-slug
              time_to_live:
                type: number
                description: The time to live for the session in minutes. The maximum value is `30`.
                default: 5
                example: 10
