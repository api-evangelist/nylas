        source: "import com.nylas.NylasClient\nimport com.nylas.models.ConfirmBookingQueryParams\nimport com.nylas.models.ConfirmBookingRequest\nimport com.nylas.models.ConfirmBookingStatus\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val requestBody = ConfirmBookingRequest.Builder()\n      .salt(\"-zgLLAuk_qtcsw\")\n      .status(ConfirmBookingStatus.CANCELLED)\n      .cancellationReason(\"I am no longer available at this time.\")\n      .build()\n\n  val queryParams = ConfirmBookingQueryParams.Builder()\n      .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n      .build()\n\n  val booking = nylas.scheduler().bookings().confirm(\"<BOOKING_ID>\", requestBody, queryParams)\n\n  println(\"Confirmed booking: ${booking.data}\")\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Private)
        source: "import com.nylas.NylasClient\nimport com.nylas.models.ConfirmBookingRequest\nimport com.nylas.models.ConfirmBookingStatus\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build()\n\n  val requestBody = ConfirmBookingRequest.Builder()\n      .salt(\"-zgLLAuk_qtcsw\")\n      .status(ConfirmBookingStatus.CANCELLED)\n      .cancellationReason(\"I am no longer available at this time.\")\n      .build()\n\n  val booking = nylas.scheduler().bookings().confirm(\"<BOOKING_ID>\", requestBody)\n\n  println(\"Confirmed booking: ${booking.data}\")\n}\n"
      responses:
        '200':
          $ref: '#/components/responses/booking_confirm'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      security:
      - SCHEDULER_SESSION_TOKEN: []
    delete:
      summary: Delete a booking
      tags:
      - Scheduling
      x-scopes:
        google:
          min: https://www.googleapis.com/auth/calendar.events
          others: https://www.googleapis.com/auth/calendar
        microsoft:
          min: https://graph.microsoft.com/Calendars.ReadWrite
          others: ''
      operationId: delete-bookings-id
      description: 'Deletes the specified booking. Nylas also cancels the associated event on the provider.


        Nylas validates the provided session ID and uses it to retrieve the related

        [Configuration object](/docs/reference/api/configurations/). If you created a public

        Configuration, you don''t need to include the `Authorization` request header with a session ID, but

        you do need to pass the Configuration object ID as a query parameter.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancellation_reason:
                  type: string
                  description: The reason that the booking is being cancelled.
            example:
              cancellation_reason: I am no longer available at this time.
      x-code-samples:
      - lang: bash
        label: cURL (Public)
        source: "curl --compressed --request DELETE \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>?configuration_id=<SCHEDULER_CONFIG_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json'"
      - lang: bash
        label: cURL (Private)
        source: "curl --compressed --request DELETE \\\n  --url 'https://api.us.nylas.com/v3/scheduling/bookings/<BOOKING_ID>' \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <SCHEDULER_SESSION_ID>' \\\n  --header 'Content-Type: application/json'"
      - lang: python
        label: Python SDK (Private)
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nresponse = nylas.scheduler.bookings.destroy(\n    booking_id=\"<BOOKING_ID>\",\n    request_body={\n        \"cancellation_reason\": \"Plans changed.\",\n    },\n    query_params={\n        \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n    },\n)\n\nprint(\"Booking cancelled:\", response)\n"
      - lang: ruby
        label: Ruby SDK (Public)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nbooking, _request_ids = nylas.scheduler.bookings.destroy(booking_id: \"<BOOKING_ID>\", query_params: {\"configuration_id\": \"<CONFIGURATION_ID>\"})\n\nputs booking"
      - lang: ruby
        label: Ruby SDK (Private)
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<SCHEDULER_SESSION_ID>\"\n)\n\nbooking, _request_ids = nylas.scheduler.bookings.destroy(booking_id: \"<BOOKING_ID>\")\n\nputs booking"
      - lang: java
        label: Java SDK (Public)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.DeleteResponse;\nimport com.nylas.models.DestroyBookingQueryParams;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\n\npublic class DeleteBookingPublic {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    DestroyBookingQueryParams queryParams = new DestroyBookingQueryParams.Builder()\n        .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n        .build();\n\n    DeleteResponse result = nylas.scheduler().bookings().destroy(\"<BOOKING_ID>\", queryParams, null);\n\n    System.out.println(\"Deleted booking: \" + result);\n  }\n}\n"
      - lang: java
        label: Java SDK (Private)
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.DeleteResponse;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\n\npublic class DeleteBooking {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build();\n\n    DeleteResponse result = nylas.scheduler().bookings().destroy(\"<BOOKING_ID>\", null, null);\n\n    System.out.println(\"Deleted booking: \" + result);\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Public)
        source: "import com.nylas.NylasClient\nimport com.nylas.models.DestroyBookingQueryParams\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val queryParams = DestroyBookingQueryParams.Builder()\n      .configurationId(\"<SCHEDULER_CONFIG_ID>\")\n      .build()\n\n  val result = nylas.scheduler().bookings().destroy(\"<BOOKING_ID>\", queryParams)\n\n  println(\"Deleted booking: $result\")\n}\n"
      - lang: kotlin
        label: Kotlin SDK (Private)
        source: "import com.nylas.NylasClient\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<SCHEDULER_SESSION_ID>\").build()\n\n  val result = nylas.scheduler().bookings().destroy(\"<BOOKING_ID>\")\n\n  println(\"Deleted booking: $result\")\n}\n"
      responses:
        '200':
          description: Delete Succeeded
          content:
            application/json:
              schema:
                type: object
                required:
                - request_id
                properties:
                  request_id:
                    type: string
                    description: ID of the request.
                    example: 5967ca40-a2d8-4ee0-a0e0-6f18ace39a90
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
      security:
      - SCHEDULER_SESSION_TOKEN: []
  /v3/scheduling/sessions:
    post:
      summary: Create a session
      tags:
      - Scheduling
      operationId: post-sessions
      description: 'Creates a new short-lived session that you can pass to the Scheduling Component to enforce user

        authentication. Your request must include the ID of an existing Configuration object.'
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request POST \\\n  --url \"https://api.us.nylas.com/v3/scheduling/sessions\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"configuration_id\": \"<SCHEDULER_CONFIGURATION_ID>\",\n    \"time_to_live\": 10\n  }'"
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function createSession() {\n  try {\n    const session = await nylas.scheduler.sessions.create({\n      requestBody: {\n        configurationId: \"<CONFIGURATION_ID>\",\n        timeToLive: 30,\n      },\n    });\n\n    console.log(\"Session:\", session);\n  } catch (error) {\n    console.error(\"Error creating session:\", error);\n  }\n}\n\ncreateSession();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nsession = nylas.scheduler.sessions.create(\n    request_body={\n        \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n        \"time_to_live\": 30,\n    },\n)\n\nprint(\"Created session:\", session)\n"
      - lang: ruby
        label: Ruby SDK
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\nrequest_body = {\n  \"configuration_id\": \"<SCHEDULER_CONFIG_ID>\",\n  \"time_to_live\": 30\n}\n\nsession, _request_ids = nylas.scheduler.sessions.create(request_body: request_body)\n\nputs session"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.CreateSessionRequest;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\nimport com.nylas.models.Response;\nimport com.nylas.models.Session;\n\npublic class CreateSession {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    CreateSessionRequest requestBody = new CreateSessionRequest.Builder()\n        .configurationId(\"<CONFIGURATION_ID>\")\n        .timeToLive(30)\n        .build();\n\n    Response<Session> session = nylas.scheduler().sessions().create(requestBody);\n\n    System.out.println(\"Session: \" + session.getData());\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\nimport com.nylas.models.CreateSessionRequest\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val requestBody = CreateSessionRequest.Builder()\n      .configurationId(\"<CONFIGURATION_ID>\")\n      .timeToLive(30)\n      .build()\n\n  val session = nylas.scheduler().sessions().create(requestBody)\n\n  println(\"Session: ${session.data}\")\n}\n"
      security:
      - NYLAS_API_KEY: []
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/session_create'
      responses:
        '200':
          $ref: '#/components/responses/session_create'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
  /v3/scheduling/sessions/{session_id}:
    parameters:
    - schema:
        type: string
      name: session_id
      in: path
      required: true
      description: The ID of the session to modify.
    delete:
      summary: Delete a session
      tags:
      - Scheduling
      operationId: delete-session
      description: Deletes a specific session.
      x-code-samples:
      - lang: bash
        label: cURL
        source: "curl --compressed --request DELETE \\\n  --url \"https://api.us.nylas.com/v3/scheduling/sessions/<SCHEDULER_SESSION_ID>\" \\\n  --header 'Accept: application/json' \\\n  --header 'Authorization: Bearer <NYLAS_API_KEY>' \\\n  --header 'Content-Type: application/json' "
      - lang: javascript
        label: Node.js SDK
        source: "import Nylas from \"nylas\";\n\nconst nylas = new Nylas({\n  apiKey: \"<NYLAS_API_KEY>\",\n  apiUri: \"<NYLAS_API_URI>\",\n});\n\nasync function deleteSession() {\n  try {\n    const result = await nylas.scheduler.sessions.destroy({\n      sessionId: \"<SESSION_ID>\",\n    });\n\n    console.log(\"Deleted session:\", result);\n  } catch (error) {\n    console.error(\"Error deleting session:\", error);\n  }\n}\n\ndeleteSession();\n"
      - lang: python
        label: Python SDK
        source: "from nylas import Client\n\nnylas = Client(\n    \"<NYLAS_API_KEY>\",\n    \"<NYLAS_API_URI>\",\n)\n\nresponse = nylas.scheduler.sessions.destroy(\n    session_id=\"<SESSION_ID>\",\n)\n\nprint(\"Session deleted:\", response)\n"
      - lang: ruby
        label: Ruby SDK
        source: "# Load gems\nrequire 'nylas'\n\n# Initialize Nylas client\nnylas = Nylas::Client.new(\n  api_key: \"<NYLAS_API_KEY>\"\n)\n\n_, request_ids = nylas.scheduler.sessions.destroy(session_id: \"<SCHEDULER_SESSION_ID>\")"
      - lang: java
        label: Java SDK
        source: "import com.nylas.NylasClient;\nimport com.nylas.models.DeleteResponse;\nimport com.nylas.models.NylasApiError;\nimport com.nylas.models.NylasSdkTimeoutError;\n\npublic class DeleteSession {\n  public static void main(String[] args) throws NylasSdkTimeoutError, NylasApiError {\n    NylasClient nylas = new NylasClient.Builder(\"<NYLAS_API_KEY>\").build();\n\n    DeleteResponse result = nylas.scheduler().sessions().destroy(\"<SESSION_ID>\");\n\n    System.out.println(\"Deleted session: \" + result);\n  }\n}\n"
      - lang: kotlin
        label: Kotlin SDK
        source: "import com.nylas.NylasClient\n\nfun main() {\n  val nylas = NylasClient.Builder(\"<NYLAS_API_KEY>\").build()\n\n  val result = nylas.scheduler().sessions().destroy(\"<SESSION_ID>\")\n\n  println(\"Deleted session: $result\")\n}\n"
      security:
      - NYLAS_API_KEY: []
      responses:
        '200':
          $ref: '#/components/responses/session_delete'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '504':
          $ref: '#/components/responses/504'
components:
  schemas:
    configuration_scheduler_email_template_booking_confirmed:
      description: Configurable settings specifically for booking confirmed emails.
      type: object
      properties:
        title:
          type: string
          description: The title to replace the default 'Booking Confirmed' title. This doesn't change the email subject line. Only visible in emails sent to guests.
        body:
          type: string
          description: The additional body to be appended after the default body. Only visible in emails sent to guests.
    configuration_participants_booking:
      description: The booking data for the participant. If omitted, the participant is not included in the booked event. At least one participant must have booking data.
      type: object
      required:
      - calendar_id
      properties:
        calendar_id:
          type: string
          description: 'The calendar ID that the event is created in.


            For an [Agent Account](/docs/v3/scheduler/agent-accounts/) participant, set this to

            `primary`. Scheduler creates booking events on an Agent Account''s primary calendar only.'
    configuration_scheduler_additional_fields:
      description: The definitions for additional fields to be displayed in the Scheduler UI. Guest will see the additional fields on the Scheduling Page when they book an event.
      type: object
      required:
      - label
      - type
      - required
      properties:
        label:
          type: string
          description: The text label to be displayed in the Scheduler UI.
        type:
          type: string
          description: The field type. If set to `metadata`, the field does not appear on email notifications and booking forms.
          enum:
          - text
          - multi_line_text
          - email
          - phone_number
          - dropdown
          - date
          - checkbox
          - radio_button
          - metadata
        required:
          type: boolean
          description: Whether the field is required to be filled out by the guest when booking an event.
        default:
          type: string
          description: "The default value for the field. \n\n- For the `metadata` type, this field stores the default metadata value.\n- For other types, this field sets the default value in the form, which is pre-filled when a guest books an event."
        pattern:
          type: string
          description: A regular expression pattern that the value of the field must match.
        order:
          type: integer
          description: The order in which the field will be displayed in the Scheduler UI. Fields with lower order values will be displayed first.
        options:
          type: array
          description: A list of options for the `dropdown` or `radio_button` types. This field is required for the `dropdown` and `radio_button` types.
          items:
            type: string
    common_response:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
    configuration_availability_rules:
      description: Availability rules for the scheduling configuration. These rules define how Nylas calculates availability for all participants.
      type: object
      properties:
        availability_method:
          description: 'The method that Nylas uses to calculate availability for all participants. For one-on-one

            meetings, the `availability_method` is always `collective`.


            The round-robin methods, `max-fairness` and `max-availability`, don''t support

            [Agent Account](/docs/v3/scheduler/agent-accounts/) participants. Use connected grants for

            round-robin pools.'
          type: string
          default: collective
          enum:
          - collective
          - max-fairness
          - max-availability
        buffer:
          type: object
          description: The amount of buffer time to add around existing meetings, in minutes. For example, if an account has a meeting scheduled from 10–11a.m., and you set a buffer of 30 minutes, Nylas treats 9:30–11:30a.m. as busy.
          $ref: '#/components/schemas/availability_buffer'
        default_open_hours:
          type: array
          description: A default set of open hours to apply to participants that don't define participant-level `open_hours`. You can overwrite these open hours for individual participants by specifying `open_hours` on the participant object. In Scheduler configurations, set `event_booking.timezone` to control the timezone used when Scheduler evaluates default open hours.
          items:
            $ref: '#/components/schemas/configuration_availability_open_hours'
        default_specific_time_availability:
          type: array
          description: 'Default specific date and time availability that applies to ALL participants in this configuration.

            These are merged with participant-specific entries, with participant entries taking precedence

            for the same date. Use this to define organization-wide special hours (e.g., holidays, events).'
          items:
            type: object
            required:
            - date
            - start
            - end
            properties:
              date:
                type: string
                description: The date in YYYY-MM-DD format.
                example: '2025-12-25'
              start:
                type: string
                description: 'The start time in HH:MM format (24-hour clock).

                  Use "00:00" with end "00:00" to mark the date as closed/unavailable.'
                example: 09:00
              end:
                type: string
                description: The end time in HH:MM format (24-hour clock).
                example: '13:00'
              timezone:
                type: string
                description: 'The timezone for this specific date entry (e.g., "America/New_York").

                  Required when using default_specific_time_availability to ensure proper timezone conversion

                  across participants. When specified, `event_booking.timezone` must also be set.'
                example: America/Toronto
        only_specific_time_availability:
          type: boolean
          description: 'When `true`, ALL participants will ONLY be available at times defined in `default_specific_time_availability`

            and their individual `specific_time_availability` entries. Regular `open_hours` and `default_open_hours`

            are completely ignored.


            This is useful for:

            - Temporary availability windows (e.g., hiring events, special booking periods)

            - Disabling all availability by setting to `true` with no specific dates defined


            **Note**: When set at the config level, individual participants cannot override this to `false`.'
          default: false
          example: true
    configuration_scheduler_email_template:
      type: object
      description: Configurable settings for booking emails.
      properties:
        booking_confirmed:
          $ref: '#/components/schemas/configuration_scheduler_email_template_booking_confirmed'
        logo:
          type: string
          description: 'The URL of a custom logo that is displayed at the top of the booking email. Replaces the default

            Nylas logo. The URL needs to be publicly accessible.'
        show_nylas_branding:
          type: boolean
          default: true
          description: When `true`, displays Nylas branding in the booking email.
    configuration_participants_specific_time_availability:
      description: 'A specific date and time range when the participant is available.

        Use "00:00" for both start and end to explicitly mark a date as unavailable.'
      type: array
      items:
        type: object
        required:
        - date
        - start
        - end
        properties:
          date:
            type: string
            description: The date in YYYY-MM-DD format.
            example: '2025-08-21'
          start:
            type: string
            description: 'The start time in HH:MM format (24-hour clock).

              Use "00:00" with end "00:00" to explicitly mark this date as unavailable.'
            example: 09:00
          end:
            type: string
            description: The end time in HH:MM format (24-hour clock).
            example: '17:00'
          timezone:
            type: string
            description: 'The timezone for this specific date (e.g., "America/New_York").

              Optional for participant-level entries. Uses the participant''s timezone if not specified.'
            example: America/Toronto
    configuration:
      type: object
      required:
      - participants
      - availability
      - event_booking
      properties:
        appearance:
          description: 'An object that defines the appearance settings for the Scheduling Page. This field

            may be `null` if no appearance customization has been set.'
          anyOf:
          - $ref: '#/components/schemas/configuration_appearance'
          - type: 'null'
        availability:
          $ref: '#/components/schemas/configuration_availability'
        event_booking:
          $ref: '#/components/schemas/configuration_event_booking'
        name:
          type: string
          description: The name of the Scheduling Page. If not defined, Nylas defaults to the organizer's name.
        participants:
          type: array
          description: 'A list of participants to be included in the scheduled event.


            Participants that provide availability (through an `availability` or `booking` block) must be

            associated with a valid Nylas grant, or the request fails. Participants supplied by email only

            don''t require a grant. They''re notification-only invitees who receive scheduling emails but don''t

            affect availability calculation and can''t be selected as a round-robin host.


            This field isn''t accepted for group or round-robin configurations, which are anchored to the

            organizer''s own grant and calendar instead.'
          items:
            $ref: '#/components/schemas/configuration_participants'
        requires_session_auth:
          type:
          - boolean
          - 'null'
          description: 'When `true`, the scheduling [Availability](/docs/reference/api/availability/) and

            [Bookings](/docs/reference/api/bookings/) endpoints require a valid session ID to

            authenticate requests using the specified Configuration. This field may be `null`

            if not explicitly set on the configuration; treat `null` the same as `false`

            (the default behavior).'
          default: false
        scheduler:
          $ref: '#/components/schemas/configuration_scheduler'
        slug:
          type:
          - string
          - 'null'
          description: 'The slug for the Configuration object. This is an optional, unique identifier. You can use the

            slug instead of the `configuration_id` when making requests to the Nylas Scheduling endpoints.

            Slugs are unique to each Nylas application. This field may be `null` if no slug has been set.'
    common_response_with_cursor:
      properties:
        request_id:
          type: string
          description: The request ID.
        data:
          type: object
          description: The response object.
        next_cursor:
          type:
          - string
          - 'null'
          description: A cursor pointing to the next page of results for the request.
      example:
        request_id: 5fa64c92-e840-4357-86b9-2aa364d35b88
        next_cursor: CigKGjRlaDdyNGQydTFqbWJ0bGo5a2QxdWJtdDZnGAEggIDAu7fw7bEYGg8IABIAGPjh2PGEi_0CIAEiBwgCEOqs6i4=
    configuration_availability:
      type: object
      description: The rules that determine the available time slots for the event.
      required:
      - duration_minutes
      properties:
        duration_minutes:
          type: integer
          description: The total number of minutes the event should last.
        interval_minutes:
          type: integer
          description: The interval between meetings. Nylas checks from the nearest interval of the passed `start_time`. For example, you schedule 30-minute meetings (`duration_minutes`) with 15 minutes between them (`interval_minutes`). If you have a meeting starting at 9:59, the API returns times starting at 10:00 (10:00-10:30, 10:15-10:45).
        round_to:
          type: integer
          default: 15
          description: Nylas rounds each time slot to the nearest `round_to` value. For example, if a time slot starts at 9:05a.m. and `round_to` is set to `15`, Nylas rounds it to 9:15a.m. Must be a multiple of 5 minutes.
        availability_rules:
          $ref: '#/components/schemas/configuration_availability_rules'
    configuration_event_booking:
      type: object
      required:
      - title
      properties:
        booking_type:
          type: string
          description: 'The booking type. If set to `booking`, Scheduler follows the

            [standard booking flow](/docs/v3/scheduler/customize-booking-flows/).


            If set to `organizer-confirmation`, Scheduler creates an event marked "Pending" in the organizer''s

            calendar and sends a confirmation request email to the organizer. The confirmation request email

            includes a link to a page where the organizer can confirm or cancel the booking.'
          enum:
          - booking
          - organizer-confirmation
          default: booking
          example: booking
        conferencing:
          $ref: '#/components/schemas/event_conferencing_request'
        description:
          type: string
          description: The description of the event.
          example: Come ready to talk philosophy!
        disable_emails:
          type:
          - boolean
          - 'null'
          description: 'When `true`, Nylas doesn''t send email notifications when an event is booked, cancelled, or

            rescheduled. When `null`, the default behavior applies (emails are sent).'
          default: false
          example: false
        hide_participants:
          type:
          - boolean
          - 'null'
          description: When `true`, Nylas creates the event with `hide_participants=true`, so the host can see who's on the event but the guests cannot. When `null`, the default behavior applies (participants are visible).
          default: false
          example: false
        location:
          type: string
          description: The location of the event.
          example: Central Library, room 203
        notify_participants:
          type:
          - boolean
          - 'null'
          description: 'When `true`, the calendar provider sends notifications to participants when the

            event is created, updated, or deleted. Microsoft grants ignore this flag and

            always notify participants. This field may be `null` if not explicitly set on

            the configuration; treat `null` the same as `false` (the default behavior).'
          default: false
          example: true
        reminders:
          type: array
          required:
          - minutes_before_event
          - type
          items:
            type: object
            properties:
              email_subject:
                type: string
                description: (Email reminders only) The subject line of the email reminder.
                example: 'Reminder: Annual Philosophy Club Meeting'
              minutes_before_event:
                type: integer
                description: The number of minutes before the event to send the reminder.
                minimum: 1
                example: 30
              recipient:
                type: string
                description: (Email reminders only) Who should receive the reminder.
                enum:
                - all
                - host
                - guest
                default: all
                example: host
              type:
                type: string
                description: The reminder type.
                enum:
                - email
                - webhook
                example: email
        timezone:
          type: string
          description: 'The timezone Nylas uses to display times in confirmation messages and reminders. This must be

            an [IANA-formatted string](https://en.wikipedia.org/wiki/Tz_database).'
          minLength: 1
          example: America/Chicago
        title:
          type: string
          description: The title of the event.
          example: Annual Philosophy Club Meeting
    meeting_settings_common:
      type: object
      description: A collection of settings for the Notetaker bot.
      properties:
        action_items:
          type: boolean
          description: 'When `true`, Notetaker generates a list of action items from the meeting. If `action_items` is

            `true`, `video_recording`, `audio_recording`, and `transcription` must also be `true`.'
          default: true
          example: true
        action_items_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              description: 'A custom prompt to pass to Nylas'' AI model and specify settings for the list of action items

                it generates. `action_items` must be `true` to use this field.'
              example: Only return the 5 most important action items.
        audio_recording:
          type: boolean
          description: When `true`, Notetaker records the meeting's audio.
          default: true
          example: true
        leave_after_silence_seconds:
          type: integer
          description: 'The number of seconds of silence after which the Notetaker bot automatically leaves

            the meeting. This helps end recordings when meetings have concluded but participants

            haven''t disconnected the call. Must be between 10 and 3600 seconds (1 hour).'
          minimum: 10
          maximum: 3600
          default: 300
          example: 360
        summary:
          type: boolean
          description: 'When `true`, Notetaker generates a summary of the meeting. If `summary` is `true`,

            `video_recording`, `audio_recording`, and `transcription` must also be `true`.'
          default: true
          example: true
        summary_settings:
          type: object
          properties:
            custom_instructions:
              type: string
              description: 'A custom prompt to pass to Nylas'' AI model and specify settings for the summary it generates.

                `summary` must be `true` to use this field.'
              example: Return this summary in the MEDPIC sales methodology.
        transcription:
          type: boolean
          description: 'When `true`, Notetaker transcribes the meeting''s audio. If `transcription` is `true`,

            `video_recording` and `audio_recording` must also be `true`.'
          default: true
          example: true
        video_recording:
          type: boolean
          description: When `true`, Notetaker records the meeting's video.
          default: true
          example: true
    configuration_availability_open_hours:
      description: Open hours settings for a participant.
      type: object
      title: Open Hours
      examples: []
      properties:
        days:
          type: array
          description: The days of the week that the open hour settings are applied to. Sunday corresponds to `0`, and Saturday corresponds to `6`.
          items:
            type: integer
          example:
          - 0
          - 1
          - 2
        start:
          type: string
          minLength: 1
          description: The start time in 24-hour time format. Single-digit hours doesn't have a leading zero. The earliest start time is `0:00`, and the latest start time is `23:49`.
          example: '10:00'
        end:
          type: string
          minLength: 1
          description: The end time in a 24-hour time format. Single-digit hours doesn't have a leading zero.
          example: '14:00'
        timezone:
          type: string
          minLength: 1
          description: 'The timezone for this open-hours block, as an [IANA-formatted](https://en.wikipedia.org/wiki/Tz_database) string.


            For participant `open_hours`, this value applies only to the open-hours block where you define it and overrides the participant''s `timezone`. If you omit it, Scheduler uses the participant''s `timezone`, then `event_booking.timezone`.


            For `default_open_hours` in Scheduler configurations, set `event_booking.timezone` to control the timezone that Scheduler uses when evaluating default open hours.'
          example: America/Chicago
        exdates:
          type: array
          description: A list of dates that are excluded from the open hours. Dates should be formatted as `YYYY-MM-DD`.
          items:
            type: string
          example:
          - '2006-01-18'
    configuration_participants_availability:
      description: The availability data for the participant. If omitted, the participant is considered to be available at all times. At least one participant must have availability data.
      type: object
      required:
      - calendar_ids
      properties:
        calendar_ids:
          type: array
          description: 'A list of calendar IDs associated with the participant''s email address. These calendars are

            used to check the participant''s availability.


            For an [Agent Account](/docs/v3/scheduler/agent-accounts/) participant, set this to

            `["primary"]`. Scheduler reads busy time from an Agent Account''s primary calendar only.'
          items:
            type: string
        open_hours:
          type: array
          description: An array of objects for the participant's open hours. Nylas searches for free time slots within these open hours.
          items:
            $ref: '#/components/schemas/configuration_availability_open_hours'
    configuration_appearance:
      title: appearance
      type: object
      description: Appearance settings definitions for the Scheduling Page.
      properties:
        your-key:
          type: string
          description: A key-value pair. For pre-defined keys for hosted Scheduling Pages, see [Styling options for hosted Scheduling Pages](/docs/v3/scheduler/customize-scheduler/#styling-options-for-hosted-scheduling-pages).
          maxLength: 550
    group-configuration:
      type: object
      required:
      - group_booking
      - name
      - type
      properties:
        appearance:
          $ref: '#/components/schemas/configuration_appearance'
        group_booking:
          type: object
          description: Settings for the group booking.
          required:
          - calendar_id
          properties:
            booking_type:
              type: string
              description: 'The booking type. Group Configurations support `booking` only, and follow the

                [standard booking flow](/docs/v3/scheduler/customize-booking-flows/).'
              default: booking
              example: booking
            calendar_id:
              type: string
              description: 'The ID of the calendar on which the group event is created. Nylas doesn''t support read-only

                calendars.'
              example: primary
            disable_emails:
              type:
              - boolean
              - 'null'
              description: 'When `true`, Nylas doesn''t send email notifications when an event is booked, cancelled, or

                rescheduled. When `null`, the default behavior applies (emails are sent).'
              default: false
              example: false
            reminders:
              type: array
              description: A list of reminders for the event.
              items:
                type: object
                required:
                - minutes_before_event
                - type
                properties:
                  email_subject:
                    type: string
                    description: (Email reminders only) The subject line for the email reminder.
                    example: 'Reminder: Your physiotherapy appointment'
                  minutes_before_event:
                    type: integer
                    description: The number of minutes before the event to send the reminder.
                    minimum: 1
                    example: 30
                  recipient:
                    type: string
                    description: (Email reminders only) Who should receive the email reminder.
                    enum:
                    - host
                    - guest
                    example: host
                  type:
                    type: string
                    description: The reminder type.
                    enum:
                    - email
                    - webhook
                    example: email
        name:
          type: string
          description: The name of the Scheduling Page.
          example: InPath Physiotherapy
        requires_session_auth:
          type:
          - boolean
          - 'null'
          description: 'When `true`, the [Availability](/docs/reference/api/availability/) and

            [Bookings](/docs/reference/api/bookings/) endpoints require a valid session ID to

            authenticate requests using the specified Configuration. This field may be `null`

            if not explicitly set on the configuration; treat `null` the same as `false`

            (the default behavior).'
          default: false
          example: false
        scheduler:
          $ref: '#/components/schemas/configuration_scheduler'
        slug:
          type:
          - string
          - 'null'
          description: 'The slug for the Configuration object. This is an optional, unique identifier. You can use the

            slug instead of the `configuration_id` when making requests to the Nylas Scheduling endpoints.

            Slugs are unique to each Nylas application. This field may be `null` if no slug has been set.'
        type:
          type: string
          description: 'The type of event supported by the Configuration. When set to `group`, enables access to the

            [Group Events endpoints](/docs/reference/api/group-events/) and functionality.

            Defaults to empty (`""`) for all existing Configurations.'
          example: group
    configuration_participants:
      type: object
      description: List of participants for the scheduling Configuration.
      required:
      - availability
      - booking
      - email
      properties:
        availability:
          $ref: '#/components/schemas/configuration_participants_availability'
        booking:
          $ref: '#/components/schemas/configuration_participants_booking'
        email:
          type: string
          description: 'The participant''s email address.


            If the participant provides an `availability` or `booking` block, this email address must be

            associated with a valid Nylas grant, or the request fails. Participants supplied by email only

            (no `availability` or `booking` block) don''t require a grant. They''re treated as notification-only

            invitees: they still receive scheduling emails, but they don''t affect availability or free-busy

            calculation and can''t be selected as a round-robin host.'
          example: nyla@example.com
        grant_id:
          type: string
          description: The participant's grant ID.
        is_organizer:
          type: boolean
          description: 'When `true`, indicates that the participant is the organizer of the event.


            For non-round-robin meetings, one of the participants must be specified as the organizer. For

            round-robin meetings, remove the `is_organizer` key/value pair or set `is_organizer` to `false`

            for all participants.'
          default: false
          example: false
        name:
          type: string
          description: The participant's name.
          example: Nyla
        specific_time_availability:
          $ref: '#/components/schemas/configuration_participants_specific_time_availability'
        only_specific_time_availability:
          type: boolean
          description: 'When `true`, this participant will ONLY be available at times defined in their

            `specific_time_availability` entries. Their regular `open_hours` are ignored.


            If the config-level `availability_rules.only_specific_time_availability` is `true`,

            this participant-level setting cannot override it to `false`.


            Setting to `true` with an empty `specific_time_availability` array results in

            zero availability for this participant (useful for temporarily disabling someone).'
          default: false
          example: true
        timezone:
          type: string
          description: 'The timezone in which the participant is located, as an

            [IANA-formatted](https://en.wikipedia.org/wiki/Tz_database) string. Nylas uses this when

            calculating the participant''s open hours, and in email notifications.


            If a participant `open_hours` block includes its own `timezone`, the open-hours timezone

            overrides this participant timezone for that block. If participant `open_hours` doesn''t include

            a `timezone`, Scheduler uses this participant timezone, then `event_booking.timezone`.'
          example: America/Toronto
    meeting_settings:
      allOf:
      - $ref: '#/components/schemas/meeting_settings_common'
      - type: object
        properties:
          transcription_settings:
            type: object
            nullable: true
            description: "Optional settings that tune how Notetaker transcribes audio. `transcription` must be\n`true` for these settings to take effect. Provide any combination of the fields below.\n\nThe fields fall into two independent groups:\n\n- **Language hints** (`expected_languages`, `fallback_language`) constrain automatic\n  language detection. This declares the languages you expect; it does not translate\n  transcripts or force the recording into a specific language.\n- **Keyword hints** (`keywords`, `use_speaker_names_as_keywords`) bias recognition toward\n  domain-specific terms such as names, acronyms, and product names.\n\nSet on individual Notetakers, on calendar sync, or on event sync. When set on a calendar,\nevents inherit the value unless the event's own request overrides it. Send `null` or `{}`\nto clear inherited settings and return to default transcription behavior.\n\nSee [Set transcription languages](/docs/v3/notetaker/#set-transcription-languages) for\nsupported language codes and validation rules."
            properties:
              expected_languages:
                type: array
                description: 'Language codes the audio is expected to contain. Optional. When provided, it must

                  contain at least one supported code and cannot be `null` or empty. When omitted,

                  transcription considers all supported languages.'
                minItems: 1
                items:
                  type: string
                example:
                - en
                - es
              fallback_language:
                type: string
                description: 'Language to use if Notetaker does not detect one of the `expected_languages`. Optional.

                  When `expected_languages` is set, the fallback must be one of those codes. When

                  `expected_languages` is omitted, transcription considers all supported languages and

                  the fallback may be any supported code. When `fallback_language` is omitted, the

                  transcriber auto-detects the language. The field is not stored, so responses do not

                  return it.'
                example: en
              keywords:
                type: array
                description: 'Domain-specific terms that bias transcription toward recognizing them correctly, such

                  as names, acronyms, and product names. Optional. Up to 200 terms; each term must be

                  1 to 200 characters and cannot contain control characters. Cannot be `null`.'
                maxItems: 200
                items:
                  type: string
                  maxLength: 200
                example:
                - Nylas
                - AssemblyAI
              use_speaker_names_as_keywords:
                type: boolean
                description: 'When `true`, Notetaker adds known speaker names to the keyword set so they are

                  transcribed accurately. Optional. Cannot be `null`.'
                example: true
    event_conferencing_request:
      title: Event with conferencing
      type: object
      description: 'An object that lets you automatically create a conference, or enter conferencing details manually.


        You can''t use `autocreate` and `details` in the same request. If you do, Nylas returns an error.


        Nylas stores conference information in the event description. To remove conference details, set

        `conferencing` to `{}` and remove the corresponding conference information from the description in

        the same request.'
      oneOf:
      - title: Auto-conferencing
        type: object
        description: Let Nylas autocreate the conference link.
        properties:
          provider:
            type: string
            description: The conferencing provider that Nylas uses to create the conference.
            enum:
            - Google Meet
            - Zoom Meeting
            - Microsoft Teams
          autocreate:
            type: object
            description: 'When you include `autocreate` in your request, Nylas automatically creates the conference

              for the event and appends the conferencing details to the event description.


              If the `provider` is `Zoom Meeting`, your Zoom OAuth app must include the following

              [granular scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-granular/)

              for Nylas to manage meetings on behalf of the user:


              - `meeting:write:meeting` — required to **create** Zoom meetings.

              - `meeting:update:meeting` — required to **update** Zoom meetings (for example, when event time or title changes).

              - `meeting:delete:meeting` — required to **delete** Zoom meetings (when events are removed).


              If any of these scopes are missing, the Zoom API rejects the request. After adding scopes

              to your Zoom app, affected users must re-authenticate their grant so their access tokens

              include the new scopes.'
            properties:
              conf_grant_id:
                type: string
                description: 'The grant ID of the account that hosts the conference. The user that belongs to this

                  grant acts as the conference host: they join the conference at the scheduled time and

                  admit other participants during the meeting.


                  Include `conf_grant_id` when the conferencing `provider` isn''t available on the user''s

                  own account — for example, when the `provider` is `Google Meet` but the user

                  authenticated with a Microsoft account (cross-provider autocreation). When the

                  `provider` is `Zoom Meeting`, `conf_grant_id` is always required.'
              conf_settings:
                type: object
                additionalProperties: true
                description: 'Optional provider-specific settings that Nylas passes through when it creates the

                  conference. For `Zoom Meeting`, each key is sent as a top-level parameter to

                  [Zoom''s Create a Meeting API](https://developers.zoom.us/docs/api/rest/reference/zoom-api/methods/#operation/meetingCreate)

                  — for example, `agenda`, `password`, or Zoom''s own `settings` object. Nylas does _not_

                  validate these values. They can make your Zoom integration more accessible but

                  potentially less secure, so review your organization''s security requirements.'
      - title: Google Meet
        type: object
        description: Manually attach Google Meet details to the event.
        properties:
          provider:
            type: string
            enum:
            - Google Meet
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Google Meet conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Google Meet conference.
              phone:
                type: array
                items:
                  type: string
                description: 'The phone number associated with the Google Meet conference. This array accepts only

                  one phone number.'
              pin:
                type: string
                description: The PIN associated with the Google Meet conference, if applicable.
      - title: Zoom Meeting
        type: object
        description: Manually attach Zoom Meeting details to the event.
        properties:
          provider:
            type: string
            enum:
            - Zoom Meeting
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Zoom conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Zoom conference.
              meeting_code:
                type:
                - string
                - 'null'
                description: A unique ID associated with the Zoom conference.
              password:
                type:
                - string
                - 'null'
                description: The password for the Zoom conference, if applicable.
      - title: Microsoft Teams
        type: object
        description: Manually attach Microsoft Teams details to the event.
        properties:
          provider:
            type: string
            enum:
            - Microsoft Teams
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Microsoft Teams conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Microsoft Teams conference.
      - title: Teams for Business
        type: object
        description: Manually attach Teams for Business details to the event.
        properties:
          provider:
            type: string
            enum:
            - Teams for Business
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Microsoft Teams for Enterprise conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Microsoft Teams for Enterprise conference.
      - title: Skype for Consumer
        type: object
        description: Manually attach Skype for Consumer details to the event.
        properties:
          provider:
            type: string
            enum:
            - Skype for Consumer
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Skype for Consumer conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Skype for Consumer conference.
      - title: Skype for Business
        type: object
        description: Manually attach Skype for Business details to the event.
        properties:
          provider:
            type: string
            enum:
            - Skype for Business
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains Skype for Business conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the Skype for Business conference.
      - title: WebEx
        type: object
        description: Manually attach WebEx details to the event.
        properties:
          provider:
            type: string
            enum:
            - WebEx
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains WebEx conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the WebEx conference.
              password:
                type: string
                description: The password for the WebEx conference, if applicable.
              pin:
                type: string
                description: The PIN for the WebEx conference, if applicable.
              phone:
                type: array
                items:
                  type: string
                description: The phone number associated with the WebEx conference.
      - title: GoToMeeting
        type: object
        description: Manually attach GoToMeeting details to the event.
        properties:
          provider:
            type: string
            enum:
            - GoToMeeting
            description: The conferencing provider for the event.
          details:
            type: object
            description: An object that contains GoToMeeting conferencing details.
            required:
            - url
            properties:
              url:
                type: string
                description: The URL for the GoToMeeting conference.
              meeting_code:
                type: string
                description: A unique ID associated with the GoToMeeting conference.
              password:
                type: string
                description: The password for the GoToMeeting conference, if applicable.
              phone:
                type: array
                items:
                  type: string
                description: The phone number associated with the GoToMeeting conference.
    availability_buffer:
      title: buffer
      type: object
      properties:
        before:
          type: integer
          description: 'The amount of buffer time to add before meetings, in increments of five minutes. For example,

            if an account has a meeting scheduled from 10:00–11:00a.m., and you set a `before` buffer of

            30 minutes, Nylas treats 9:30–11:00a.m. as busy.


            This value must be between 0 and 120, and must be divisible by 5.'
          default: 0
          minimum: 0
          maximum: 120
        after:
          type: integer
          description: 'The amount of buffer time to add after meetings, in increments of five minutes. For example, if

            an account has a meeting scheduled from 10:00–11:00a.m., and you set an `after` buffer of 15

            minutes, Nylas treats 10:00–11:15a.m. as busy.


            This value must be between 0 and 120, and must be divisible by 5.'
          default: 0
          minimum: 0
          maximum: 120
    configuration_scheduler:
      type: object
      properties:
        additional_fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/configuration_scheduler_additional_fields'
        available_days_in_future:
          type: integer
          description: The number of days in the future that Scheduler is available for scheduling events.
          default: 30
        min_booking_notice:
          type:
          - integer
          - 'null'
          description: The minimum number of minutes in the future that a user can make a new booking. This field may be `null` if not explicitly set on the configuration; treat `null` the same as `60` (the default behavior).
          default: 60
        min_cancellation_notice:
          type: integer
          description: The minimum number of minutes before a booking can be cancelled.
          default: 0
        cancellation_policy:
          type: string
          description: A message about the cancellation policy to display to users when booking an event.
        rescheduling_url:
          type: string
          description: The URL used to reschedule bookings. This URL is included in confirmation messages.
        cancellation_url:
          type: string
          description: The URL used to cancel bookings. This URL is included in confirmation messages.
        organizer_confirmation_url:
          type: string
          description: 'The URL used to confirm or cancel pending bookings. This URL is included in booking request

            messages.'
        confirmation_redirect_url:
          type: string
          description: The URL that Nylas redirects the user to when the booking is confirmed.
        hide_rescheduling_options:
          type: boolean
          description: If `true`, the option to reschedule an event is hidden in booking confirmations and email notifications.
          default: false
        hide_cancellation_options:
          type: boolean
          description: If `true`, the option to cancel an event is hidden in booking confirmations and email notifications.
          default: false
        hide_additional_guests:
          type: boolean
          description: Whether to hide the **Additional guests** field on the Scheduling Page. If `true`, guests cannot invite additional guests to the event.
          default: false
        notetaker_settings:
          type: object
          description: 'Settings for automatically adding a Notetaker bot to bookings created with this configuration.

            When enabled, Notetaker joins the meeting to record, transcribe, and optionally generate

            summaries and action items. Requires `event_booking.conferencing` to be configured.'
          properties:
            enabled:
              type: boolean
              description: 'When `true`, automatically creates a Notetaker bot for bookings made with this configuration.

                The bot joins the meeting at the scheduled time to record and transcribe.'
              default: false
              example: true
            show_ui_consent_message:
              type: boolean
              description: 'When `true`, displays a consent message in the Scheduler UI informing guests that the

                meeting will be recorded.'
              default: true
              example: true
            notetaker_name:
              type: string
              description: 'The display name for the Notetaker bot that joins the meeting.

                Maximum 255 characters.'
              default: Nylas Notetaker
              example: Sales Recording Bot
            meeting_settings:
              $ref: '#/components/schemas/meeting_settings'
        email_template:
          $ref: '#/components/schemas/configuration_scheduler_email_template'
